{front:"WMI Persistence",back:"WMI event subscriptions creating a trigger (event filter) + handler (event consumer) pair. Executes code when specified events occur (e.g., startup). Fileless capable — consumer can run PowerShell from internet. Detected by: WMI audit logs, scanning WMI repository."},
{front:"USBSTOR",back:"Windows registry key (HKLM\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR) recording all USB storage devices ever connected. Used in insider threat investigations to prove which USB device connected and when. Combine with DLP logs and Shellbags for complete USB forensics."},
{front:"EPSS vs CVSS",back:"CVSS = technical severity (0-10): how bad IF exploited. EPSS = exploitation likelihood (0-1): how likely to BE exploited in 30 days. Best practice: combine both. High-EPSS/medium-CVSS may rank above low-EPSS/critical-CVSS for remediation priority."},
{front:"False Positive Management",back:"Process of identifying and suppressing scanner findings confirmed as non-issues (e.g., patched vulnerabilities reported based on version string). Each suppression documented with justification and review date. Improves signal quality; reduces alert fatigue."},
{front:"DMARC",back:"Domain-based Message Authentication, Reporting, and Conformance. Policy layered on SPF and DKIM that tells receiving servers what to do when checks fail: none (monitor), quarantine (spam folder), reject (block). Prevents email spoofing of your domain."},
{front:"Threat Intelligence Platform (TIP)",back:"Centralizes threat intelligence collection, processing, analysis, and dissemination. Aggregates feeds (STIX/TAXII), enriches IOCs, manages relationships between indicators, and pushes actionable intelligence to security controls. Examples: MISP, ThreatConnect, Anomali."},
{front:"Honeypot",back:"Decoy system designed to attract attackers and learn their techniques. High-interaction (real OS, real services) vs low-interaction (emulated). Any traffic to a honeypot is suspicious — no legitimate user should interact with it. Provides early warning and attacker intelligence."},
{front:"Playbook",back:"Documented, step-by-step IR procedures for specific incident types. Reduces response time and ensures consistent handling. Covers: detection criteria, escalation paths, containment steps, evidence collection, communication, and post-incident actions. Should be practiced via tabletop exercises."}
];

}

window.renderQuizHome=renderQuizHome;

function startQuiz(dom){
  S.quiz.dom=dom;
  var pool;
  if(dom===0){
    var wp=[];
    for(var d=1;d<=4;d++){
      var dqs=shuffle(QZ.filter(function(q){return q.d==d;}));
      var cnt=Math.round(20*DOMAIN_WEIGHTS[d]/100);
      wp=wp.concat(dqs.slice(0,Math.max(1,cnt)));
    }
    pool=shuffle(wp);
  } else {
    pool=shuffle(QZ.filter(function(q){return q.d==dom;}));
  }
  S.quiz.qs=pool.slice(0,20);
  S.quiz.idx=0;S.quiz.sel=null;S.quiz.checked=false;S.quiz.score=0;S.quiz.total=0;
  _quizOptMap=[];renderQuizQ();
}
window.startQuiz=startQuiz;

function startWeakQuiz(){
  var worst=1,ws=101;
  for(var d=1;d<=4;d++){var ds=S.stats.domainScores[d];var sc=ds&&ds.total>0?ds.correct/ds.total*100:50;if(sc<ws){ws=sc;worst=d;}}
  startQuiz(worst);
}
window.startWeakQuiz=startWeakQuiz;

var _quizOptMap=[];
function renderQuizQ(){
  var q=S.quiz.qs[S.quiz.idx];
  if(!q){renderQuizResults();return;}
  var pct=Math.round(S.quiz.idx/S.quiz.qs.length*100);
  if(!_quizOptMap.length)_quizOptMap=shuffle([0,1,2,3]);
  var opts="";
  for(var di=0;di<_quizOptMap.length;di++){
    var oi=_quizOptMap[di];
    if(oi>=q.o.length)continue;
    var isC=oi===q.a,selOi=S.quiz.sel!==null?_quizOptMap[S.quiz.sel]:-1;
    var isW=S.quiz.checked&&oi===selOi&&!isC;
    var cls="ans"+(S.quiz.checked?(isC?" hit":isW?" miss":" dim"):(S.quiz.sel===di?" sel":""));
    opts+="<button class='"+cls+"' onclick='"+(S.quiz.checked?"":"selectQuizAns("+di+")")+"'>" +
      "<span class='ltr'>"+["A","B","C","D"][di]+"</span>"+q.o[oi]+"</button>";
  }
  var btn=S.quiz.checked?
    "<div style='background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--tx2);line-height:1.6'><b style='color:var(--gn)'>"+q.o[q.a]+"</b> — "+q.e+"</div>" +
    "<button class='btn btn-p btn-full' onclick='nextQuizQ()'>"+(S.quiz.idx+1>=S.quiz.qs.length?"See Results":"Next →")+"</button>" :
    "<button class='btn btn-p btn-full' onclick='checkQuiz()' "+(S.quiz.sel===null?"disabled style='opacity:.4;cursor:not-allowed'":"")+(S.quiz.sel===null?"":"")+">Check Answer</button>";
  render("<div class='pg'>" +
    "<div class='row' style='margin-bottom:14px'>" +
      "<button class='btn btn-s' onclick='renderQuizHome()'>← Back</button>" +
      "<div style='flex:1'><div class='prog-bar'><div class='prog-fill' style='width:"+pct+"%'></div></div>" +
        "<div style='font-size:11px;color:var(--tx4);margin-top:4px'>"+(S.quiz.idx+1)+" of "+S.quiz.qs.length+" · "+DOMAIN_NAMES[q.d]+"</div>" +
      "</div>" +
      "<span style='font-size:13px;font-weight:700;color:var(--gn)'>"+S.quiz.score+"/"+S.quiz.idx+"</span>" +
    "</div>" +
    "<div class='card' style='margin-bottom:14px'>" +
      "<span style='background:"+DOMAIN_BG[q.d]+";color:"+DOMAIN_COLORS[q.d]+";padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-bottom:10px;display:inline-block'>D"+q.d+" · "+DOMAIN_NAMES[q.d]+"</span>" +
      "<div style='font-size:15px;font-weight:600;line-height:1.6;color:var(--tx)'>"+q.q+"</div>" +
    "</div>" +
    opts+btn+"</div>");
}
window.renderQuizQ=renderQuizQ;
window.selectQuizAns=function(i){S.quiz.sel=i;renderQuizQ();};
window.checkQuiz=function(){
  if(S.quiz.sel===null)return;
  S.quiz.checked=true;
  var q=S.quiz.qs[S.quiz.idx];
  var selOrig=_quizOptMap[S.quiz.sel];
  var ok=selOrig===q.a;
  if(ok)S.quiz.score++;
  S.quiz.total++;
  if(!S.stats.domainScores[q.d])S.stats.domainScores[q.d]={correct:0,total:0};
  S.stats.domainScores[q.d].total++;
  if(ok)S.stats.domainScores[q.d].correct++;
  S.stats.correct+=ok?1:0;S.stats.total++;save();renderQuizQ();
};
window.nextQuizQ=function(){S.quiz.idx++;S.quiz.sel=null;S.quiz.checked=false;_quizOptMap=[];renderQuizQ();};

  var pct=Math.round(S.quiz.score/S.quiz.qs.length*100);
  var col=pct>=83?"var(--gn)":pct>=70?"var(--ye)":"var(--rd)";
  render("<div class='pg' style='text-align:center'>" +
    "<div class='card2' style='margin-bottom:20px;padding:32px 20px'>" +
      "<div style='font-size:48px;margin-bottom:8px'>🎯</div>" +
      "<div style='font-family:Syne,sans-serif;font-size:48px;font-weight:800;color:"+col+"'>"+pct+"%</div>" +
      "<div style='font-size:16px;margin-bottom:6px'>"+S.quiz.score+" / "+S.quiz.qs.length+" correct</div>" +
      "<div style='font-size:13px;color:var(--tx3)'>"+(pct>=83?"Solid — aim for this on exam day!":pct>=70?"Getting there — review domain notes.":"Review missed topics and try again.")+"</div>" +
    "</div>" +
    "<div style='display:flex;gap:10px;justify-content:center;flex-wrap:wrap'>" +
      "<button class='btn btn-p' onclick='startQuiz("+S.quiz.dom+")'>Try Again</button>" +
      "<button class='btn btn-s' onclick='renderQuizHome()'>New Quiz</button>" +
      "<button class='btn btn-s' onclick=\"setTab('home')\">Home</button>" +
    "</div></div>");
}

function startExam(size){
  size=size||EXAM_Q;
  var pool=[];
  for(var d=1;d<=4;d++){
    var dqs=shuffle(QZ.filter(function(q){return q.d==d;}));
    var cnt=Math.round(size*DOMAIN_WEIGHTS[d]/100);
    pool=pool.concat(dqs.slice(0,Math.min(cnt,dqs.length)));
  }
  if(pool.length<size){
    var ex=shuffle(QZ).filter(function(q){return pool.indexOf(q)<0;});
    pool=pool.concat(ex.slice(0,size-pool.length));
  }
  pool=shuffle(pool).slice(0,size);
  var maxTime=size===43?4800:size>100?size*60:EXAM_SECS;
  S.exam={qs:pool,cur:0,ans:{},flagged:[],started:true,done:false,timer:maxTime,iv:null,ngb:false,optMaps:pool.map(function(){return shuffle([0,1,2,3]);})};
  S.exam.iv=setInterval(function(){S.exam.timer--;updateTimerDisplay();if(S.exam.timer<=0){clearInterval(S.exam.iv);finishExam(true);}},1000);
  renderExamQ();
}

  el.textContent=(h>0?h+":":"")+(m<10&&h>0?"0":"")+m+":"+(s<10?"0":"")+s;
  el.style.color=t<300?"var(--rd)":t<600?"var(--ye)":"var(--tx)";
}

function finishExam(timeUp){
  clearInterval(S.exam.iv);
  var e=S.exam;
  var correct=0,byD={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}};
  var total=e.qs.length;
  if(total===0){renderExamHome();return;}
  for(var i=0;i<total;i++){
    var q=e.qs[i];byD[q.d].t++;
    if(e.ans[i]!==undefined){var so=e.optMaps[i][e.ans[i]];if(so===q.a){correct++;byD[q.d].c++;}}
  }
  var pct=Math.round(correct/total*100);
  var rp=pct/100;
  var scaled=rp>=0.83?Math.round(750+(rp-0.83)/0.17*150):
             rp>=0.70?Math.round(680+(rp-0.70)/0.13*70):
             rp>=0.50?Math.round(550+(rp-0.50)/0.20*130):
             Math.round(rp/0.50*550);
  scaled=Math.max(100,Math.min(900,scaled));
  e.done=true;e.score=correct;e.scaled=scaled;
  S.stats.sessions++;S.stats.correct+=correct;S.stats.total+=total;
  for(var d=1;d<=4;d++){
    if(!S.stats.domainScores[d])S.stats.domainScores[d]={correct:0,total:0};
    S.stats.domainScores[d].correct+=byD[d].c;S.stats.domainScores[d].total+=byD[d].t;
  }
  save();
  window._lastExam={qs:e.qs,ans:e.ans,optMaps:e.optMaps};
  renderExamResults(correct,total,scaled,byD,timeUp);
}

function toggleMissedReview(){
  var el=document.getElementById("missed-review"),btn=document.getElementById("review-btn");
  if(!el||!window._lastExam)return;
  if(el.style.display==="none"){
    var ex=window._lastExam,items="<div class='card' style='margin-bottom:16px'><h2 class='stitle' style='color:var(--rd)'>❌ Missed Questions</h2>",count=0;
    for(var i=0;i<ex.qs.length;i++){
      var q=ex.qs[i];
      if(ex.ans[i]===undefined){
        count++;
        items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
          "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--ye0);color:var(--ye);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" UNANSWERED</span>"+q.q+"</div>" +

          "<div style='padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div></div>";
        continue;
      }
      var so=ex.optMaps[i][ex.ans[i]];
      if(so===q.a)continue;
      count++;
      var opts2="";
      for(var di=0;di<4;di++){var oi=ex.optMaps[i][di];if(oi>=q.o.length)continue;var isC=oi===q.a,isW=oi===so&&!isC;opts2+="<div style='padding:6px 10px;margin-bottom:4px;border-radius:8px;border:1.5px solid "+(isC?"var(--gn)":isW?"var(--rd)":"var(--bd)")+";background:"+(isC?"var(--gn0)":isW?"var(--rd0)":"transparent")+";font-size:12px'><b>"+["A","B","C","D"][di]+".</b> "+q.o[oi]+(isC?" ✅":isW?" ❌":"")+"</div>";}
      items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
        "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--rd0);color:var(--rd);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" D"+q.d+"</span>"+q.q+"</div>" +

    }
    if(count===0)items+="<p style='color:var(--gn);text-align:center;padding:20px'>🎉 No missed questions!</p>";
    items+="</div>";
    el.innerHTML=items;el.style.display="block";
    if(btn)btn.textContent="Hide Review";el.scrollIntoView({behavior:"smooth"});
  } else {el.style.display="none";if(btn)btn.textContent="📖 Review Missed";}
}

  }
  html+="</div>";
  render(html);
  // Attach click listeners after render
  document.querySelectorAll('[data-pbq-id]').forEach(function(el){
    el.addEventListener('click',function(){
      var sid=this.getAttribute('data-pbq-id');
      var sc=PBQ_SCENARIOS.filter(function(s){return s.id===sid;})[0];
      if(sc) renderPBQ(sc,0,{});
    });
  });
}
window.renderPBQMenu=renderPBQMenu;

function renderPBQ(sc,qIdx,answers){
  if(qIdx>=sc.questions.length){
    // Results
    var correct=0;
    for(var k in answers){ if(answers[k]===sc.questions[parseInt(k)].a) correct++; }
    var pct=Math.round(correct/sc.questions.length*100);
    var html="<div class='pg'>" +
      "<div class='card' style='text-align:center;padding:32px;margin-bottom:16px'>" +
      "<div style='font-size:48px;margin-bottom:8px'>"+(pct>=80?"🎯":pct>=60?"📊":"📚")+"</div>" +
      "<div style='font-family:Syne,sans-serif;font-size:28px;font-weight:800'>"+pct+"%</div>" +
      "<div style='color:var(--tx3);margin-top:4px'>"+correct+" of "+sc.questions.length+" correct</div>" +
      "</div>";
    for(var i=0;i<sc.questions.length;i++){
      var qq=sc.questions[i];
      var userAns=answers[i];
      var correct_i=(userAns===qq.a);
      html+="<div class='card' style='margin-bottom:10px;border-left:4px solid "+(correct_i?"#22c55e":"#ef4444")+"'>" +
        "<div style='font-weight:600;margin-bottom:8px;font-size:13px'>Q"+(i+1)+": "+qq.q+"</div>" +
        "<div style='font-size:12px;margin-bottom:6px;padding:6px 10px;background:"+(correct_i?"#22c55e22":"#ef444422")+";border-radius:6px'>" +
        (correct_i?"\u2705":"&times;")+" Your answer: "+qq.opts[userAns]+"</div>";
      if(!correct_i){
        html+="<div style='font-size:12px;margin-bottom:6px;padding:6px 10px;background:#22c55e22;border-radius:6px'>" +
          "\u2705 Correct: "+qq.opts[qq.a]+"</div>";
      }
      html+="<div style='font-size:12px;color:var(--tx3);padding:6px 10px;background:var(--bg2);border-radius:6px'>"+qq.exp+"</div></div>";
    }
    html+="<div style='display:flex;gap:10px;margin-top:8px'>" +
      "<button class='btn btn-s' id='pbq-back-btn' style='flex:1'>Back to PBQ Menu</button>" +
      "<button class='btn btn-p' id='pbq-retry-btn' style='flex:1'>Retry Scenario</button>" +
      "</div></div>";
    render(html);
    document.getElementById('pbq-back-btn').addEventListener('click', function(){ renderPBQMenu(); });
    document.getElementById('pbq-retry-btn').addEventListener('click', function(){ renderPBQ(sc,0,{}); });
    return;
  }
  var qq=sc.questions[qIdx];
  var html="<div class='pg'>" +
    "<div style='font-size:12px;color:var(--tx3);margin-bottom:8px'>" +
    sc.title+" &nbsp;·&nbsp; Q"+(qIdx+1)+" of "+sc.questions.length+"</div>" +
    "<div style='background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.6'>"+
    (qIdx===0?sc.scenario:"")+"</div>" +
    "<div class='card' style='margin-bottom:16px'>" +
    "<div style='font-weight:700;margin-bottom:12px;font-size:15px'>"+qq.q+"</div>";
  for(var j=0;j<qq.opts.length;j++){
    var sel=(answers[qIdx]===j);
    html+="<div class='opt-row" + (sel?" opt-checked":"") + "' id='pbq-opt-"+j+"' data-opt='"+j+"' style='cursor:pointer;padding:10px 14px;border-radius:8px;margin-bottom:8px;border:2px solid "+(sel?"var(--acc)":"var(--bg2)")+";background:"+(sel?"var(--acc)22":"var(--bg)")+";font-size:13px'>" +
      "<span style='font-weight:600;margin-right:8px'>"+"ABCD"[j]+".</span>"+qq.opts[j]+"</div>";
  }
  html+="</div>" +
    "<div style='display:flex;gap:10px'>";
  if(qIdx>0) html+="<button class='btn btn-s' id='pbq-prev' style='flex:1'>\u2190 Back</button>";
  html+="<button class='btn btn-p' id='pbq-next' style='flex:1;"+(answers[qIdx]===undefined?"opacity:.4":"")+"'>"+(qIdx+1<sc.questions.length?"Next \u2192":"See Results")+"</button>" +
    "</div></div>";
  render(html);
  // Option selection
  document.querySelectorAll('[data-opt]').forEach(function(el){
    el.addEventListener('click',function(){
      var opt=parseInt(this.getAttribute('data-opt'));
      answers[qIdx]=opt;
      renderPBQ(sc,qIdx,answers);
    });
  });
  document.getElementById('pbq-next').addEventListener('click',function(){
    if(answers[qIdx]===undefined) return;
    renderPBQ(sc,qIdx+1,answers);
  });
  var prevBtn=document.getElementById('pbq-prev');
  if(prevBtn) prevBtn.addEventListener('click',function(){ renderPBQ(sc,qIdx-1,answers); });
}
window.renderPBQ=renderPBQ;

</script>
</body>
</html>
