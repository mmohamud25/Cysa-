{q:"Which evidence type is MOST volatile and must be collected FIRST during incident response?",o:["Hard drive image", "Network traffic logs", "RAM contents — running processes, network connections, and decrypted data are lost when the system powers off", "Log files"],a:2,d:3,e:"Order of volatility (most to least volatile): CPU registers/cache → RAM → Network state → Running processes → Disk → Removable media. RAM contains the richest volatile evidence: running malware code, decrypted communications, injected shellcode, and live network connections. After reboot or shutdown, this evidence is permanently gone. Capture RAM before anything else in an incident involving suspected malware."},
{q:"Which step MUST occur before eradicating malware from a compromised system?",o:["Restoring from backup", "Documenting and collecting forensic evidence — evidence collection before eradication preserves what the investigation needs", "Notifying law enforcement", "Rebuilding the system"],a:1,d:3,e:"Eradication (removing malware, cleaning systems) destroys evidence. Forensic collection must precede eradication: disk image, memory dump, relevant log files, network captures. If the incident may result in prosecution or litigation, evidence must be forensically sound. Even for non-legal cases, evidence collection captures indicators needed for hunting across other systems and building better detections."},
{q:"A ransomware attack encrypts files on 5 servers. Before restoring from backups, what should the IR team verify?",o:["Nothing — restore immediately", "That the backups are clean (not infected), that the infection vector is identified and closed, and that all attacker persistence mechanisms are removed", "That the ransom demand is legitimate", "That all users are notified"],a:1,d:3,e:"Restoring infected backups re-infects cleaned systems. The infection vector must be closed (patch, credential rotation) or ransomware returns immediately. All persistence must be found and removed or the attacker re-encrypts from their foothold. Verify backup integrity before restore. This verification takes time but prevents the nightmare of re-encryption after a long, expensive recovery."},
{q:"Which phase of incident response involves VERIFYING that a suspected incident actually occurred versus a false positive?",o:["Preparation", "Detection and Analysis — confirming indicators represent a real incident before resource-intensive response", "Containment", "Post-Incident Activity"],a:1,d:3,e:"Detection and Analysis phase: validate that alerts represent a real incident. Many alerts are false positives — verifying before escalating prevents wasted IR effort. Triage involves: corroborating indicators from multiple sources, reviewing context (is this normal for this system?), checking threat intelligence, and applying the incident classification criteria. Only confirmed incidents proceed to full IR."},
{q:"Which legal concept requires organizations to preserve all potentially relevant data when litigation is reasonably anticipated?",o:["Chain of custody", "Legal hold — suspending normal data retention/deletion policies to preserve evidence for potential litigation", "Privacy by design", "Data minimization"],a:1,d:3,e:"Legal hold (litigation hold) requires preserving all potentially relevant electronically stored information (ESI) when litigation is reasonably anticipated — even before a lawsuit is filed. Normal deletion schedules must be suspended. Failure to preserve results in spoliation sanctions. During an incident, if criminal prosecution or civil litigation is possible, legal hold must be implemented immediately across all relevant systems."},
{q:"Which attack uses a previously compromised legitimate website to infect visitors who match a specific target profile?",o:["Phishing", "Watering hole attack — compromising sites frequented by the target population, waiting for targets to visit", "Drive-by download", "Business email compromise"],a:1,d:3,e:"Watering hole attacks compromise websites frequently visited by the target population (e.g., an industry trade association's website visited by aerospace defense employees). The attackers inject malicious code that exploits visitors' browsers. Only targets matching the profile (e.g., specific IP ranges, browser language) are attacked. This bypasses email security and targets even security-aware users who don't click phishing emails."},
{q:"During incident response, a compromised account used to move laterally should have its password changed using which approach?",o:["Change password only", "Disable account, invalidate all sessions and tokens, rotate the password, and enable MFA if not already present — then re-enable when safe", "Ask the user to change their password", "Send a password reset email"],a:1,d:3,e:"Compromised credential containment requires: disable (immediately stop any use), session invalidation (kill active sessions — not just password change, which doesn't terminate existing sessions), password rotation (new credential unknown to attacker), MFA enablement (raise the bar for future compromise). Just changing a password leaves active sessions live and doesn't prevent immediate re-authentication using cached credentials."},
{q:"Which technical control reduces the impact of a successful phishing attack targeting employee credentials?",o:["Security awareness training only", "Phishing-resistant MFA (FIDO2/WebAuthn) — makes credential theft insufficient for account compromise", "Password complexity requirements", "Email filtering alone"],a:1,d:3,e:"Even if credentials are phished, phishing-resistant MFA (FIDO2/hardware keys) prevents account takeover because the second factor is domain-bound — a phishing site can't use it. Traditional MFA (SMS, TOTP) can be bypassed by real-time phishing proxies that relay the OTP. FIDO2 is cryptographically bound to the legitimate domain, making it impossible to use on a phishing site. This is the most effective single control against credential phishing."},
{q:"Which activity during the recovery phase ensures that the restored environment doesn't contain residual attacker access?",o:["Restoring from backup", "Integrity verification — scanning restored systems for malware, comparing file hashes, and verifying configurations before reconnecting", "Updating AV signatures only", "Notifying users"],a:1,d:3,e:"Recovery without verification may re-introduce compromised files or configurations from backups taken during the infection window. Integrity verification: scan with updated AV, compare critical file hashes to known-good baselines, verify system configurations match security baselines, test for attacker persistence mechanisms. Only after verification should systems be reconnected to the production network."},
{q:"Which framework provides detailed guidance specifically for responding to cybersecurity incidents in industrial control systems?",o:["NIST 800-61 only", "ICS-CERT guidelines and NIST 800-82 — OT/ICS-specific guidance addressing safety-critical response considerations", "PCI DSS", "ISO 27001"],a:1,d:3,e:"OT/ICS incident response has unique considerations: physical safety implications of disruption, longer maintenance windows, legacy systems that can't run traditional IR tools, and operational continuity requirements. ICS-CERT provides ICS-specific guidance. NIST 800-82 addresses ICS security. General IR frameworks (800-61) apply but must be adapted for OT/ICS constraints and safety requirements."},
{q:"An analyst notices a scheduled task running 'cmd.exe /c powershell -ep bypass -enc <base64>' at 3 AM daily. This MOST likely indicates:",o:["Normal Windows maintenance", "Scheduled task persistence — an attacker installed a scheduled task as a persistence mechanism to maintain access", "Windows Update", "Antivirus scan"],a:1,d:3,e:"Attacker persistence via scheduled tasks: creates a task that runs malicious code at scheduled intervals. The encoded PowerShell (-enc = encoded command) bypasses execution policy (-ep bypass) and hides the actual command. 3 AM timing avoids analyst observation. Scheduled task forensics: examine Task Scheduler event logs (Event ID 4698 = task created), task XML files in C:\\Windows\\System32\\Tasks\\."},
{q:"Which section of a vulnerability management report would MOST help a CISO justify budget for additional remediation resources?",o:["List of CVE numbers", "Risk exposure trend showing increasing unpatched critical vulnerabilities over time — demonstrating growing business risk without additional investment", "Technical patch instructions", "Scan completion statistics"],a:1,d:4,e:"CISOs justify budget by demonstrating risk. A trend showing growing unpatched critical vulnerabilities with financial impact quantification (potential breach cost, regulatory exposure) makes the business case. CVE lists and technical details don't resonate with financial decision-makers. Risk trending shows the consequence of inaction in terms that justify investment."},
{q:"Which metric BEST demonstrates the operational effectiveness of a SOC to executive leadership?",o:["Number of alerts processed per analyst", "MTTD and MTTR trends over time — showing the SOC is detecting and containing threats faster", "Number of security tools deployed", "Security training completion rates"],a:1,d:4,e:"MTTD (Mean Time to Detect) and MTTR (Mean Time to Respond) are outcome metrics that demonstrate actual security effectiveness. Improving trends show the SOC is getting better at its core mission. Volume metrics (alerts processed) measure activity, not outcomes. Executive leaders make resource decisions based on whether the investment is improving actual security posture."},
{q:"A security analyst discovers that a compliance scan shows all controls are passing but a penetration test reveals critical vulnerabilities. This discrepancy should be communicated as:",o:["The compliance scan is sufficient", "Compliance ≠ Security — a critical finding to present to leadership demonstrating that compliance controls are necessary but not sufficient for actual security", "The penetration test is wrong", "Both are valid independently"],a:1,d:4,e:"Compliance scans check whether specific controls are in place; they don't test whether those controls actually work against real attacks. A pentest showing critical vulnerabilities in a 'compliant' environment reveals this gap. This is an important executive communication: meeting compliance requirements is the floor, not the ceiling, of security. It often drives investment in security beyond minimum compliance requirements."},
{q:"Which format is MOST appropriate for communicating a security incident to the board of directors?",o:["Full technical incident report with IOCs and PCAP analysis", "Executive summary: business impact, timeline, data affected, regulatory implications, and remediation actions — without technical jargon", "Detailed forensic analysis report", "Vendor security advisory"],a:1,d:4,e:"Board communications: what happened (in business terms), what data was affected, what the business impact is, what regulatory obligations exist, what actions were taken, and what prevents recurrence. No PCAP analysis, CVE numbers, or technical details. The board needs enough information to fulfill their governance responsibilities and make resource decisions — not enough to rebuild the technical environment."},
{q:"Which communication principle ensures that sensitive incident information is shared appropriately within the organization?",o:["Share everything with everyone for transparency", "Need-to-know distribution — sharing incident details only with stakeholders who require the information to perform their response role", "Publish in the company newsletter", "Encrypt all communications"],a:1,d:4,e:"Incident communications follow need-to-know: technical details to IR team, management summary to affected business unit leaders, legal implications to legal/compliance, regulatory notice to privacy officer, public statement to PR. Over-sharing creates liability (premature disclosure), tipping off attackers, and employee panic. Under-sharing slows response. Structured communication templates with different detail levels for different audiences implement this."},
{q:"An organization's SLA requires critical vulnerability patches within 7 days of discovery. A report shows 40% of critical patches are applied within SLA. This finding should be communicated to:",o:["Only the security team", "Both the security team AND business leadership — SLA breach at this scale indicates systemic process failure requiring management attention and resource allocation", "Only IT operations", "Only the CISO"],a:1,d:4,e:"40% SLA compliance is a systemic failure, not an individual exception. Management must know: the organization faces materially elevated risk from unpatched critical vulnerabilities, the process is failing consistently, and resource or process changes are needed. Keeping this in the security team prevents necessary organizational changes. Leadership visibility drives accountability and resource allocation."},
{q:"Which communication channel is MOST appropriate for notifying affected customers after a confirmed data breach?",o:["Social media announcement first", "Direct customer notification through verified official channels (email from official domain, notification in account portal) following legal counsel guidance on required content and timing", "Press release only", "No notification until investigation is complete"],a:1,d:4,e:"Breach notification requirements (GDPR, CCPA, state laws) specify direct notification to affected individuals through verifiable channels. Social media is insufficient — not everyone follows company accounts. Official email and account portal notifications reach affected users directly. Legal counsel determines: required content (what data, when, what to do), timing (state laws vary: 30-72 hours to 90 days), and which regulators must also be notified."},
{q:"A security team discovers a critical vulnerability in a competitor's product that they use internally. Before patching, the analyst should:",o:["Publicly post the vulnerability on social media", "Coordinate internal patching, notify the vendor through responsible disclosure, and follow internal incident handling procedures if already exploited", "Ignore it since it's the vendor's problem", "Sell the vulnerability information"],a:1,d:4,e:"Internal discovery of a vendor vulnerability: patch internally first (protect the organization), then notify the vendor through responsible disclosure channels. Premature public disclosure harms all users of the product. The vendor needs time to develop and test a patch before broad disclosure. Standard practice: 90-day disclosure deadline (Google Project Zero model), coordinated public disclosure when patch is available."},
{q:"Which type of security report compares the organization's current security posture against the controls required by a specific framework like NIST CSF or ISO 27001?",o:["Penetration test report", "Gap analysis / maturity assessment report — identifying which required controls are missing, partially implemented, or fully implemented", "Incident response report", "Vulnerability scan report"],a:1,d:4,e:"Gap analysis compares current state (what controls exist) against target state (what the framework requires). Each control is assessed: Not Implemented, Partially Implemented, or Fully Implemented. The output is a prioritized roadmap to achieve the target maturity level. This is the foundational document for security program planning and compliance projects."},
{q:"An analyst must report the financial impact of a ransomware incident. Which components should be included?",o:["Only the ransom demand amount", "Total cost including: ransom payment (if paid), incident response costs, business downtime, data recovery, regulatory fines, legal fees, customer notification, and reputation impact", "Only the IR team hours", "Only the cost to restore systems"],a:1,d:4,e:"Total cost of a breach encompasses many components beyond the obvious. Organizations often underestimate true cost by focusing only on immediate recovery. Full cost accounting: IR fees (external firm), forensics, business interruption (revenue lost per day × downtime), ransom (if paid), notification costs, legal fees, regulatory fines, customer churn from reputation damage. This total figure is used for insurance claims, board reporting, and ROI calculations for future security investments."}
];

var FLASH_CARDS=[
{front:"SIEM",back:"Security Information and Event Management — aggregates logs from multiple sources, normalizes them, and applies correlation rules to detect threats. Provides centralized visibility. Examples: Splunk, Microsoft Sentinel, IBM QRadar."},
{front:"SOAR",back:"Security Orchestration, Automation, and Response — automates repetitive SOC tasks (alert triage, threat intel enrichment, ticket creation) and coordinates response actions across tools. Reduces analyst workload and response time."},
{front:"EDR",back:"Endpoint Detection and Response — provides continuous monitoring, recording, and analysis of endpoint activity. Detects behavioral threats (process injection, credential dumping) that traditional AV misses. Enables threat hunting and remote remediation."},
{front:"NDR",back:"Network Detection and Response — monitors network traffic for malicious activity using behavioral analysis and ML. Detects lateral movement, C2 traffic, and data exfiltration that endpoint tools miss."},
{front:"UEBA",back:"User and Entity Behavior Analytics — establishes behavioral baselines per user and entity, flags statistical anomalies. Detects insider threats and compromised accounts using legitimate credentials. Often integrated into SIEM."},
{front:"MITRE ATT&CK",back:"Adversarial Tactics, Techniques, and Common Knowledge — knowledge base of real-world adversary behaviors organized by tactic (why) and technique (how). Used for threat hunting, detection engineering, red/blue team exercises, and gap analysis."},
{front:"Pyramid of Pain",back:"Framework showing relative difficulty for attackers if defenders detect and block each indicator type. Bottom (easy to change): Hash values, IP addresses. Middle: Domain names, Network artifacts, Host artifacts. Top (hardest): Tools, TTPs."},
{front:"Diamond Model",back:"Intrusion analysis framework with 4 features: Adversary, Capability, Infrastructure, Victim. Analysts pivot between features to understand campaigns and attribute attacks. Meta-features: timestamp, phase, result, direction."},
{front:"Kill Chain",back:"Lockheed Martin: 7 phases of an attack — Reconnaissance, Weaponization, Delivery, Exploitation, Installation, Command & Control, Actions on Objectives. Each phase = interdiction opportunity. Earlier disruption = more effective defense."},
{front:"IOC",back:"Indicator of Compromise — artifact showing a system may be compromised: file hashes, malicious IPs/domains, registry keys, mutex names. Tactical, specific, and may become stale quickly. Compare to IOA (Indicator of Attack) which describes behavior."},
{front:"IOA",back:"Indicator of Attack — behavioral pattern indicating an attack in progress regardless of specific tools: unusual child process relationships, encoded PowerShell, LSASS access patterns. More durable than IOCs; works against novel malware."},
{front:"STIX/TAXII",back:"STIX: format for describing cyber threat intelligence (actors, TTPs, indicators). TAXII: transport protocol for sharing STIX data between organizations and tools. Together they enable automated, standardized threat intelligence sharing."},
{front:"TTP",back:"Tactics, Techniques, and Procedures — describes HOW an adversary operates. Tactics = goals (persistence, lateral movement). Techniques = methods (WMI event subscription). Procedures = specific implementation. TTPs are at the top of the Pyramid of Pain."},
{front:"CVSS",back:"Common Vulnerability Scoring System — standard for rating severity of vulnerabilities. Base score (0-10) from Attack Vector, Attack Complexity, Privileges Required, User Interaction, Scope, CIA Impact. Also Temporal and Environmental scores for context."},
{front:"EPSS",back:"Exploit Prediction Scoring System — ML-based probability (0-1) that a CVE will be exploited in the next 30 days. Complements CVSS (technical severity) with exploitation likelihood. Maintained by FIRST. High EPSS + high CVSS = top priority."},
{front:"CISA KEV",back:"Known Exploited Vulnerabilities catalog — CISA-maintained list of CVEs with confirmed active exploitation in the wild. Federal agencies must patch KEV entries within 2-3 weeks. Highest-priority remediation regardless of CVSS score."},
{front:"DAST",back:"Dynamic Application Security Testing — tests running web applications by sending malicious inputs. Finds: SQLi, XSS, SSRF, broken authentication. Tools: OWASP ZAP, Burp Suite. Contrast with SAST (source code analysis) and IAST (runtime instrumentation)."},
{front:"SAST",back:"Static Application Security Testing — analyzes source code without executing it to find security flaws. Finds: hardcoded credentials, insecure functions, input validation issues. Integrated into CI/CD for shift-left security. False positive rate can be high."},
{front:"SCA",back:"Software Composition Analysis — identifies open source libraries and checks them against vulnerability databases (NVD). Finds transitive/dependency vulnerabilities like Log4Shell. Tools: Snyk, Black Duck, OWASP Dependency Check."},
{front:"CSPM",back:"Cloud Security Posture Management — continuously scans cloud infrastructure for misconfigurations. Finds: public S3 buckets, overpermissive IAM, unencrypted storage, missing logging. Provides compliance benchmarking against CIS and cloud-native frameworks."},
{front:"MTTD",back:"Mean Time to Detect — average time from initial compromise to security team awareness. Global average: 200+ days for APTs. Reducing MTTD limits attacker dwell time and breach scope. Improved by threat hunting, UEBA, and better detection coverage."},
{front:"MTTR",back:"Mean Time to Respond/Remediate — average time from detection to full resolution. In vulnerability management: time from disclosure to patch. In incident response: time from detection to containment/recovery. Lower MTTR = less business impact."},
{front:"Threat Hunting",back:"Proactive searching for threats that automated detection missed. Assumes compromise and hunts for evidence. Hypothesis-driven: uses threat intelligence to form specific theories then tests them. Complements reactive IR."},
{front:"OSINT",back:"Open Source Intelligence — information gathered from publicly available sources: social media, job postings, DNS records, WHOIS, Shodan, GitHub. Used by attackers for reconnaissance and defenders for threat intelligence and attack surface assessment."},
{front:"DGA",back:"Domain Generation Algorithm — malware technique generating pseudo-random domain names to find C2 servers. Attackers pre-register one generated domain; malware tries hundreds until one resolves. Detected by: high NXDOMAIN rate, random-looking domains, statistical analysis."},
{front:"Beaconing",back:"Regular, periodic callback from malware to C2 server to receive commands. Creates detectable timing patterns in network traffic. Sophisticated malware uses jitter (random delay variation) to blend with normal traffic. Detected by statistical analysis of connection intervals."},
{front:"LOLBIN/LOTL",back:"Living Off the Land Binaries/Techniques — attackers use legitimate OS tools (PowerShell, certutil, WMI, PsExec) to avoid malware detection. No suspicious files dropped; blends with normal admin activity. Detected by: process behavior analysis, command-line monitoring."},
{front:"Pass-the-Hash",back:"Attack using captured NTLM hash to authenticate without knowing plaintext password. Works against systems using NTLM authentication. Countermeasures: disable NTLM, use Kerberos, implement PAM, enable Protected Users group, deploy Windows Defender Credential Guard."},
{front:"Golden Ticket",back:"Kerberos attack using forged Ticket Granting Tickets (TGTs) created with the KRBTGT account hash. Valid for 10 years, works even after password changes. Requires domain admin to dump KRBTGT hash. Response: rotate KRBTGT password TWICE."},
{front:"Process Injection",back:"Injecting malicious code into a legitimate running process to hide and inherit its privileges. Types: DLL injection, process hollowing, reflective DLL injection. Target: lsass.exe (credential theft), svchost.exe (blending in). Detected by: EDR memory scanning, API hooking."},
{front:"Lateral Movement",back:"Techniques for moving through a network after initial compromise: Pass-the-Hash, Pass-the-Ticket, WMI remote execution, PsExec, RDP, SSH. Goal: reach high-value targets (domain controllers, data stores). Detected by: internal network monitoring, authentication anomalies."},
{front:"NIST 800-61",back:"Computer Security Incident Handling Guide. Defines 4 IR phases: Preparation, Detection & Analysis, Containment/Eradication/Recovery, Post-Incident Activity. The foundational IR framework. Supplements available for specific incident types."},
{front:"Chain of Custody",back:"Documentation proving evidence integrity from collection through legal proceedings. Records: who collected, when, how, transfers between custodians, storage conditions. Enables legal admissibility. Cryptographic hashing proves no modification occurred."},
{front:"Order of Volatility",back:"Evidence collection priority: CPU registers → RAM → Network state → Running processes → Disk → Removable media. Most volatile (RAM) captured first — lost on reboot. Governs IR evidence collection sequence."},
{front:"Legal Hold",back:"Suspension of normal data retention/deletion policies when litigation is reasonably anticipated. Preserves ESI (electronically stored information) for potential legal proceedings. Failure to implement = spoliation (evidence destruction) sanctions."},
{front:"CVSS Attack Vector",back:"Network (N): exploitable over internet — highest severity. Adjacent (A): requires same local network. Local (L): requires local access/login. Physical (P): requires physical interaction. Network-vectored vulnerabilities are highest priority."},
{front:"CVSS Scope",back:"Scope: Changed (C) = vulnerability can affect components beyond the vulnerable one (e.g., VM escape affects host). Scope: Unchanged (U) = impact limited to the vulnerable component. Scope:Changed vulnerabilities receive higher scores."},
{front:"Responsible Disclosure",back:"Notifying vendor of vulnerability privately before public disclosure. Standard: 90-day deadline (Google Project Zero model). Allows vendor to develop and test patch. Coordinated public disclosure when fix is available. Protects all users of the vulnerable software."},
{front:"OSCP/Scoping Document",back:"Rules of Engagement for penetration tests. Defines: in-scope systems, permitted techniques, timing restrictions, emergency stop conditions, and contact procedures. Protects both tester and organization legally. Testing outside scope creates liability."},
{front:"JA3/JA3S",back:"TLS fingerprinting method hashing client hello parameters (JA3) or server hello (JA3S). Identifies TLS implementations regardless of certificate. Many malware families have distinctive JA3 fingerprints. Detects C2 traffic mimicking legitimate HTTPS by identifying unusual TLS implementations."},
{front:"Shimcache",back:"Windows Application Compatibility Cache recording metadata about executed files (path, size, last modified time). Persists after file deletion — forensic evidence of execution history. Located: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache."},
{front:"Prefetch",back:"Windows performance optimization caching execution data for recently-run programs (.pf files in C:\\Windows\\Prefetch). Records: executable name, run count, up to 8 last run timestamps, files referenced. Forensic evidence of execution even after file deletion."},
{front:"WMI Persistence",back:"WMI event subscriptions creating a trigger (event filter) + handler (event consumer) pair. Executes code when specified events occur (e.g., startup). Fileless capable — consumer can run PowerShell from internet. Detected by: WMI audit logs, scanning WMI repository."},
{front:"USBSTOR",back:"Windows registry key (HKLM\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR) recording all USB storage devices ever connected. Used in insider threat investigations to prove which USB device connected and when. Combine with DLP logs and Shellbags for complete USB forensics."},
{front:"EPSS vs CVSS",back:"CVSS = technical severity (0-10): how bad IF exploited. EPSS = exploitation likelihood (0-1): how likely to BE exploited in 30 days. Best practice: combine both. High-EPSS/medium-CVSS may rank above low-EPSS/critical-CVSS for remediation priority."},
{front:"False Positive Management",back:"Process of identifying and suppressing scanner findings confirmed as non-issues (e.g., patched vulnerabilities reported based on version string). Each suppression documented with justification and review date. Improves signal quality; reduces alert fatigue."},
{front:"DMARC",back:"Domain-based Message Authentication, Reporting, and Conformance. Policy layered on SPF and DKIM that tells receiving servers what to do when checks fail: none (monitor), quarantine (spam folder), reject (block). Prevents email spoofing of your domain."},
{front:"Threat Intelligence Platform (TIP)",back:"Centralizes threat intelligence collection, processing, analysis, and dissemination. Aggregates feeds (STIX/TAXII), enriches IOCs, manages relationships between indicators, and pushes actionable intelligence to security controls. Examples: MISP, ThreatConnect, Anomali."},
{front:"Honeypot",back:"Decoy system designed to attract attackers and learn their techniques. High-interaction (real OS, real services) vs low-interaction (emulated). Any traffic to a honeypot is suspicious — no legitimate user should interact with it. Provides early warning and attacker intelligence."},
{front:"Playbook",back:"Documented, step-by-step IR procedures for specific incident types. Reduces response time and ensures consistent handling. Covers: detection criteria, escalation paths, containment steps, evidence collection, communication, and post-incident actions. Should be practiced via tabletop exercises."}
];

var DOMAIN_GUIDE={
1:"<h3>Security Operations (33%)</h3><p><b>Log Analysis:</b> Windows Event IDs — 4624 (logon success), 4625 (logon fail), 4688 (process create), 4698 (scheduled task created), 4720 (account created). Sysmon Event ID 1 (process create with command line), 3 (network connection), 7 (image load), 10 (process access to LSASS).</p><p><b>Network Monitoring:</b> Beaconing = regular intervals to C2. DGA = flood of NXDOMAIN for random domains. DNS tunneling = long subdomain labels, TXT queries, high frequency to one domain. JA3 = TLS fingerprinting to identify malicious client implementations.</p><p><b>Threat Hunting:</b> Hypothesis-driven — form a specific theory based on threat intel then test it. Data sources: EDR telemetry, SIEM logs, network captures. Key behaviors to hunt: LOLBIN use (certutil, wscript, mshta), WMI persistence, scheduled tasks, unusual parent-child process relationships.</p><p><b>MITRE ATT&CK Tactics:</b> Reconnaissance → Resource Development → Initial Access → Execution → Persistence → Privilege Escalation → Defense Evasion → Credential Access → Discovery → Lateral Movement → Collection → Command & Control → Exfiltration → Impact.</p><p><b>Key Tools:</b> SIEM (correlation, alerting), EDR (endpoint behavior), NDR (network behavior), UEBA (user anomalies), SOAR (automation), Wireshark (PCAP analysis), Zeek/Bro (network logging).</p><p><b>Threat Actor Types:</b> Nation-state APT (zero-days, custom malware, long dwell time, specific targets), Cybercriminal (ransomware, financial motivation), Hacktivist (ideology, DDoS, defacement), Insider (legitimate access, motivation varies), Script kiddie (commodity tools, opportunistic).</p>",
2:"<h3>Vulnerability Management (30%)</h3><p><b>CVSS v3 Metrics:</b> Attack Vector (N/A/L/P), Attack Complexity (L/H), Privileges Required (N/L/H), User Interaction (N/R), Scope (U/C), Confidentiality/Integrity/Availability Impact (N/L/H). Network + None + None + None + Changed = maximum base score.</p><p><b>Prioritization Framework:</b> CVSS (technical severity) + EPSS (exploitation probability) + CISA KEV (confirmed exploitation) + Asset criticality + Exposure (internet-facing?) + Existing controls = actual risk priority. Never use CVSS alone.</p><p><b>Scanning Types:</b> Credentialed/authenticated scans (most thorough — examines actual patch state), unauthenticated scans (attacker perspective), DAST (web application testing), SAST (source code analysis), SCA (dependency vulnerability scanning), CSPM (cloud misconfiguration scanning).</p><p><b>Risk Treatment:</b> Remediate (patch/fix), Mitigate with compensating controls (WAF, network isolation, monitoring), Accept (document formal risk acceptance with owner signature), Transfer (cyber insurance). ALL exceptions require documentation with business justification, compensating controls, risk owner, and review date.</p><p><b>Key Regulations:</b> PCI DSS Req 11.3: quarterly internal scans + quarterly ASV external scans. HIPAA: periodic risk assessments. GDPR: appropriate technical measures (vulnerability management implied). NIST 800-53 RA controls: risk assessment requirements.</p><p><b>Vulnerability Lifecycle:</b> Discovery (scan/report) → Validation (confirm real vs false positive) → Prioritization (risk-based) → Remediation (patch/mitigate) → Verification (rescan to confirm fix) → Reporting (metrics and trending).</p>",
3:"<h3>Incident Response & Management (20%)</h3><p><b>NIST 800-61 Phases:</b> 1. Preparation (plan, tools, training, playbooks, tabletops). 2. Detection & Analysis (validate, classify, scope). 3. Containment, Eradication, Recovery (isolate, remove, restore). 4. Post-Incident Activity (lessons learned, improvements).</p><p><b>Order of Volatility:</b> CPU registers → RAM → Network connections → Running processes → Disk → Removable media → Backups. Collect most volatile FIRST — RAM lost on reboot. Critical in incidents with memory-resident malware.</p><p><b>Attack Frameworks:</b> Kill Chain (7 linear phases, good for understanding attack progression). MITRE ATT&CK (comprehensive, technique-level, based on real attacks, best for detection and hunting). Diamond Model (adversary/capability/infrastructure/victim — good for attribution and intelligence).</p><p><b>Containment Strategies:</b> Network isolation (disconnect from network, keep powered on to preserve RAM). Forensic image before any changes. Full shutdown only if no forensic collection is needed. Never reimage before evidence collection. Verify backups are clean before restore.</p><p><b>Key Forensic Artifacts:</b> RAM (running processes, network state, decrypted data, injected code), NTFS MFT ($MFT records all file activity), Windows Event Logs (security, system, application, Sysmon), Prefetch/Shimcache (execution history), Registry (persistence, user activity), Browser artifacts (history, downloads, cookies).</p><p><b>Legal Considerations:</b> Legal hold (preserve ESI when litigation anticipated). Chain of custody (document all evidence handling). Forensically sound (hash before/after to prove integrity). Attorney-client privilege (involve legal counsel early). Mandatory breach notification (GDPR 72hrs, state laws vary).</p>",
4:"<h3>Reporting & Communication (17%)</h3><p><b>Audience-Appropriate Communication:</b> Executives/Board: business risk, financial impact, regulatory exposure, strategic recommendations — no CVE numbers. IT/Security: technical details, reproduction steps, remediation instructions. Legal: breach notification obligations, evidence preservation. Business units: process changes affecting operations. Regulators: required format and timeline per applicable law.</p><p><b>Key Metrics:</b> MTTD (Mean Time to Detect — from compromise to awareness). MTTR (Mean Time to Respond/Remediate). SLA compliance rate (% of vulnerabilities patched within defined timeline). Risk exposure trend (are critical unpatched vulnerabilities increasing or decreasing?). False positive rate (detection quality indicator).</p><p><b>Responsible Disclosure:</b> Notify vendor privately. Allow reasonable remediation time (90-day standard). Coordinate public disclosure with vendor when patch available. Document the timeline. Full public disclosure after deadline regardless of patch status. Protects all users by giving vendors time to fix before attackers know.</p><p><b>Breach Notification:</b> GDPR Article 33: supervisory authority within 72 hours of awareness. Article 34: affected individuals when high risk. HIPAA: individuals within 60 days, HHS notification requirements. US state laws: vary 30-90 days. Involve legal counsel to determine applicable requirements before drafting notification.</p><p><b>Report Types:</b> Vulnerability scan report (technical findings for remediation teams), Executive summary (risk posture for leadership), Gap analysis (current vs target maturity), Lessons learned (post-incident improvements), Metrics/dashboard (ongoing operational status), Compliance report (control effectiveness against framework).</p>"
};

function startExam(size){
  size=size||EXAM_Q;
  var pool=[];
  for(var d=1;d<=4;d++){
    var dqs=shuffle(QZ.filter(function(q){return q.d==d;}));
    var cnt=Math.round(size*DOMAIN_WEIGHTS[d]/100);
    pool=pool.concat(dqs.slice(0,Math.min(cnt,dqs.length)));
  }
  if(pool.length<size){
    var ex=shuffle(QZ).filter(function(q){return pool.indexOf(q)<0;});
    pool=pool.concat(ex.slice(0,size-pool.length));
  }
  pool=shuffle(pool).slice(0,size);
  var maxTime=size===43?4800:size>100?size*60:EXAM_SECS;
  S.exam={qs:pool,cur:0,ans:{},flagged:[],started:true,done:false,timer:maxTime,iv:null,ngb:false,optMaps:pool.map(function(){return shuffle([0,1,2,3]);})};
  S.exam.iv=setInterval(function(){S.exam.timer--;updateTimerDisplay();if(S.exam.timer<=0){clearInterval(S.exam.iv);finishExam(true);}},1000);
  renderExamQ();
}

function finishExam(timeUp){
  clearInterval(S.exam.iv);
  var e=S.exam;
  var correct=0,byD={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}};
  var total=e.qs.length;
  if(total===0){renderExamHome();return;}
  for(var i=0;i<total;i++){
    var q=e.qs[i];byD[q.d].t++;
    if(e.ans[i]!==undefined){var so=e.optMaps[i][e.ans[i]];if(so===q.a){correct++;byD[q.d].c++;}}
  }
  var pct=Math.round(correct/total*100);
  var rp=pct/100;
  var scaled=rp>=0.83?Math.round(750+(rp-0.83)/0.17*150):
             rp>=0.70?Math.round(680+(rp-0.70)/0.13*70):
             rp>=0.50?Math.round(550+(rp-0.50)/0.20*130):
             Math.round(rp/0.50*550);
  scaled=Math.max(100,Math.min(900,scaled));
  e.done=true;e.score=correct;e.scaled=scaled;
  S.stats.sessions++;S.stats.correct+=correct;S.stats.total+=total;
  for(var d=1;d<=4;d++){
    if(!S.stats.domainScores[d])S.stats.domainScores[d]={correct:0,total:0};
    S.stats.domainScores[d].correct+=byD[d].c;S.stats.domainScores[d].total+=byD[d].t;
  }
  save();
  window._lastExam={qs:e.qs,ans:e.ans,optMaps:e.optMaps};
  renderExamResults(correct,total,scaled,byD,timeUp);
}

        count++;
        items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
          "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--ye0);color:var(--ye);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" UNANSWERED</span>"+q.q+"</div>" +
          "<div style='padding:8px;background:var(--gn0);border-radius:8px;font-size:12px;color:var(--gn);font-weight:600;margin-bottom:6px'>✅ "+q.o[q.a]+"</div>" +
          "<div style='padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div></div>";
        continue;
      }
      var so=ex.optMaps[i][ex.ans[i]];
      if(so===q.a)continue;
      count++;
      var opts2="";
      for(var di=0;di<4;di++){var oi=ex.optMaps[i][di];if(oi>=q.o.length)continue;var isC=oi===q.a,isW=oi===so&&!isC;opts2+="<div style='padding:6px 10px;margin-bottom:4px;border-radius:8px;border:1.5px solid "+(isC?"var(--gn)":isW?"var(--rd)":"var(--bd)")+";background:"+(isC?"var(--gn0)":isW?"var(--rd0)":"transparent")+";font-size:12px'><b>"+["A","B","C","D"][di]+".</b> "+q.o[oi]+(isC?" ✅":isW?" ❌":"")+"</div>";}
      items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
        "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--rd0);color:var(--rd);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" D"+q.d+"</span>"+q.q+"</div>" +
        opts2+"<div style='margin-top:6px;padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div></div>";
    }
    if(count===0)items+="<p style='color:var(--gn);text-align:center;padding:20px'>🎉 No missed questions!</p>";
    items+="</div>";
    el.innerHTML=items;el.style.display="block";
    if(btn)btn.textContent="Hide Review";el.scrollIntoView({behavior:"smooth"});
  } else {el.style.display="none";if(btn)btn.textContent="📖 Review Missed";}
}
window.toggleMissedReview=toggleMissedReview;

// ── FLASHCARDS ────────────────────────────────────────────────────────────────
function renderCardsHome(){
  render("<div class='pg'><h2 class='stitle'>Flashcards</h2>" +
    "<div class='card'>" +
      "<div style='font-weight:700;margin-bottom:12px'>"+FLASH_CARDS.length+" CySA+ key terms and concepts</div>" +
      "<button class='btn btn-p btn-full' style='margin-bottom:10px' onclick='renderCards()'>Start All Flashcards</button>" +
      "<button class='btn btn-s btn-full' onclick='renderCards(true)'>Shuffle Mode</button>" +
    "</div></div>");
}
window.renderCardsHome=renderCardsHome;

var _fcIdx=0,_fcCards=[];
function renderCards(shuf){_fcCards=shuf?shuffle([].concat(FLASH_CARDS)):[].concat(FLASH_CARDS);_fcIdx=0;showCard();}
window.renderCards=renderCards;
function showCard(){
  if(_fcIdx>=_fcCards.length){
    render("<div class='pg' style='text-align:center'><div class='card2' style='padding:40px;margin-bottom:20px'><div style='font-size:48px;margin-bottom:12px'>🎉</div><div style='font-family:Syne,sans-serif;font-size:28px;font-weight:800'>All Done!</div><div style='color:var(--tx3);margin-top:8px'>"+FLASH_CARDS.length+" cards reviewed</div></div>" +
      "<div style='display:flex;gap:10px;justify-content:center'><button class='btn btn-p' onclick='renderCards()'>Again</button><button class='btn btn-s' onclick='renderCards(true)'>Shuffle</button><button class='btn btn-s' onclick='renderCardsHome()'>Back</button></div></div>");
    return;
  }
  var c=_fcCards[_fcIdx],pct=Math.round(_fcIdx/FLASH_CARDS.length*100);
  render("<div class='pg'>" +
    "<div class='row' style='margin-bottom:14px'><button class='btn btn-s' onclick='renderCardsHome()'>← Back</button><div style='flex:1'><div class='prog-bar'><div class='prog-fill' style='width:"+pct+"%'></div></div></div><span style='font-size:12px;color:var(--tx3)'>"+(_fcIdx+1)+"/"+FLASH_CARDS.length+"</span></div>" +
    "<div class='fc' id='fc' onclick='flipCard()'><div class='fc-inner'>" +
      "<div class='fc-front'><div style='text-align:center'><div style='font-size:11px;color:var(--tx3);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px'>Tap to reveal</div><div style='font-family:Syne,sans-serif;font-size:24px;font-weight:800'>"+c.front+"</div></div></div>" +
      "<div class='fc-back'><div style='text-align:center;font-size:15px;line-height:1.7;color:var(--tx)'>"+c.back+"</div></div>" +
    "</div></div>" +
    "<div style='display:flex;gap:10px;margin-top:14px'><button class='btn btn-s' style='flex:1' onclick='prevCard()'>← Prev</button><button class='btn btn-p' style='flex:2' onclick='nextCard()'>Next →</button></div>" +
  "</div>");
}
window.flipCard=function(){var el=document.getElementById("fc");if(el)el.classList.toggle("flipped");};
window.nextCard=function(){_fcIdx++;showCard();};
window.prevCard=function(){if(_fcIdx>0){_fcIdx--;showCard();}};

// ── LEARN ─────────────────────────────────────────────────────────────────────
function renderLearn(){
  var items="";
  for(var d=1;d<=4;d++){
    var qcnt=QZ.filter(function(q){return q.d==d;}).length;
    items+="<div class='card' style='border-left:3px solid "+DOMAIN_COLORS[d]+";cursor:pointer;margin-bottom:10px' onclick='renderDomainGuide("+d+")'>" +
      "<div style='display:flex;align-items:center;justify-content:space-between'>" +
        "<div><div style='font-weight:700'>"+DOMAIN_NAMES[d]+"</div>" +
          "<div style='font-size:12px;color:var(--tx3);margin-top:3px'>"+DOMAIN_WEIGHTS[d]+"% of exam · "+qcnt+" questions</div>" +
        "</div><span style='color:var(--tx4);font-size:18px'>&#8594;</span>" +
      "</div></div>";
  }
  render("<div class='pg'><h2 class='stitle'>Domain Guide</h2>"+items+"</div>");
}
window.renderLearn=renderLearn;

function renderDomainGuide(d){
  var prevBtn=d>1?"<button class='btn btn-s' onclick='renderDomainGuide("+(d-1)+")'>&#8592; D"+(d-1)+"</button>":"";
  var nextBtn=d<4?"<button class='btn btn-s' onclick='renderDomainGuide("+(d+1)+")'>D"+(d+1)+" &#8594;</button>":"";
  render("<div class='pg'>" +
    "<button class='btn btn-s' onclick='renderLearn()' style='margin-bottom:16px'>&#8592; Back to Domains</button>" +
    "<div class='card' style='border-left:3px solid "+DOMAIN_COLORS[d]+"'>" +
      "<div style='background:"+DOMAIN_BG[d]+";border-radius:8px;padding:10px 14px;margin-bottom:16px;display:inline-block'>" +
        "<span style='color:"+DOMAIN_COLORS[d]+";font-weight:700;font-size:13px'>Domain "+d+" · "+DOMAIN_WEIGHTS[d]+"% of exam</span>" +
      "</div>" +
      "<div style='font-size:14px;line-height:1.8;color:var(--tx2)'>"+DOMAIN_GUIDE[d]+"</div>" +
    "</div>" +
    "<div style='margin-top:16px;display:flex;gap:10px'>" +
      "<button class='btn btn-p' onclick='startQuiz("+d+")'>Practice D"+d+" &#8594;</button>" +
      prevBtn+nextBtn+
    "</div></div>");
}
window.renderDomainGuide=renderDomainGuide;

// ── INIT ──────────────────────────────────────────────────────────────────────
function initApp(){
  var today=new Date().toDateString();
  if(S.stats.lastDate!==today){
    var yesterday=new Date(Date.now()-86400000).toDateString();
    if(S.stats.lastDate===yesterday)S.stats.streak++;else S.stats.streak=1;
    S.stats.lastDate=today;try{save();}catch(e){}
  }
  renderHome();
}
initApp();

</script>
