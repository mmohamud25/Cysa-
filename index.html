<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CySA+ CS0-003 Study Hub — Free Cybersecurity Analyst Practice</title>
<meta name="description" content="Free CompTIA CySA+ CS0-003 study hub with 1000+ practice questions, PBQ simulations, exam simulator, and domain-weighted scoring. Pass CySA+ on your first attempt.">
<meta property="og:title" content="CySA+ CS0-003 Study Hub">
<meta property="og:description" content="Free CySA+ CS0-003 study tool — 1000+ questions, PBQ labs, exam simulator, domain guides.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2;--bg2:#fff;--bg3:#eceee9;--bg4:#e2e5dd;
  --bd:#d8dbd2;--bd2:#c2c6ba;
  --tx:#10140f;--tx2:#39402f;--tx3:#6b7460;--tx4:#97a08c;
  --cy:#3b7a4a;--cy0:rgba(59,122,74,.1);
  --gn:#2f9e5b;--gn0:rgba(47,158,91,.12);
  --pk:#b04a2f;--pk0:rgba(176,74,47,.1);
  --ye:#a8650f;--ye0:rgba(168,101,15,.12);
  --pu:#6b6f3f;--pu0:rgba(107,111,63,.12);
  --or:#a8650f;--or0:rgba(168,101,15,.12);
  --rd:#b3392c;--rd0:rgba(179,57,44,.1);
  --shadow:0 1px 2px rgba(0,0,0,.06);
  --radius:6px;--radius-sm:4px;
  --btn-s-bg:#eceee9;
  --mono:'IBM Plex Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0a0e14;--bg2:#10151f;--bg3:#161d29;--bg4:#1c2433;
  --bd:#212b3a;--bd2:#2a3648;
  --tx:#e6ebe3;--tx2:#9aa896;--tx3:#6f7d6c;--tx4:#46524a;
  --cy:#5fb98a;--cy0:rgba(95,185,138,.1);
  --gn:#5fb98a;--gn0:rgba(95,185,138,.12);
  --pk:#d4795a;--pk0:rgba(212,121,90,.1);
  --ye:#d97706;--ye0:rgba(217,119,6,.1);
  --pu:#8a9b6e;--pu0:rgba(138,155,110,.12);
  --or:#d97706;--or0:rgba(217,119,6,.1);
  --rd:#e0584a;--rd0:rgba(224,88,74,.12);
  --btn-s-bg:#161d29;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
.app{display:flex;min-height:100vh}
.rail{width:220px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px;position:fixed;height:100vh;z-index:100}
.rail-logo{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--cy);margin-bottom:2px;padding:8px}
.rail-sub{font-size:11px;color:var(--tx3);padding:0 8px 16px;border-bottom:1px solid var(--bd)}
.rail-nav{display:flex;flex-direction:column;gap:4px;margin-top:12px;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--tx3);width:100%;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--tx)}
.nav-btn.active{background:var(--cy0);color:var(--cy);font-weight:700}
.nav-icon{font-size:16px;width:20px;text-align:center}
.rail-footer{border-top:1px solid var(--bd);padding-top:12px;margin-top:auto}
.main{margin-left:220px;flex:1}
.pg{padding:24px;max-width:1000px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card2{background:var(--bg3);border:none;border-left:3px solid var(--cy);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--gn);color:#08130c}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--btn-s-bg);border:1px solid var(--bd2);color:var(--tx)}
.btn-s:hover{border-color:var(--cy);color:var(--cy)}
.btn-full{width:100%;justify-content:center}
.stitle{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;border:none;padding:0;background:none;display:block}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--cy)}
.stat-label{font-size:11px;color:var(--tx3);margin-top:2px}
.ans{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--bd2);background:var(--bg2);cursor:pointer;margin-bottom:8px;transition:all .15s;font-size:14px;line-height:1.5;color:var(--tx2);text-align:left;width:100%;font-family:inherit}
.ans:hover{border-color:var(--cy);background:var(--cy0)}
.ans.sel{border-color:var(--cy);background:var(--cy0);color:var(--cy)}
.ans.hit{border-color:var(--gn);background:var(--gn0);color:var(--gn)}
.ans.miss{border-color:var(--rd);background:var(--rd0);color:var(--rd)}
.ans.dim{opacity:.5}
.ltr{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--bg3);color:var(--tx3)}
.ans.sel .ltr{background:var(--cy0);color:var(--cy)}
.ans.hit .ltr{background:var(--gn0);color:var(--gn)}
.ans.miss .ltr{background:var(--rd0);color:var(--rd)}
.prog-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.16,1,.3,1);background:var(--cy)}
.fc{perspective:1200px;-webkit-perspective:1200px;cursor:pointer;margin-bottom:16px}
.fc-inner{transition:transform .35s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:relative;min-height:200px;width:100%;will-change:transform}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
@keyframes fadeUpIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-in-up{animation:fadeUpIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.scale-in{animation:scaleIn .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes streakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.streak-fire{display:inline-block;animation:streakPulse 1.4s ease-in-out infinite}
.radar-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:8px 0}
#main ul,#main ol{margin:6px 0 12px 0;padding-left:20px}
#main li{margin-bottom:6px;line-height:1.6}
#main p{margin:0 0 10px 0}
#main p:last-child{margin-bottom:0}
button:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible,
input:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:4px}
.opt-row:focus-visible{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy0)}
.nav-btn:focus-visible{background:var(--bg3);color:var(--tx)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;min-height:200px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--bd);padding:24px;display:flex;align-items:center;justify-content:center}
.fc-front{background:var(--bg2)}
.fc-back{background:var(--gn0);border-color:var(--gn);transform:rotateY(180deg)}
#toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-msg{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;animation:slideIn .3s ease;pointer-events:none}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bd);padding:6px 4px;z-index:100;grid-template-columns:repeat(6,1fr)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border:none;background:none;cursor:pointer;font-size:9px;font-weight:600;color:var(--tx3);font-family:inherit}
.bnav-btn.active{color:var(--cy)}
.row{display:flex;align-items:center;gap:8px}
.exam-bar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 20px}
@media(min-width:769px) and (max-width:1024px){
  .rail{width:72px;padding:12px 8px}
  .rail-logo,.rail-sub,.nav-label{display:none}
  .nav-btn{justify-content:center;padding:12px 0}
  .main{margin-left:72px}
  .two-col{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  #domRadarCv{width:240px;height:240px}
}
@media(max-width:768px){.rail{display:none}.main{margin-left:0;padding-bottom:70px}.bnav{display:grid}.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}.pg{padding:14px}.stitle{font-size:20px}}
@media(max-width:480px){.btn{padding:8px 12px;font-size:12px}}
</style>
</head>
<body data-theme="light">
<div id="toast-wrap"></div>
<div class="app">
  <nav class="rail">
    <div class="rail-logo">CySA+ Hub</div>
    <div class="rail-sub">CS0-003 Study Platform</div>
    <div class="rail-nav">
      <button class="nav-btn active" aria-label="Home" onclick="setTab('home')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>

<nav class="bnav" id="bnav">

  <button class="bnav-btn" aria-label="PBQ" onclick="setTab('pbq')">🔧<span>PBQ</span></button>
  <button class="bnav-btn" aria-label="Exam" onclick="setTab('exam')">📝<span>Exam</span></button>
  <button class="bnav-btn" aria-label="Cards" onclick="setTab('cards')">🃏<span>Cards</span></button>
  <button class="bnav-btn" aria-label="Learning Mode" onclick="setTab('learn')">📘<span>Learn</span></button>
</nav>
<script>
var QZ=[];
var DOMAIN_CONCEPTS={};

// ── MULTI-SELECT QUESTIONS (choose two, no partial credit) ──────────────────
var MULTI_QZ=[];

// ── CySA+ FLASHCARDS ─────────────────────────────────────────────────────────
var FLASH_CARDS=[];

// ── DOMAIN GUIDE ────────────────────────────────────────────────────────────



// ── CySA+ STUDY HUB APP ────────────────────────────────────────────────────
var DOMAIN_NAMES={1:"Security Operations",2:"Vulnerability Management",3:"Incident Response & Management",4:"Reporting & Communication"};
var DOMAIN_WEIGHTS={1:33,2:30,3:20,4:17};
var DOMAIN_COLORS={1:"var(--cy)",2:"var(--or)",3:"var(--rd)",4:"var(--pu)"};
var DOMAIN_BG={1:"var(--cy0)",2:"var(--or0)",3:"var(--rd0)",4:"var(--pu0)"};
var PASS_SCORE=750;
var EXAM_Q=85;
var EXAM_SECS=9900; // 165 min

function shuffle(a){var arr=[].concat(a),i=arr.length,j,t;while(i--){j=Math.floor(Math.random()*(i+1));t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

var S={
  tab:"home",
  quiz:{dom:0,idx:0,qs:[],sel:null,checked:false,score:0,total:0},
  exam:{qs:[],cur:0,ans:{},flagged:[],started:false,done:false,timer:EXAM_SECS,iv:null,ngb:false,optMaps:[]},
  stats:JSON.parse(localStorage.getItem("cysa_stats")||'{"sessions":0,"correct":0,"total":0,"streak":0,"lastDate":"","domainScores":{}}'),
  dark:localStorage.getItem("cysa_dark")==="1"
};
if(S.dark)document.body.setAttribute("data-theme","dark");

function save(){try{localStorage.setItem("cysa_stats",JSON.stringify(S.stats));}catch(e){}}
function render(html){
  document.getElementById("main").innerHTML=html;
  makeClickablesAccessible();
}
function makeClickablesAccessible(){
  var mainEl=document.getElementById("main");
  if(!mainEl)return;
  var els=mainEl.querySelectorAll("[onclick]");
  els.forEach(function(el){
    var tag=el.tagName.toLowerCase();
    if(tag==="button"||tag==="a"||tag==="input"||tag==="select"||tag==="textarea")return;
    if(!el.hasAttribute("tabindex"))el.setAttribute("tabindex","0");
    if(!el.hasAttribute("role"))el.setAttribute("role","button");
    if(!el.dataset.kbBound){
      el.dataset.kbBound="1";
      el.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          this.click();
        }
      });
    }
  });
}
function showToast(msg,col,dur){
  var w=document.getElementById("toast-wrap");
  var t=document.createElement("div");
  t.className="toast-msg";t.style.background=col||"var(--tx)";t.textContent=msg;
  w.appendChild(t);
  setTimeout(function(){t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(function(){t.remove();},300);},dur||2500);
}
var BADGES={
  master_1:{icon:"🛡",name:"Ops master",desc:"90%+ accuracy in Security operations"},
  master_2:{icon:"🔍",name:"Vuln master",desc:"90%+ accuracy in Vulnerability management"},
  master_3:{icon:"🚨",name:"IR master",desc:"90%+ accuracy in Incident response"},
  master_4:{icon:"📋",name:"Reporting master",desc:"90%+ accuracy in Reporting & communication"},
  comeback_1:{icon:"📈",name:"Comeback — ops",desc:"+20pt improvement in Security operations"},
  comeback_2:{icon:"📈",name:"Comeback — vuln",desc:"+20pt improvement in Vulnerability management"},
  comeback_3:{icon:"📈",name:"Comeback — IR",desc:"+20pt improvement in Incident response"},
  comeback_4:{icon:"📈",name:"Comeback — reporting",desc:"+20pt improvement in Reporting & communication"},
  marathon:{icon:"🏁",name:"Marathon",desc:"Completed a full 85-question simulation"},
  sentinel_cleared:{icon:"🛡️",name:"Sentinel Cleared",desc:"Scored 855+/900 (95%) in Sentinel Mode"}
};
function unlockBadge(id){
  if(!S.stats.badges)S.stats.badges=[];
  if(S.stats.badges.indexOf(id)>=0)return;
  S.stats.badges.push(id);save();
  var b=BADGES[id];
  if(b)showToast(b.icon+" "+b.name+" unlocked",getComputedStyle(document.body).getPropertyValue("--gn")||"#2f9e5b",3200);
}
function checkDomainBadges(d){
  var ds=S.stats.domainScores[d];
  if(!ds||ds.total<10)return;
  if(!S.stats.domainMin)S.stats.domainMin={};
  var pct=ds.correct/ds.total*100;
  if(S.stats.domainMin[d]===undefined)S.stats.domainMin[d]=pct;
  if(pct>=90)unlockBadge("master_"+d);
  if(pct-S.stats.domainMin[d]>=20)unlockBadge("comeback_"+d);
  if(pct<S.stats.domainMin[d])S.stats.domainMin[d]=pct;
  save();
}
window.checkDomainBadges=checkDomainBadges;

// ── SPACED REPETITION (missed-question queue) ────────────────────────────────
function getQKey(q){
  var si=QZ.indexOf(q);
  if(si>=0)return "s"+si;
  var mi=MULTI_QZ.indexOf(q);
  if(mi>=0)return "m"+mi;
  return null;
}
function getQByKey(key){
  if(key.charAt(0)==="s")return QZ[parseInt(key.slice(1))];
  if(key.charAt(0)==="m")return MULTI_QZ[parseInt(key.slice(1))];
  return null;
}
function recordMissedResult(q,ok){
  if(!S.stats.missedQueue)S.stats.missedQueue={};
  var key=getQKey(q);
  if(!key)return;
  if(ok){
    if(S.stats.missedQueue[key])delete S.stats.missedQueue[key];
  } else {
    var existing=S.stats.missedQueue[key];
    S.stats.missedQueue[key]={misses:(existing?existing.misses:0)+1,last:Date.now()};
  }
  save();
}
function getMissedPool(){
  if(!S.stats.missedQueue)return [];
  return Object.keys(S.stats.missedQueue).map(getQByKey).filter(function(q){return !!q;});
}
window.getMissedPool=getMissedPool;
function startMissedQuiz(){
  var pool=shuffle(getMissedPool());
  if(pool.length===0){showToast("No missed questions queued — nice work! 🎯",getComputedStyle(document.body).getPropertyValue("--gn")||"#2f9e5b",3000);return;}
  S.quiz.dom=-1;
  S.quiz.qs=pool.slice(0,20);
  S.quiz.idx=0;S.quiz.sel=null;S.quiz.selMulti=[];S.quiz.checked=false;S.quiz.score=0;S.quiz.total=0;
  _quizOptMap=[];renderQuizQ();
}
window.startMissedQuiz=startMissedQuiz;

function toggleTheme(){
  S.dark=!S.dark;
  document.body.setAttribute("data-theme",S.dark?"dark":"light");
  localStorage.setItem("cysa_dark",S.dark?"1":"0");
  document.getElementById("theme-lbl").textContent=S.dark?"Light Mode":"Dark Mode";
}
function setTab(tab){
  S.tab=tab;
  document.querySelectorAll(".nav-btn,.bnav-btn").forEach(function(b){
    var on=b.getAttribute("onclick")||"";
    b.classList.toggle("active",on.indexOf("'"+tab+"'")>=0||on.indexOf('"'+tab+'"')>=0);
  });
  if(S.exam&&S.exam.iv&&tab!=="exam"){clearInterval(S.exam.iv);S.exam.iv=null;}
  if(tab==="home")renderHome();
  else if(tab==="quiz")renderQuizHome();
  else if(tab==="exam")renderExamHome();
  else if(tab==="cards")renderCardsHome();
  else if(tab==="learn")renderLearn();
  else if(tab==="pbq")renderPBQMenu();
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome(){
  var st=S.stats;
  var pct=st.total>0?Math.round(st.correct/st.total*100):0;
  var domCards="";
  for(var d=1;d<=4;d++){
    var ds=st.domainScores[d];
    var sc=ds&&ds.total>0?Math.round(ds.correct/ds.total*100):null;
    var qcnt=QZ.filter(function(q){return q.d==d;}).length;
    domCards+="<div class='card fade-in-up' style='margin-bottom:10px;border-left:3px solid "+DOMAIN_COLORS[d]+";cursor:pointer;animation-delay:"+(d*70)+"ms' onclick=\"setTab('quiz');startQuiz("+d+")\">" +
      "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:6px'>" +
        "<div style='font-weight:700;font-size:14px'>"+DOMAIN_NAMES[d]+"</div>" +
        "<span style='background:"+DOMAIN_BG[d]+";color:"+DOMAIN_COLORS[d]+";padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700'>"+DOMAIN_WEIGHTS[d]+"%</span>" +
      "</div>" +
      "<div style='display:flex;align-items:center;gap:10px'>" +
        "<div class='prog-bar' style='flex:1'><div class='prog-fill' data-w='"+(sc||0)+"' style='width:0%;background:"+DOMAIN_COLORS[d]+"'></div></div>" +
        "<div style='font-size:12px;color:var(--tx3)'>"+(sc!==null?"Accuracy: "+sc+"%":"—")+"</div>" +
        "<div style='font-size:11px;color:var(--tx4)'>"+qcnt+"q</div>" +
      "</div>" +
    "</div>";
  }
  var streakHtml=st.streak>0?"<span class='streak-fire'>🔥</span> "+st.streak+" day streak":st.sessions+" sessions";
  var earnedBadges=st.badges||[];
  var badgeIds=Object.keys(BADGES);
  var badgesHtml="";
  if(earnedBadges.length>0){

function drawDomainRadar(){
  var cv=document.getElementById("domRadarCv");
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext("2d");
  var w=cv.width,h=cv.height,cx=w/2,cy=h/2,maxR=Math.min(w,h)/2-52;
  var isDark=document.body.getAttribute("data-theme")==="dark";
  var gridColor=isDark?"rgba(160,174,192,.25)":"rgba(100,116,139,.25)";
  var labelColor=isDark?"#a0aec0":"#334155";
  var axes=4,labels=["Security Ops","Vuln Mgmt","Incident Resp","Reporting"];
  var vals=[1,2,3,4].map(function(d){
    var ds=S.stats.domainScores[d];
    return ds&&ds.total>0?ds.correct/ds.total:0.5;
  });
  ctx.clearRect(0,0,w,h);
  // grid rings
  for(var ring=1;ring<=4;ring++){
    ctx.beginPath();
    var r=maxR*ring/4;
    for(var i=0;i<axes;i++){
      var ang=-Math.PI/2+i*(2*Math.PI/axes);
      var px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.strokeStyle=gridColor;ctx.lineWidth=1;ctx.stroke();
  }
  // axis lines + labels (clamped to stay within canvas bounds)
  ctx.font="10px 'IBM Plex Mono', monospace";
  ctx.fillStyle=labelColor;
  var pad=4;
  for(var i=0;i<axes;i++){
    var ang=-Math.PI/2+i*(2*Math.PI/axes);
    var ex=cx+maxR*Math.cos(ang),ey=cy+maxR*Math.sin(ang);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);
    ctx.strokeStyle=gridColor;ctx.stroke();
    var lx=cx+(maxR+18)*Math.cos(ang),ly=cy+(maxR+18)*Math.sin(ang);
    var cosA=Math.cos(ang);
    var align=Math.abs(cosA)<0.3?"center":(cosA>0?"left":"right");
    var label=labels[i];
    var tw=ctx.measureText(label).width;
    if(align==="left"&&lx+tw>w-pad)lx=w-pad-tw;
    if(align==="right"&&lx-tw<pad)lx=pad+tw;
    if(align==="center"){
      if(lx-tw/2<pad)lx=pad+tw/2;
      if(lx+tw/2>w-pad)lx=w-pad-tw/2;
    }
    ctx.textAlign=align;
    ctx.fillText(label,lx,ly+4);
  }
  // data polygon
  ctx.beginPath();
  for(var i=0;i<axes;i++){
    var ang=-Math.PI/2+i*(2*Math.PI/axes);
    var r=maxR*vals[i];
    var px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  var isDarkRd=document.body.getAttribute("data-theme")==="dark";
  ctx.fillStyle=isDarkRd?"rgba(95,185,138,.25)":"rgba(59,122,74,.18)";
  ctx.fill();
  ctx.strokeStyle=isDarkRd?"#5fb98a":"#3b7a4a";ctx.lineWidth=2;ctx.stroke();
  // dots
  for(var i=0;i<axes;i++){
    var ang=-Math.PI/2+i*(2*Math.PI/axes);
    var r=maxR*vals[i];
    var px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);
    ctx.beginPath();ctx.arc(px,py,4,0,2*Math.PI);
    ctx.fillStyle=isDarkRd?"#5fb98a":"#3b7a4a";ctx.fill();
  }
}

  var correctSet=isMulti?q.a:[q.a];
  var opts="";
  for(var di=0;di<_quizOptMap.length;di++){

    var isC=correctSet.indexOf(oi)>=0;

  var canCheck=isMulti?S.quiz.selMulti.length===q.multi:S.quiz.sel!==null;

    "<div style='background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--tx2);line-height:1.6'><b style='color:var(--gn)'>"+correctLabel+"</b> — "+q.e+"</div>" +

window.toggleQuizMulti=function(i){
  var q=S.quiz.qs[S.quiz.idx];
  var pos=S.quiz.selMulti.indexOf(i);
  if(pos>=0){S.quiz.selMulti.splice(pos,1);}
  else if(S.quiz.selMulti.length<q.multi){S.quiz.selMulti.push(i);}
  renderQuizQ();
};
window.checkQuiz=function(){
  var q=S.quiz.qs[S.quiz.idx];
  var isMulti=!!q.multi;
  if(isMulti){if(S.quiz.selMulti.length!==q.multi)return;}
  else{if(S.quiz.sel===null)return;}
  S.quiz.checked=true;
  var ok;
  if(isMulti){
    var selOrigSet=S.quiz.selMulti.map(function(i){return _quizOptMap[i];}).sort(function(a,b){return a-b;});
    var correctSorted=q.a.slice().sort(function(a,b){return a-b;});
    ok=selOrigSet.length===correctSorted.length&&selOrigSet.every(function(v,i){return v===correctSorted[i];});
  } else {
    var selOrig=_quizOptMap[S.quiz.sel];
    ok=selOrig===q.a;
  }
  if(ok)S.quiz.score++;
  S.quiz.total++;
  if(!S.stats.domainScores[q.d])S.stats.domainScores[q.d]={correct:0,total:0};
  S.stats.domainScores[q.d].total++;
  if(ok)S.stats.domainScores[q.d].correct++;
  checkDomainBadges(q.d);
  recordMissedResult(q,ok);
  S.stats.correct+=ok?1:0;S.stats.total++;save();renderQuizQ();
};

function startExam(size){
  size=size||EXAM_Q;
  var ALL_Q=QZ.concat(MULTI_QZ);
  var pool=[];
  for(var d=1;d<=4;d++){
    var dqs=shuffle(ALL_Q.filter(function(q){return q.d==d;}));
    var cnt=Math.round(size*DOMAIN_WEIGHTS[d]/100);
    pool=pool.concat(dqs.slice(0,Math.min(cnt,dqs.length)));
  }
  if(pool.length<size){
    var ex=shuffle(ALL_Q).filter(function(q){return pool.indexOf(q)<0;});
    pool=pool.concat(ex.slice(0,size-pool.length));
  }
  pool=shuffle(pool).slice(0,size);
  var maxTime=size===43?4800:size>100?size*60:EXAM_SECS;
  S.exam={qs:pool,cur:0,ans:{},flagged:[],started:true,done:false,timer:maxTime,iv:null,ngb:false,mode:"standard",optMaps:pool.map(function(q){return shuffle(q.o.map(function(_,ix){return ix;}));})};
  S.exam.iv=setInterval(function(){S.exam.timer--;updateTimerDisplay();if(S.exam.timer<=0){clearInterval(S.exam.iv);finishExam(true);}},1000);
  renderExamQ();
}
window.startExam=startExam;

function startSentinelExam(){
  var size=85;
  var pool=[];
  for(var d=1;d<=4;d++){
    var domMulti=shuffle(MULTI_QZ.filter(function(q){return q.d==d;}));
    var domSingleAll=QZ.filter(function(q){return q.d==d;});
    var domTricky=shuffle(domSingleAll.filter(function(q){return q.tricky;}));
    var domPlain=shuffle(domSingleAll.filter(function(q){return !q.tricky;}));
    var cnt=Math.round(size*DOMAIN_WEIGHTS[d]/100);
    var multiTarget=Math.min(domMulti.length,Math.ceil(cnt*0.35));
    var picked=domMulti.slice(0,multiTarget);
    var remaining=cnt-picked.length;
    var trickyTarget=Math.min(domTricky.length,Math.ceil(remaining*0.5));
    picked=picked.concat(domTricky.slice(0,trickyTarget));
    remaining=cnt-picked.length;
    picked=picked.concat(domPlain.slice(0,Math.max(0,remaining)));
    pool=pool.concat(picked);
  }
  if(pool.length<size){
    var ALL_Q=QZ.concat(MULTI_QZ);
    var ex=shuffle(ALL_Q).filter(function(q){return pool.indexOf(q)<0;});
    pool=pool.concat(ex.slice(0,size-pool.length));
  }
  pool=shuffle(pool).slice(0,size);
  var maxTime=130*60;
  S.exam={qs:pool,cur:0,ans:{},flagged:[],started:true,done:false,timer:maxTime,iv:null,ngb:false,mode:"sentinel",optMaps:pool.map(function(q){return shuffle(q.o.map(function(_,ix){return ix;}));})};
  S.exam.iv=setInterval(function(){S.exam.timer--;updateTimerDisplay();if(S.exam.timer<=0){clearInterval(S.exam.iv);finishExam(true);}},1000);
  showToast("🛡️ Sentinel Mode — heavier multi-select + tricky wording, 130 min, target 850/900",getComputedStyle(document.body).getPropertyValue("--ye")||"#a8650f",3500);
  renderExamQ();
}

function finishExam(timeUp){
  clearInterval(S.exam.iv);
  var e=S.exam;
  var correct=0,byD={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}};
  var total=e.qs.length;
  if(total===0){renderExamHome();return;}
  for(var i=0;i<total;i++){
    var q=e.qs[i];byD[q.d].t++;
    var isMulti=!!q.multi;
    var ans=e.ans[i];
    if(ans===undefined){recordMissedResult(q,false);continue;}
    if(isMulti){
      if(!Array.isArray(ans)||ans.length!==q.multi){recordMissedResult(q,false);continue;}
      var selOrigSet=ans.map(function(di){return e.optMaps[i][di];}).sort(function(a,b){return a-b;});
      var correctSorted=q.a.slice().sort(function(a,b){return a-b;});
      var allMatch=selOrigSet.length===correctSorted.length&&selOrigSet.every(function(v,vi){return v===correctSorted[vi];});
      if(allMatch){correct++;byD[q.d].c++;}
      recordMissedResult(q,allMatch);
    } else {
      var so=e.optMaps[i][ans];
      var isOk=so===q.a;
      if(isOk){correct++;byD[q.d].c++;}
      recordMissedResult(q,isOk);
    }
  }
  var pct=Math.round(correct/total*100);
  var rp=pct/100;
  var scaled=rp>=0.83?Math.round(750+(rp-0.83)/0.17*150):
             rp>=0.70?Math.round(680+(rp-0.70)/0.13*70):
             rp>=0.50?Math.round(550+(rp-0.50)/0.20*130):
             Math.round(rp/0.50*550);
  scaled=Math.max(100,Math.min(900,scaled));
  e.done=true;e.score=correct;e.scaled=scaled;
  S.stats.sessions++;S.stats.correct+=correct;S.stats.total+=total;
  for(var d=1;d<=4;d++){
    if(!S.stats.domainScores[d])S.stats.domainScores[d]={correct:0,total:0};
    S.stats.domainScores[d].correct+=byD[d].c;S.stats.domainScores[d].total+=byD[d].t;
    checkDomainBadges(d);
  }
  if(total>=85)unlockBadge("marathon");
  if(e.mode==="sentinel"&&scaled>=855)unlockBadge("sentinel_cleared");
  save();
  window._lastExam={qs:e.qs,ans:e.ans,optMaps:e.optMaps};
  renderExamResults(correct,total,scaled,byD,timeUp,e.mode);
}

function toggleMissedReview(){
  var el=document.getElementById("missed-review"),btn=document.getElementById("review-btn");
  if(!el||!window._lastExam)return;
  if(el.style.display==="none"){
    var ex=window._lastExam,items="<div class='card' style='margin-bottom:16px'><h2 class='stitle' style='color:var(--rd)'>❌ Missed Questions</h2>",count=0;
    for(var i=0;i<ex.qs.length;i++){
      var q=ex.qs[i];
      var isMulti=!!q.multi;
      var correctSet=isMulti?q.a:[q.a];
      var correctLabel=isMulti?correctSet.map(function(ci){return q.o[ci];}).join(" + "):q.o[q.a];
      var ans=ex.ans[i];
      var unanswered=ans===undefined||(isMulti&&(!Array.isArray(ans)||ans.length===0));
      if(unanswered){
        count++;
        items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
          "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--ye0);color:var(--ye);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" UNANSWERED</span>"+q.q+"</div>" +
          "<div style='padding:8px;background:var(--gn0);border-radius:8px;font-size:12px;color:var(--gn);font-weight:600;margin-bottom:6px'>✅ "+correctLabel+"</div>" +
          "<div style='padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div></div>";
        continue;
      }
      var ok;
      var selOrigSet;
      if(isMulti){
        selOrigSet=ans.map(function(di){return ex.optMaps[i][di];});
        var sortedSel=selOrigSet.slice().sort(function(a,b){return a-b;});
        var sortedCorrect=correctSet.slice().sort(function(a,b){return a-b;});
        ok=sortedSel.length===sortedCorrect.length&&sortedSel.every(function(v,vi){return v===sortedCorrect[vi];});
      } else {
        selOrigSet=[ex.optMaps[i][ans]];
        ok=selOrigSet[0]===q.a;
      }
      if(ok)continue;
      count++;
      var opts2="";
      for(var di=0;di<ex.optMaps[i].length;di++){
        var oi=ex.optMaps[i][di];if(oi>=q.o.length)continue;
        var isC=correctSet.indexOf(oi)>=0,isW=selOrigSet.indexOf(oi)>=0&&!isC;
        opts2+="<div style='padding:6px 10px;margin-bottom:4px;border-radius:8px;border:1.5px solid "+(isC?"var(--gn)":isW?"var(--rd)":"var(--bd)")+";background:"+(isC?"var(--gn0)":isW?"var(--rd0)":"transparent")+";font-size:12px'><b>"+["A","B","C","D","E"][di]+".</b> "+q.o[oi]+(isC?" ✅":isW?" ❌":"")+"</div>";
      }
      items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
        "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--rd0);color:var(--rd);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" D"+q.d+(isMulti?" MULTI":"")+"</span>"+q.q+"</div>" +
        opts2+"<div style='margin-top:6px;padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div></div>";
    }
    if(count===0)items+="<p style='color:var(--gn);text-align:center;padding:20px'>🎉 No missed questions!</p>";
    items+="</div>";
    el.innerHTML=items;el.style.display="block";
    if(btn)btn.textContent="Hide Review";el.scrollIntoView({behavior:"smooth"});
  } else {el.style.display="none";if(btn)btn.textContent="📖 Review Missed";}
}

function pbqIsCorrect(qq,userAns){
  if(qq.type==="typein"){
    if(userAns===undefined||userAns===null)return false;
    var norm=String(userAns).trim().toLowerCase();
    if(norm==="")return false;
    var accepted=(qq.acceptable||[]).map(function(s){return String(s).trim().toLowerCase();});
    accepted.push(String(qq.answer||"").trim().toLowerCase());
    return accepted.indexOf(norm)>=0;
  }
  return userAns===qq.a;
}
function renderPBQ(sc,qIdx,answers){
  if(qIdx>=sc.questions.length){
    // Results
    var correct=0;
    for(var k in answers){ if(pbqIsCorrect(sc.questions[parseInt(k)],answers[k])) correct++; }
    var pct=Math.round(correct/sc.questions.length*100);
    var html="<div class='pg'>" +
      "<div class='card scale-in' style='text-align:center;padding:32px;margin-bottom:16px'>" +
      "<div style='font-size:48px;margin-bottom:8px'>"+(pct>=80?"🎯":pct>=60?"📊":"📚")+"</div>" +
      "<div style='font-family:var(--mono);font-size:28px;font-weight:600'>"+pct+"%</div>" +
      "<div style='color:var(--tx3);margin-top:4px'>"+correct+" of "+sc.questions.length+" correct</div>" +
      "</div>";
    for(var i=0;i<sc.questions.length;i++){
      var qq=sc.questions[i];
      var userAns=answers[i];
      var correct_i=pbqIsCorrect(qq,userAns);
      var isTypein=qq.type==="typein";
      var userLabel=isTypein?(userAns===undefined||userAns===""?"(no answer)":userAns):(userAns!==undefined&&qq.opts[userAns]!==undefined?qq.opts[userAns]:"(no answer)");
      var correctLabel=isTypein?(qq.answer||(qq.acceptable&&qq.acceptable[0])||""):qq.opts[qq.a];
      html+="<div class='card' style='margin-bottom:10px;border-left:4px solid "+(correct_i?"#22c55e":"#ef4444")+"'>" +
        "<div style='font-weight:600;margin-bottom:8px;font-size:13px'>Q"+(i+1)+": "+qq.q+"</div>" +
        "<div style='font-size:12px;margin-bottom:6px;padding:6px 10px;background:"+(correct_i?"#22c55e22":"#ef444422")+";border-radius:6px;font-family:"+(isTypein?"var(--mono)":"inherit")+"'>" +
        (correct_i?"\u2705":"&times;")+" Your answer: "+userLabel+"</div>";
      if(!correct_i){
        html+="<div style='font-size:12px;margin-bottom:6px;padding:6px 10px;background:#22c55e22;border-radius:6px;font-family:"+(isTypein?"var(--mono)":"inherit")+"'>" +
          "\u2705 Correct: "+correctLabel+"</div>";
      }
      html+="<div style='font-size:12px;color:var(--tx3);padding:6px 10px;background:var(--bg2);border-radius:6px'>"+qq.exp+"</div></div>";
    }
    html+="<div style='display:flex;gap:10px;margin-top:8px'>" +
      "<button class='btn btn-s' id='pbq-back-btn' style='flex:1'>Back to PBQ Menu</button>" +
      "<button class='btn btn-p' id='pbq-retry-btn' style='flex:1'>Retry Scenario</button>" +
      "</div></div>";
    render(html);
    document.getElementById('pbq-back-btn').addEventListener('click', function(){ renderPBQMenu(); });
    document.getElementById('pbq-retry-btn').addEventListener('click', function(){ renderPBQ(sc,0,{}); });
    return;
  }
  var qq=sc.questions[qIdx];
  var qType=qq.type||"mc";
  var stepDots="<div style='display:flex;gap:6px;margin-bottom:6px'>";
  for(var si=0;si<sc.questions.length;si++){
    var stDone=answers[si]!==undefined&&answers[si]!=="",stCur=si===qIdx;
    stepDots+="<div style='height:4px;flex:1;border-radius:3px;background:"+(stDone?"var(--cy)":stCur?"var(--ye)":"var(--bg4)")+"'></div>";
  }
  stepDots+="</div>";
  var typeLabel=qType==="typein"?"⌨️ TYPE YOUR ANSWER":qType==="hotspot"?"🎯 CLICK THE MATCHING ITEM":"";
  var html="<div class='pg'>" +
    stepDots +
    "<div style='font-size:12px;color:var(--tx3);margin-bottom:8px;font-family:var(--mono)'>" +
    sc.title+" &nbsp;·&nbsp; step "+(qIdx+1)+" of "+sc.questions.length+"</div>" +
    "<div style='background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.6'>"+
    (qIdx===0?sc.scenario:"")+"</div>" +
    "<div class='card' style='margin-bottom:16px'>" +
    (typeLabel?"<div style='font-size:10px;color:var(--ye);font-family:var(--mono);letter-spacing:.5px;margin-bottom:8px'>"+typeLabel+"</div>":"") +
    "<div style='font-weight:700;margin-bottom:12px;font-size:15px'>"+qq.q+"</div>";
  if(qType==="typein"){
    var curVal=answers[qIdx]!==undefined?answers[qIdx]:"";
    html+="<input type='text' id='pbq-typein-input' value=\""+String(curVal).replace(/"/g,"&quot;")+"\" placeholder='Type your answer here...' style='width:100%;padding:12px 14px;border-radius:8px;border:2px solid var(--bd2);background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:14px;box-sizing:border-box'>";
  } else {
    for(var j=0;j<qq.opts.length;j++){
      var sel=(answers[qIdx]===j);
      var optFont=qType==="hotspot"?"font-family:var(--mono);":"";
      html+="<div class='opt-row" + (sel?" opt-checked":"") + "' id='pbq-opt-"+j+"' data-opt='"+j+"' tabindex='0' role='button' aria-pressed='"+(sel?"true":"false")+"' style='cursor:pointer;padding:10px 14px;border-radius:8px;margin-bottom:8px;border:2px solid "+(sel?"var(--cy)":"var(--bg2)")+";background:"+(sel?"var(--cy0)":"var(--bg)")+";font-size:13px;"+optFont+"'>" +
        "<span style='font-weight:600;margin-right:8px'>"+"ABCDE"[j]+".</span>"+qq.opts[j]+"</div>";
    }
  }
  html+="</div>" +
    "<div style='display:flex;gap:10px'>";
  if(qIdx>0) html+="<button class='btn btn-s' id='pbq-prev' style='flex:1'>\u2190 Back</button>";
  var hasAns=qType==="typein"?(answers[qIdx]!==undefined&&String(answers[qIdx]).trim()!==""):(answers[qIdx]!==undefined);
  html+="<button class='btn btn-p' id='pbq-next' style='flex:1;"+(hasAns?"":"opacity:.4")+"'>"+(qIdx+1<sc.questions.length?"Next \u2192":"See Results")+"</button>" +
    "</div></div>";
  render(html);
  if(qType==="typein"){
    var inputEl=document.getElementById('pbq-typein-input');
    inputEl.addEventListener('input',function(){
      answers[qIdx]=this.value;
      var nb=document.getElementById('pbq-next');
      if(nb)nb.style.opacity=this.value.trim()!==""?"1":".4";
    });
    inputEl.focus();
  } else {
    document.querySelectorAll('[data-opt]').forEach(function(el){
      el.addEventListener('click',function(){
        var opt=parseInt(this.getAttribute('data-opt'));
        answers[qIdx]=opt;
        renderPBQ(sc,qIdx,answers);
      });
      el.addEventListener('keydown',function(ev){
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          var opt=parseInt(this.getAttribute('data-opt'));
          answers[qIdx]=opt;
          renderPBQ(sc,qIdx,answers);
        }
      });
    });
  }
  document.getElementById('pbq-next').addEventListener('click',function(){
    var ans=answers[qIdx];
    if(ans===undefined||(qType==="typein"&&String(ans).trim()==="")) return;
    renderPBQ(sc,qIdx+1,answers);
  });
  var prevBtn=document.getElementById('pbq-prev');
  if(prevBtn) prevBtn.addEventListener('click',function(){ renderPBQ(sc,qIdx-1,answers); });
}
window.renderPBQ=renderPBQ;

</script>
</body>
</html>
