{q:"Which Windows Event ID is created when a new service is installed — a common persistence mechanism?",o:["Event ID 4624", "Event ID 7045 (System log) — new service installed on system", "Event ID 4720", "Event ID 4688"],a:1,d:1,e:"Windows Event 7045 (Service Control Manager, System log): recorded when a new service is installed. Service name, file path, service type, start type. Attacker-created services: unusual names, paths in Temp/AppData, service type interactive (rare for legitimate services). Combine with: Event 4697 (security log, service install), process creation showing sc.exe or service API calls. Services provide persistence (run at startup), privilege (SYSTEM by default), and stealth (blend with legitimate services). Hunting for new/unexpected services is standard persistence hunting."},
{q:"Which log source on a Linux web server is MOST valuable for detecting web shell activity?",o:["/var/log/auth.log", "Web server access logs (Apache/Nginx access.log) combined with application server logs — HTTP POST to script files in unusual web directories, unusual User-Agents, commands in URL/POST parameters", "/var/log/syslog", "/var/log/kern.log"],a:1,d:1,e:"Web shell detection in access logs: 1) HTTP POST to .php/.asp/.aspx files not part of normal application (attacker-uploaded). 2) Unusual URL patterns (encoded commands). 3) User-Agent strings: scripting language libraries (Python urllib, Go http). 4) Status 200 for requests to unexpected paths. 5) Unusual request rates from single IP. 6) Time of day anomalies. Combine with file system monitoring (inotify, auditd) to detect new files in web directories. Web shells are simple files — detection requires both web log analysis and file system monitoring."},
{q:"Which SIEM query would BEST detect potential credential stuffing attacks?",o:["Search for any failed login", "Correlate: many failed authentications from many different usernames from a single source IP or small group of IPs, with normal or low failure rate per account", "Search for successful logins", "Alert on account lockouts only"],a:1,d:1,e:"Credential stuffing pattern: attackers test username:password lists where credentials came from other breaches. Characteristics: 1) Many different accounts attempted. 2) Small number of attempts per account (1-3 — staying below lockout). 3) Source IP concentration. 4) Often distributed (multiple source IPs — botnet). SIEM correlation: from single IP (or IP block), count distinct usernames with failed auth. Alert threshold: \x3E50 unique failed usernames in 1 hour from one source = credential stuffing. Differentiate from password spray (single password, many users) vs. stuffing (pairs)."},
{q:"Which Sysmon event ID logs process creation with full command-line arguments?",o:["Sysmon Event ID 3 (Network Connect)", "Sysmon Event ID 1 (Process Create) — logs image path, command line, parent process, user, hash, and GUID", "Sysmon Event ID 7 (Image Load)", "Sysmon Event ID 11 (File Create)"],a:1,d:1,e:"Sysmon Event ID 1 is the foundation of endpoint detection: full command line (reveals obfuscation), parent process (reveals suspicious parent-child relationships), file hash (enables threat intelligence enrichment), current directory, and image path. Critical for: detecting LOLBIN abuse (certutil with URLs, wscript with suspicious scripts), obfuscated PowerShell (encoded commands), and process injection chains. Windows native Event 4688 also logs process creation but requires additional configuration for command lines. Sysmon provides richer data by default."},
{q:"During threat hunting, an analyst checks parent-child process relationships. Which relationship is MOST suspicious?",o:["explorer.exe spawning notepad.exe", "WINWORD.exe spawning powershell.exe with encoded command — document macro executing PowerShell is a common phishing payload technique", "iexplore.exe spawning iexplore.exe", "svchost.exe spawning cmd.exe"],a:1,d:1,e:"Malicious parent-child processes: Office apps (WINWORD, EXCEL, POWERPNT) spawning: powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe = macro execution. Browsers spawning cmd.exe, powershell.exe = drive-by download. wscript.exe spawning cmd.exe = malicious script. Baseline: WINWORD.exe should spawn: WINWORD.exe sub-processes, spell check, Save As dialogs. Never powershell.exe in legitimate use. Parent-child analysis with Sysmon Event 1 or EDR is fundamental threat hunting data source."},
{q:"Which technique do attackers use to avoid detection by changing the file extension of malware to appear legitimate?",o:["Code signing", "Masquerading (T1036) — renaming malware as legitimate files (svchost.exe → scvhost.exe, or placing malware in legitimate paths)", "Encryption", "Compression"],a:1,d:1,e:"Masquerading techniques: 1) Typosquatting filenames: scvhost.exe (extra c), lsas.exe (missing s). 2) Legitimate-path placement: malware in C:\\Windows\\System32 (requires admin). 3) Extension hiding: malware.pdf.exe (Windows hides .exe). 4) Legitimate-looking names in wrong paths: explorer.exe in C:\\Temp\\. Detection: 1) Hash comparison vs. known-good (same filename, different hash). 2) Path validation (legitimate system files should be in specific directories). 3) Digital signature verification (legitimate Windows binaries are signed)."},
{q:"Which indicator is MOST useful for proactive blocking of known-malicious network infrastructure?",o:["Block all IP ranges", "Threat intelligence IOCs: malicious IP addresses, domains, and URL patterns from feeds — enable network-level blocking at firewall and proxy", "Block port 80", "Disable DNS"],a:1,d:1,e:"Threat intelligence integration with network controls: 1) Malicious IP lists → firewall deny rules. 2) Malicious domain lists → DNS sinkholes/blocklists. 3) URL patterns → proxy content filtering. 4) JA3 hashes → TLS inspection rules. Sources: commercial threat intel (CrowdStrike, Recorded Future), free feeds (AbuseIPDB, Emerging Threats), ISAC feeds, CISA bulletins. Automated feed integration (STIX/TAXII → firewall API) enables real-time blocking. Quality over quantity: noisy feeds with false positives block legitimate traffic."},
{q:"Which log source provides evidence of Kerberoasting attacks?",o:["Network flow data", "Windows Security Event ID 4769 — Kerberos TGS request with encryption type 0x17 (RC4) for a service account SPN", "Sysmon logs", "Application logs"],a:1,d:1,e:"Kerberoasting: request TGS ticket for service account SPN with RC4 encryption (weaker, crackable offline). Event 4769 (Kerberos service ticket operation): Ticket Encryption Type 0x17 (RC4-HMAC) is suspicious — modern systems use AES (0x12). Detection: alert on 4769 with RC4 encryption from non-service accounts, especially bulk requests for multiple different SPNs in short period. Prevention: service accounts with strong passwords (\x3E25 random characters), Group Managed Service Accounts (gMSA with auto-rotation), and AES-only encryption policy."},
{q:"Which SIEM use case detects impossible travel — authentication from two geographically distant locations within a short timeframe?",o:["Block all foreign logins", "Correlate: successful logins from same user account from geographically distinct IPs within a time window shorter than the minimum travel time between locations", "Block VPN usage", "Alert on all foreign IPs"],a:1,d:1,e:"Impossible travel detection: 1) Successful login from User X in New York at 9:00 AM. 2) Successful login from same User X in Moscow at 9:15 AM. 3) 9:15 AM — 9:00 AM = 15 minutes, insufficient for transatlantic travel. 4) = Credential compromise (one or both sessions). Implementation: geolocation lookup per IP, calculate distance/time between consecutive logins, alert if time \x3C minimum travel time. Tuning: VPN usage (may appear to be distant), legitimate international travel (calibrate minimum travel time). UEBA systems often have this built in."},
{q:"A scanner reports a critical vulnerability in OpenSSL 1.1.1 on a RHEL 8 system. The analyst checks and finds the vendor-installed package is 'openssl-1.1.1k-7.el8_6.x86_64'. This is likely:",o:["A confirmed vulnerability", "A false positive from version-string matching — RHEL backports security fixes without changing the version string; check the RHEL advisory, not upstream CVE database", "An exploitable finding", "A scanner error"],a:1,d:2,e:"Linux distribution backporting: RHEL, CentOS, Debian, Ubuntu LTS take upstream fixes and apply them to stable release versions WITHOUT bumping version numbers. Generic scanners match against upstream CVE version ranges and report false positives on patched RHEL packages. Validation: check Red Hat Security Advisories (access.redhat.com/security/updates), RHSA (Red Hat Security Advisory) patching history, or use Red Hat-certified scanner modes. The package changelog shows backported fixes."},
{q:"Which technique enables attackers to enumerate subdomains of a target organization during reconnaissance?",o:["Internal network scanning", "DNS brute forcing, DNS zone transfer (if misconfigured), certificate transparency logs, and OSINT sources — external reconnaissance revealing attack surface", "Port scanning", "Credential stuffing"],a:1,d:2,e:"Subdomain enumeration sources: 1) DNS brute force (sublist3r, amass, subfinder). 2) Certificate transparency (crt.sh) — TLS certificates disclose subdomains. 3) DNS zone transfers (AXFR queries — should be restricted to authorized servers). 4) OSINT (job postings, GitHub, HTML source). This reconnaissance reveals internal hostnames, development environments, forgotten assets. Defenders use same techniques for external attack surface management (EASM) to discover their own exposure before attackers do."},
{q:"Which vulnerability management output directly informs security architecture decisions?",o:["Individual CVE reports", "Systemic findings analysis: recurring vulnerability classes, architectural weaknesses, and control gap patterns — reveals root causes requiring design changes not just patches", "Daily scan counts", "Ticket closure rates"],a:1,d:2,e:"Strategic VM insights: 1) Recurring finding types (if SQLi keeps appearing, developers need training + code review process). 2) Architectural weaknesses (flat network enabling lateral movement). 3) Control gaps (missing MFA everywhere, no EDR coverage). 4) Asset class patterns (cloud workloads consistently misconfigured). This meta-analysis drives architecture investment, training programs, and strategic control improvements. Individual CVE remediation is operational; systemic analysis is strategic."},
{q:"Which scanning protocol provides the MOST accurate patch status for Windows systems when all else is equal?",o:["SNMP", "SMB authenticated scanning — provides access to registry, WMI, and system management interfaces for accurate patch enumeration", "ICMP", "HTTP"],a:1,d:2,e:"Windows authenticated scanning protocols: SMB (port 445) provides: registry access (patch state), WMI queries (installed software, patches), administrative shares ($). Most complete vulnerability data. Requires: local admin credentials, SMB access from scanner, remote registry enabled, firewall exception. SSH is for Linux; SNMP provides limited data; HTTP for web applications. Scanners that fall back to unauthenticated when credentials fail show significantly fewer findings — credential validation is essential."},
{q:"Which vulnerability is MOST commonly found when testing network devices (routers, switches, firewalls)?",o:["SQL injection", "Default credentials, outdated firmware, and management interface exposure — network device-specific vulnerability patterns", "XSS", "Buffer overflow in web apps"],a:1,d:2,e:"Network device vulnerability patterns: 1) Default credentials (admin/admin, cisco/cisco). 2) Outdated firmware (no auto-update). 3) Management interface exposure (web UI, SSH on untrusted interfaces). 4) SNMP with default community strings (public/private). 5) Unencrypted management (Telnet, HTTP). 6) Known CVEs in firmware (especially unpatched firewalls/VPNs). Assessment: Shodan fingerprinting, credential testing, firmware version CVE lookup. Critical because network devices have trusted position in the network topology."},
{q:"Which activity MUST occur before running intrusive vulnerability scans on production systems?",o:["Nothing", "Formal approval from system owners and change management — intrusive scans can crash services, consume resources, and trigger security alerts", "Scanner configuration", "Notification to all users"],a:1,d:2,e:"Intrusive scan authorization: 1) System owner approval — they accept risk of potential disruption. 2) Change management record. 3) Notification to on-call teams (scanner activity looks like an attack). 4) Maintenance window scheduling if possible. 5) Rollback plan if issues occur. 6) Emergency contact information. Unauthorized intrusive scanning constitutes unauthorized computer access in many jurisdictions — even by internal security teams. Written authorization (change request, email approval) protects the security team and ensures business alignment."},
{q:"Which vulnerability finding type typically indicates inadequate security testing during development?",o:["Network-level CVEs", "Application logic flaws: authentication bypasses, insecure direct object references, business logic manipulation — these exist in custom code scanners don't automatically detect", "OS vulnerabilities", "Standard CVEs"],a:1,d:2,e:"Application logic flaws are custom-code issues: 1) Authentication bypass (URL manipulation bypasses login). 2) IDOR (change ID in URL to access other users' data). 3) Business logic manipulation (change quantity to negative for refund). 4) Race conditions. 5) Privilege escalation in application logic. Automated scanners detect known vulnerability patterns; logic flaws require human tester understanding application intent. Manual penetration testing, code review, and bug bounty programs find these. Presence of logic flaws indicates insufficient security testing during development."},
{q:"An analyst is reviewing a vulnerability report for cloud storage. Which finding MOST urgently requires remediation?",o:["Missing security header", "Public read access on storage containing PII or credentials — immediate data exposure risk with no authentication barrier", "Outdated bucket policy", "Stale access logs"],a:1,d:2,e:"Cloud storage exposure severity: Public + sensitive data = critical breach risk. No exploitation required — anyone with the URL can access. Incident response: 1) Immediately restrict access. 2) Review access logs for evidence of unauthorized access. 3) Treat as potential breach. 4) Initiate breach assessment. Organizations have suffered major breaches from exposed S3 buckets: Capital One, multiple healthcare organizations. Prevention: S3 Block Public Access settings, CSPM continuous monitoring, data classification labels triggering automatic protection rules."},
{q:"Which vulnerability is specific to Kubernetes environments?",o:["SQL injection", "Misconfigured RBAC allowing cluster-admin to non-admin service accounts, exposed dashboard without authentication, or privilege escalation via pod breakout", "XSS", "Buffer overflow"],a:1,d:2,e:"Kubernetes-specific vulnerabilities: 1) RBAC misconfigurations (overpermissive ClusterRoleBindings). 2) Kubernetes Dashboard without auth (historical issue). 3) Exposed etcd (config database) without auth. 4) Privileged pod configurations (securityContext.privileged). 5) HostPath mounts (pod accesses host filesystem). 6) ServiceAccount token exposure. 7) Kubelet API exposure. Tools: kube-bench (CIS Kubernetes Benchmark), kube-hunter, Trivy for Kubernetes. Cloud provider managed Kubernetes shifts some security to provider but not all."},
{q:"Which scanning approach is appropriate for an organization with a large external attack surface across multiple cloud providers?",o:["Manual review", "Continuous external attack surface management (EASM) platform — automated discovery and monitoring of all internet-facing assets across all cloud providers and on-premises", "Quarterly manual scans", "Spreadsheet tracking"],a:1,d:2,e:"EASM platforms (Censys, Shodan-derived, Bishop Fox CAST, CyCognito, Palo Alto Cortex Xpanse): continuously monitor internet-facing assets, discover shadow IT, track certificate expirations, identify unpatched vulnerabilities on exposed services, and alert on new exposures. Critical for multi-cloud organizations where assets span AWS, Azure, GCP, and co-located infrastructure. Attackers use the same scanning techniques — EASM gives defenders equivalent visibility to understand their internet-facing risk posture."},
{q:"Which activity is required when a vulnerability exception expires?",o:["Automatically renew it", "Re-evaluate the risk: has it changed? Has a patch become available? Are compensating controls still effective? — formal re-review by risk owner required", "Delete the exception", "Ignore it"],a:1,d:2,e:"Exception lifecycle management: 1) Exceptions have defined expiration dates (typically 90 days to 1 year). 2) Before expiration: re-evaluate current risk. 3) If patch now available: remediate. 4) If compensating controls insufficient: escalate. 5) If exception remains appropriate: re-approve with updated risk assessment and owner signature. 6) Expired exceptions without renewal = open finding. Exception tracking in vulnerability management platforms automates expiration notifications and escalation. Expired exception management is an audit finding in many frameworks."},
{q:"Which type of assessment identifies weaknesses in how applications handle sensitive data?",o:["Network scan", "Data security review: checking encryption at rest and in transit, data classification enforcement, access controls on sensitive data — identifies PII/sensitive data exposure risks", "Compliance scan", "Port scan"],a:1,d:2,e:"Data security assessment focuses on: 1) Encryption at rest (database, file storage). 2) Encryption in transit (TLS version, certificate validity). 3) Access controls (who can access what data?). 4) Data classification (is sensitive data identified?). 5) Data retention (is sensitive data retained longer than needed?). 6) Logging (is sensitive data access logged?). 7) Masking/tokenization (is sensitive data masked in non-production?). Findings drive: encryption upgrades, access control improvements, data minimization, and classification enforcement."},
{q:"Which practice BEST manages vulnerability risk in a hybrid cloud environment?",o:["Separate tools for cloud and on-premises", "Unified vulnerability management platform with connectors for cloud (AWS, Azure, GCP) and on-premises — single risk view across entire environment", "Cloud only focus", "On-premises only focus"],a:1,d:2,e:"Hybrid VM challenges: 1) Different scanning methods (agent, API, network). 2) Different asset types (VMs, containers, serverless, bare metal). 3) Different cloud providers with different APIs. 4) Unified risk view needed for prioritization. Modern VM platforms (Tenable.io, Qualys VMDR, Rapid7 InsightVM) provide cloud-native connectors alongside traditional scanning. Single platform: unified risk scoring, consistent SLAs, single dashboard. Multiple tools: siloed data, inconsistent prioritization, management overhead."},
{q:"Which action should be taken if a penetration test discovers a vulnerability that was already in the vulnerability management tracker as 'in progress'?",o:["Ignore the pentest finding", "Re-prioritize — pentest confirmed exploitability changes the risk profile; accelerate remediation beyond normal SLA if exploitation was demonstrated", "Close as duplicate", "Escalate to CISO only"],a:1,d:2,e:"Penetration test confirmation of known vulnerabilities: 1) Updates risk profile (theoretical → confirmed exploitable). 2) Should accelerate remediation timeline. 3) May trigger escalation depending on impact. 4) Documentation: update ticket with pentest confirmation and exploitation evidence. 5) Report to leadership if previously 'risk accepted'. Known-but-unpatched vulnerabilities are leading causes of breaches — pentest confirmation justifies emergency patching timeline. This also reveals SLA failures if the finding has been 'in progress' for too long."},
{q:"Which vulnerability is MOST associated with authentication token theft and session hijacking?",o:["SQL injection", "Cross-Site Scripting (XSS) — JavaScript execution in victim's browser can steal authentication cookies and session tokens", "CSRF", "Path traversal"],a:1,d:2,e:"XSS → session hijacking: stored XSS in a vulnerable page executes JavaScript for every visitor. Malicious script: document.cookie sends authentication tokens to attacker-controlled server. Attacker uses stolen token without needing credentials. Prevention: HttpOnly cookie flag (blocks JavaScript cookie access), Secure flag (HTTPS only), Content Security Policy (restricts script execution). Impact: complete account compromise without knowing credentials. High severity for applications with sensitive data or elevated privileges."},
{q:"Which finding from a vulnerability assessment indicates lack of security hygiene across all systems?",o:["Single unpatched CVE", "Widespread outdated software, missing patches across multiple systems, and default credentials — systemic hygiene issues", "Configuration file issue", "Application-level bug"],a:1,d:2,e:"Security hygiene indicators: 1) Missing patches: critical patches outstanding for \x3E30 days across \x3E50% of systems. 2) Outdated software: EOL OS, old browsers, outdated frameworks. 3) Default credentials: unchanged factory passwords. 4) Unnecessary services: telnet enabled, no firewall. 5) Poor credential hygiene: admin everywhere, no MFA. Systemic hygiene issues indicate process failures: no patch management program, no asset management, no security baseline enforcement. These findings drive program-level recommendations, not individual remediations."},
{q:"Which tool is MOST appropriate for scanning infrastructure-as-code (IaC) files for security misconfigurations before deployment?",o:["Network scanner", "IaC security scanning tools like Checkov, tfsec, Terrascan — analyze Terraform, CloudFormation, Kubernetes YAML for misconfigurations before deployment", "DAST tool", "Endpoint agent"],a:1,d:2,e:"IaC security scanning: 1) Checkov (Python, multi-framework: Terraform, CloudFormation, ARM, Kubernetes). 2) tfsec (Terraform-specific). 3) Terrascan. 4) KICS (Checkmarx). 5) Bridgecrew. Catches: public S3 buckets in Terraform code, permissive security groups, disabled logging, unencrypted storage. Pre-deployment scan prevents misconfigurations reaching cloud. CI/CD integration: scan IaC files on every PR. Shift-left security for cloud infrastructure. Misconfigurations in IaC deploy to all future environments — catching them in code is highest leverage point."},
{q:"Which approach addresses the challenge of managing vulnerabilities across thousands of ephemeral cloud instances?",o:["Track each instance manually", "Golden image security: secure and scan base images, automatically scale security with instances — vulnerability in base image addressed at source", "Scan each instance", "Accept the risk"],a:1,d:2,e:"Ephemeral infrastructure (auto-scaling, spot instances, containers) challenges traditional per-instance scanning: instances may not exist long enough to scan. Golden image approach: 1) Define secure base images (hardened, patched). 2) Scan images before publishing. 3) All instances launched from secure base inherit security. 4) When vulnerabilities emerge, update base image and redeploy. 5) No running instances are individually patched — they're replaced with updated images. Immutable infrastructure principle: don't patch running instances, replace with updated images."},
{q:"Which control reduces risk from unpatched vulnerabilities in web applications immediately?",o:["Notify vendor", "Deploy web application firewall (WAF) with virtual patching rules that block exploitation attempts for known vulnerabilities", "Increase logging", "User training"],a:1,d:2,e:"WAF virtual patching: applies protection rules targeting specific vulnerability exploitation patterns without modifying application code. Examples: ModSecurity OWASP Core Rule Set blocks common attack patterns; vendor-specific rules for specific CVEs. Deployment considerations: 1) Learning mode first (identify false positives). 2) Rule tuning for application-specific traffic. 3) Regular rule updates. 4) Monitor effectiveness. Not a permanent solution — actual patching remains the goal. Virtual patching buys time during patch testing and deployment cycles."},
{q:"Which finding in a vulnerability report indicates potential for privilege escalation in Linux systems?",o:["Standard CVE", "SUID/SGID binaries with known vulnerabilities or custom binaries with elevated permissions — allow non-privileged users to execute code with elevated privileges", "Network port scan result", "Memory usage"],a:1,d:2,e:"Linux SUID privilege escalation: files with SUID bit run with owner's privileges (often root). Attackers abuse: 1) Vulnerable SUID binaries (known CVEs). 2) Custom SUID scripts (poor implementation). 3) SUDO misconfigurations (ALL nopasswd). 4) Weak file permissions on SUID executables. Detection: find / -perm /4000 -ls (lists all SUID files). GTFOBins database lists SUID abusable binaries. Remediation: remove unnecessary SUID bits, update vulnerable SUID binaries, review sudo rules. Critical for post-compromise privilege escalation."},
{q:"Which vulnerability management reporting cadence is MOST appropriate for tracking SLA compliance?",o:["Annual reporting", "Weekly or bi-weekly SLA compliance reports: current breach status, upcoming SLA deadlines, and overdue findings by owner — enables proactive management", "Monthly at minimum", "Quarterly"],a:1,d:2,e:"SLA tracking frequency: weekly/bi-weekly allows: 1) Proactive identification of approaching deadlines. 2) Escalation before breach. 3) Resource adjustment. 4) Blocking issue resolution. Monthly = remediation teams discover missed SLAs in arrears. Weekly allows course correction. SLA compliance reports by owner: each team sees only their responsibilities. Trend analysis: is SLA compliance improving? Which teams consistently miss? What's the blocking issue? SLA reporting drives accountability and program improvement."},
{q:"Which technique identifies whether a vulnerability scanner is missing assets in its scope?",o:["Trust the scanner", "Cross-reference scanner asset coverage with CMDB, DHCP logs, network flow data, and cloud API inventory — identifies scanning blind spots", "Manual checking only", "Assume complete coverage"],a:1,d:2,e:"Coverage validation: compare scanner's asset list against: 1) CMDB (authoritative asset inventory). 2) DHCP server logs (all IPs that got leases). 3) Cloud APIs (AWS Trusted Advisor, Azure Resource Graph). 4) Network flow data (all IPs communicating). 5) DNS records. Discrepancies = unscanned assets = blind spots. Common gaps: cloud assets not in scanner scope, VPN-connected endpoints, IoT/OT devices, assets behind NAT. Coverage gaps are as important as finding counts — unknown assets are worst vulnerability."},
{q:"Which regulatory requirement MOST directly mandates vulnerability scanning for healthcare organizations?",o:["PCI DSS", "HIPAA Security Rule (45 CFR 164.308(a)(8)) — requires periodic technical and non-technical evaluations of security controls, including vulnerability assessments", "GDPR", "SOX"],a:1,d:2,e:"HIPAA Security Rule (164.308(a)(8)): Evaluation Standard requires periodic technical and non-technical evaluations in response to environmental or operational changes. HHS guidance and HIPAA auditors treat vulnerability scanning as an expected implementation of this requirement. While HIPAA doesn't prescribe specific scanning frequency (unlike PCI DSS), covered entities without vulnerability management programs fail HIPAA audits. HICP (Health Industry Cybersecurity Practices) provides healthcare-specific vulnerability management guidance."},
{q:"Which vulnerability management practice ensures findings are addressed in the CORRECT remediation priority?",o:["Process findings alphabetically", "Risk-based priority queue: combine CVSS, EPSS, KEV, asset criticality, and compensating controls into a unified score — treat highest-risk findings first regardless of discovery order", "Process by discovery date", "Process by severity label alone"],a:1,d:2,e:"Priority queue construction: risk score = f(CVSS, EPSS, KEV, asset criticality, exposure, controls). This produces a single ordered list. Operators work top-to-bottom through the list. Advantages: 1) Resources focus on highest actual risk. 2) Objective prioritization resistant to individual pressure. 3) Alignment with business risk appetite. 4) Measurable and auditable. Common anti-pattern: processing by CVSS alone inflates remediation effort on low-exploitability critical CVEs while high-exploitability medium CVEs wait. Risk-based queues correct this."},
{q:"Which finding demonstrates that an organization's vulnerability management program is MATURE?",o:["Many vulnerabilities found", "Consistent SLA compliance (\x3E90%), decreasing MTTR trend over time, full asset coverage, risk-based prioritization, and closed-loop verification — programmatic outcomes", "One scanner deployed", "Many findings"],a:1,d:2,e:"VM program maturity indicators: 1) SLA compliance \x3E90% (commitments kept). 2) MTTR decreasing quarter-over-quarter. 3) \x3E95% asset coverage. 4) Risk-based prioritization implemented. 5) Closed-loop verification (every remediation re-scanned). 6) Integration with CMDB, ticketing, patch management. 7) Executive visibility dashboard. 8) Regular program metrics review. Finding count is not a maturity indicator — mature programs have fewer OPEN findings (better remediation) but may discover more (better coverage). Outcomes matter more than activity volume."},
{q:"An organization wants to reduce false positives in their vulnerability scanning program. The MOST effective approach is:",o:["Accept all findings", "Configure authenticated scanning, enable smart results (vendor-specific patch databases), and tune scanner to the actual asset types and OS versions — reduces version-string false positives", "Disable scanning", "Accept false positives"],a:1,d:2,e:"False positive reduction techniques: 1) Authenticated scanning (checks actual patch state vs. version string). 2) OS-aware scanning (understand vendor backporting for RHEL, Ubuntu LTS, Debian). 3) Scan profile tuning (target OS, application types). 4) Plugin tuning (disable plugins known to produce false positives in your environment). 5) False positive documentation (suppress confirmed FPs with documentation). 6) Regular review of exception list. Well-tuned authenticated scanning achieves \x3C10% false positive rate. Poorly configured scanning can be \x3E50% false positives."},
{q:"Which type of vulnerability is most commonly introduced when an organization migrates from monolithic to microservices architecture?",o:["SQL injection in existing code", "Inter-service authentication gaps, overpermissive service-to-service communication, and exposed internal APIs — architectural transition vulnerabilities", "Outdated OS", "Network scan results"],a:1,d:2,e:"Microservices transition vulnerabilities: 1) Service-to-service authentication (each service call needs authentication/authorization — often added as afterthought). 2) Internal API exposure (services communicate via APIs; if any service is compromised, APIs become attacker's lateral movement path). 3) Overpermissive network policies (all services allowed to communicate by default). 4) Secret management (many services need credentials — insecure storage is common). 5) Inadequate logging (distributed system, difficult to correlate). Service mesh (Istio, Linkerd) helps address some of these issues."},
{q:"Which vulnerability management function is responsible for defining remediation timeframes?",o:["Scanning team", "Security policy/governance: vulnerability management policy defines SLAs by severity class, approved by leadership, enforced across the organization", "Individual system owners", "Legal team"],a:1,d:2,e:"SLA governance: 1) Security team proposes reasonable SLAs based on risk. 2) Leadership approves (becomes organizational policy). 3) IT operations and business units accept the obligation. 4) Enforcement mechanism: tracking, escalation, audit findings. Common SLAs: Critical: 7-15 days. High: 30 days. Medium: 90 days. Low: 365 days. Without formal SLAs: no accountability, no measurement basis, no escalation trigger. Policy-driven SLAs with leadership approval create legitimate enforcement authority that security teams often lack without explicit mandate."},
{q:"Which scan finding is UNIQUE to authentication systems and is critical to remediate immediately?",o:["Missing patch", "Authentication bypass allowing login without valid credentials — complete authentication failure affecting all users of the system", "Missing header", "Info disclosure"],a:1,d:2,e:"Authentication bypass severities: 1) Complete bypass (login without credentials): CVSS ~9.8, emergency remediation. 2) Partial bypass (skip certain auth steps): varies. 3) Authentication confusion (wrong account accessed). Authentication systems are gatekeepers — bypass means all protected resources are accessible without authorization. Examples: CVE-2020-1472 ZeroLogon (Netlogon auth bypass), FortiGate VPN auth bypass. Immediate remediation even outside change windows. No compensating control substitutes for fixing authentication bypass — every hour of exposure risks full compromise."},
{q:"Which of these findings should trigger immediate escalation to executive leadership and possibly the board?",o:["Single medium vulnerability", "Evidence that sensitive customer data was exfiltrated from a production system — material breach with regulatory notification obligations and significant business impact", "Single unpatched system", "Configuration deviation"],a:1,d:2,e:"Executive escalation triggers in vulnerability/incident programs: 1) Customer data exfiltration (breach). 2) Critical infrastructure compromise. 3) Ransomware deployment. 4) Regulatory notification obligation triggered. 5) Sustained APT activity. 6) Significant financial impact. Single vulnerabilities, configuration deviations, and operational issues are handled operationally. Material breaches — especially those with regulatory reporting obligations (GDPR, HIPAA, SEC) or significant business impact — require executive and board awareness for governance decisions and public statements."},
{q:"Which vulnerability arises when a web application includes user-controlled data in an HTTP redirect?",o:["SQL injection", "Open redirect — attacker uses trusted domain to redirect victims to malicious sites, aiding phishing", "XSS", "CSRF"],a:1,d:2,e:"Open redirect vulnerability: web application redirects to URL from user input without validation. Example: https://trusted-site.com/redirect?url=https://evil.com. Trusted domain in URL tricks users. Use cases for attackers: phishing (trust inherited from legitimate domain), OAuth redirect_uri manipulation, browser cache poisoning. Remediation: whitelist valid redirect destinations, validate redirect URLs against allowed domains, avoid URL redirection based on user input entirely. CWE-601. Often dismissed as low severity but important in phishing campaigns."},
{q:"Which scanning activity is typically performed by an Approved Scanning Vendor (ASV)?",o:["Internal network scanning", "External PCI DSS quarterly scanning of internet-facing systems — ASVs are PCI-certified organizations authorized to conduct external scans for compliance", "SAST code analysis", "Internal penetration testing"],a:1,d:2,e:"ASV (Approved Scanning Vendor) requirements in PCI DSS: 1) Quarterly external scans of all externally-accessible systems in PCI scope. 2) ASVs are certified by PCI SSC. 3) Scans must pass criteria defined in ASV Program Guide. 4) Failed scans must be rescanned until passing. 5) ASV provides scan report used for PCI compliance attestation. Internal teams can do internal scans; external scans must be by ASV. After passing external scan, ASV issues attestation included in PCI audit package."},
{q:"Which cloud vulnerability is difficult to detect with traditional vulnerability scanners?",o:["Outdated OS on VMs", "IAM privilege escalation paths — cloud identity-based attacks where permissions can be chained to gain higher access are invisible to network or host-based scanners", "Network port exposure", "CVE in deployed software"],a:1,d:2,e:"Cloud IAM privilege escalation: 1) User A has permission to assume role B. 2) Role B can update Lambda functions. 3) Lambda function has admin permissions. 4) Chain: User A → assume role B → update Lambda → execute as admin. Traditional scanners don't analyze IAM permissions. Tools: Cloudsploit, PMapper (AWS), Stormspotter (Azure), ScoutSuite. CIEM (Cloud Infrastructure Entitlement Management) products specifically address identity risk in cloud. IAM misconfigurations enable breaches without exploiting any CVE."},
{q:"Which step follows immediately after installing a critical security patch in a production environment?",o:["Schedule next patch", "Validate: test application functionality, run vulnerability rescan on patched system, verify patch shows as installed, document the change and verification results", "Wait and observe", "Notify users"],a:1,d:2,e:"Post-patch validation protocol: 1) Functional testing (application still works correctly). 2) Vulnerability rescan (confirm finding no longer detected). 3) Patch confirmation (verify OS/package manager shows patch installed). 4) Log review (any errors from patch application?). 5) Documentation (close change record, close vulnerability ticket with validation evidence). 6) Monitoring (watch for anomalies post-patch). Critical patches sometimes introduce functionality regressions — immediate validation catches issues before they become operational incidents."},
{q:"An analyst determines that an attacker compressed and encrypted files in a staging directory before exfiltration. The staging directory was deleted. Which forensic technique recovers the evidence?",o:["Request logs from the attacker", "File carving from unallocated disk space combined with NTFS $MFT analysis to identify previously existing files and their creation/deletion timestamps", "Accept evidence is lost", "Memory analysis only"],a:1,d:3,e:"File carving in unallocated space: even after deletion, file data remains in unallocated clusters until overwritten. $MFT records the file entry (name, timestamps, size) — even after deletion, $MFT entries persist with a deletion flag. Combine: $MFT shows files existed (names, timestamps), file carving recovers actual content. Tools: Autopsy, FTK, PhotoRec, Scalpel. Time sensitivity: write activity on disk overwrites unallocated clusters — forensic imaging immediately preserves maximum recoverable data."},
{q:"Which command on a Linux system lists all currently established network connections with process information during an IR investigation?",o:["ps aux", "ss -tnp or netstat -tnp — shows established TCP connections with process names and PIDs, enabling correlation of suspicious connections to specific processes", "ls -la", "df -h"],a:1,d:3,e:"Linux live network analysis: 'ss -tnp' (socket statistics, TCP, numeric, process). 'netstat -tnp' (legacy equivalent). Output: local/remote addresses, state, PID/process name. Correlation: suspicious process maintaining connection to external IP, unusual port use, unexpected programs with network connections. During IR: 1) Run immediately (before containment changes state). 2) Document output. 3) Cross-reference with threat intelligence. 4) Investigate unexpected processes. Also: 'lsof -i' lists all open network files with process."},
{q:"Which type of attack uses previously stolen credentials from one organization's breach to log into accounts at other organizations?",o:["Phishing", "Credential stuffing — automated use of leaked username:password pairs against other services, exploiting password reuse", "Brute force", "Password spray"],a:1,d:3,e:"Credential stuffing exploits password reuse: users using same password across multiple services. Attackers purchase credential dumps from underground markets and test credentials at scale (automated tools: Sentry MBA, OpenBullet, custom scripts). Detection: many failed authentication attempts across many accounts, successful authentications with unusual geolocation, bulk account activity. Defense: breach credential monitoring (HaveIBeenPwned API), MFA (defeats stuffing even with correct credentials), CAPTCHA, IP reputation. Major breaches traced to credential stuffing."},
{q:"During an active ransomware incident, the IR team discovers the ransomware has a network-share propagation capability. The MOST critical containment action beyond isolating the initially infected host is:",o:["Notify all users", "Disable/limit SMB access at network layer and quarantine any host showing file system encryption activity — prevent network-share propagation across the environment", "Install antivirus", "Change passwords"],a:1,d:3,e:"Network-propagating ransomware containment: 1) Block SMB (port 445) at network distribution layer (core switches, firewall). 2) Query EDR for processes creating high volumes of file I/O (encryption signature). 3) Isolate any host matching the profile. 4) Disable access to shared network drives. 5) Identify and isolate patient zero. SMB propagation enabled WannaCry and NotPetya to spread across entire organizations in minutes. Network-layer control is the only immediately effective scale-up block; host-by-host remediation is too slow when propagation is occurring."},
{q:"Which element is MOST critical in an incident response retainer agreement?",o:["Cost per hour", "Response SLA commitments: guaranteed response time (typically 1-4 hours for critical incidents), defined communication channels, and escalation procedures — business continuity depends on speed", "Vendor reputation only", "Payment terms"],a:1,d:3,e:"IR retainer key terms: 1) Response SLA (how fast do they respond to your call at 2 AM?). 2) Scope of services (what's covered: forensics, negotiation, notification assistance?). 3) Hours included vs. billable. 4) Preferred vendor list with insurance (insurer may require specific IR firm). 5) Evidence handling jurisdiction. 6) Communication protocols. 7) Pre-engagement activities (IR plan review, tabletop). Response SLA is critical — a 24-hour response time for critical incidents is unacceptable. Top IR firms commit to \x3C1 hour initial contact for critical retainers."},
{q:"Which Windows registry location stores evidence of programs run via the Run dialog (Win+R)?",o:["HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run", "NTUSER.DAT\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU — stores the history of commands typed in the Run dialog", "HKLM\\SYSTEM", "NTUSER.DAT\\Desktop"],a:1,d:3,e:"RunMRU (Most Recently Used): NTUSER.DAT\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU records commands typed in Start→Run or Win+R. Valuable forensic artifact: attacker typed 'cmd', 'powershell', or a command path directly. Combined with: TypedPaths (Explorer address bar history), WordWheelQuery (search terms), RecentDocs (recently opened files) — builds picture of user/attacker interactive activity. Windows registry forensics with tools like RegRipper or ShellBagsExplorer."},
{q:"A threat hunter suspects an attacker is using process hollowing. Which EDR telemetry BEST identifies this technique?",o:["Network logs", "Process creation followed by memory write to the process's own allocated regions plus executable image path mismatch — process claims to be legitimate but contains injected code", "File system logs", "Authentication logs"],a:1,d:3,e:"Process hollowing (T1055.012): 1) Create legitimate process (suspended). 2) Unmap the process's code. 3) Map malicious code into the process address space. 4) Resume execution. Detection signatures: 1) Process created in SUSPENDED state. 2) Virtual memory APIs (WriteProcessMemory, VirtualAllocEx) from parent process. 3) Image file hash mismatch (process claims to be calc.exe but hash doesn't match). 4) Mapped executable not backed by file on disk. EDR tools: Sysmon Event 8 (CreateRemoteThread), Event 10 (ProcessAccess), memory scanning."},
{q:"Which IR action immediately limits attacker ability to access additional internal resources after initial compromise?",o:["Full investigation first", "Network isolation of the compromised host — removes attacker's network access while preserving local forensic evidence", "Change all passwords organization-wide", "Notify all employees"],a:1,d:3,e:"Network isolation is the immediate high-impact containment: removes attacker's network access path, stops lateral movement from the host, stops C2 communication, and stops data exfiltration — all while keeping the host powered on (preserving memory/forensic evidence). Methods: EDR network containment feature (software-based isolation), VLAN change (network-based), firewall rule (block host's traffic). Decision: containment vs. dwell-time intelligence collection is a tactical judgment call per incident context."},
{q:"Which forensic step confirms that an acquired disk image is an exact, unmodified copy of the original?",o:["Visual inspection", "Hash verification — calculate MD5 and/or SHA-256 of both source disk and acquired image; identical hashes prove bit-for-bit accuracy", "File count comparison", "Size comparison"],a:1,d:3,e:"Forensic image integrity: 1) Hash source media before imaging (baseline). 2) Acquire image with write-blocker (no modification to source). 3) Hash acquired image (verify). 4) Compare hashes — identical = forensically sound, bit-for-bit copy. 5) Document both hashes and tools used. SHA-256 is preferred (MD5 has collision vulnerabilities). Tools: FTK Imager, dc3dd, Guymager. Chain of custody documentation includes hash values. Evidence without hash verification cannot be proven unmodified and may be challenged in legal proceedings."},
{q:"Which attack involves sending a large number of half-open TCP connections to overwhelm a server's connection table?",o:["SQL injection", "TCP SYN flood — sends thousands of SYN packets without completing the handshake, exhausting the target's half-open connection state table", "CSRF", "XSS"],a:1,d:3,e:"TCP SYN flood (T1498.001): attacker sends SYN (connection request) without completing handshake (no ACK). Server allocates state for each half-open connection. State table exhausted → legitimate connections refused. Mitigation: 1) SYN cookies (server doesn't allocate state until handshake completes). 2) Rate limiting inbound SYN. 3) Firewall stateful inspection. 4) DDoS mitigation services. Detection: high SYN rate with low SYN-ACK completion rate from many source IPs. Part of broader DDoS/DoS attack toolkit."},
{q:"Which step BEST prevents contamination of evidence during an incident investigation?",o:["Share everything immediately", "Write-protect all evidence before examination, maintain separate evidence copies (working copy vs. master), and document every action taken", "Examine original media directly", "Use cloud storage"],a:1,d:3,e:"Evidence contamination prevention: 1) Write-blocker on physical media during imaging. 2) Never examine original media — examine forensic copy. 3) Master copy: stored securely, never modified. 4) Working copy: used for analysis. 5) Document every action (tools used, commands run, analysts involved). 6) Hash verification before and after any action. Examining original media without write protection = potential evidence modification = chain of custody break. Every step documented supports legal proceedings."},
{q:"Which type of insider threat is MOST difficult to detect using technical controls?",o:["Former employee using retained access (detectable by access after termination)", "Malicious employee using legitimate access within their authorized scope — activity is authorized, making it look normal despite malicious intent", "Contractor using unauthorized resources", "Account sharing"],a:1,d:3,e:"Privileged authorized insider: hardest case — all access is authorized. Detection requires: 1) UEBA (behavioral analytics detecting anomalous patterns in otherwise authorized access). 2) Data tagging and access auditing (who accessed what, when). 3) Volume anomalies (unusual data volume accessed). 4) Time anomalies (accessing data at unusual hours). 5) Contextual anomalies (accessing data unrelated to job function). 6) DLP (attempting to transfer data outside authorized channels). No technical control is 100% effective — complemented by HR indicators, management observation, and access reviews."},
{q:"During a business email compromise (BEC) investigation, which log source MOST directly reveals attacker activity?",o:["Network perimeter logs", "Email gateway logs, email server audit logs, and cloud email access logs (Microsoft 365 Audit, Google Workspace) — record login events, mail access, rule creation, forwarding configuration", "Endpoint logs only", "Application logs only"],a:1,d:3,e:"BEC investigation sources: 1) M365 Unified Audit Log / Google Workspace audit: login events with IP/geolocation, mail read events, rules created, forwarding configured, messages sent. 2) Email gateway: message flow, external forwarding. 3) Authentication logs: MFA events, legacy auth, suspicious login locations. 4) Browser/device: new device logins. BEC timeline: compromise → reconnaissance (reading email) → forwarding rule creation → attack (payment diversion). Each phase leaves audit log evidence. Enable unified audit logging BEFORE incidents — it's off by default in some M365 configurations."},
{q:"Which method BEST identifies persistence mechanisms installed by an attacker that survive reboots?",o:["Run antivirus", "Use Autoruns (Sysinternals) — comprehensively catalogs all startup locations: registry run keys, services, scheduled tasks, drivers, browser extensions, WMI subscriptions, and more", "Examine running processes only", "Check recent files"],a:1,d:3,e:"Autoruns comprehensive coverage: Run Keys (HKLM/HKCU), Scheduled Tasks, Services, Drivers, Boot Execute, Image Hijacks, AppInit DLLs, Winlogon, Browser Helper Objects, Office Add-ins, WMI subscriptions, Sidebar gadgets, Codecs, and more. Filter by VirusTotal hash submission (red highlighting for suspicious items). Network-accessible remote autoruns analysis for IR. No single location covers all persistence — only comprehensive tools like Autoruns provide full coverage. Standard persistence hunting in IR: Autoruns with VirusTotal integration identifies most persistence mechanisms quickly."},
{q:"Which stakeholder requires IMMEDIATE notification when a breach potentially affects publicly traded company stock price?",o:["IT staff", "Legal counsel and CFO/CEO — material cybersecurity incidents may trigger SEC disclosure requirements and securities regulations", "Marketing department", "Vendor support"],a:1,d:4,e:"SEC cybersecurity disclosure rules (2023): material incidents must be disclosed on Form 8-K within 4 business days of determining materiality. Material = information that a reasonable investor would consider important. Immediate internal notification: CEO, CFO, legal counsel, board (especially audit committee). These individuals determine materiality and sign off on public disclosures. Late or inadequate disclosure = SEC enforcement. Pre-established escalation procedures identify roles and responsibilities. Public companies must integrate cybersecurity incident response with securities compliance."},
{q:"Which type of communication BEST maintains organizational morale during a significant security incident?",o:["No internal communication", "Transparent, factual internal updates: what happened, what's being done, what employees should/shouldn't do, and what to expect next — reduces speculation and demonstrates competent response", "Detailed technical briefing to all staff", "Blaming individuals"],a:1,d:4,e:"Internal incident communication objectives: 1) Reduce speculation (information vacuums fill with rumor). 2) Provide actionable guidance (what employees should do differently). 3) Demonstrate competent response (leadership is handling it). 4) Maintain trust (transparency during adversity builds trust). 5) Prevent unhelpful actions (employees attempting their own 'fixes'). Tone: factual, calm, confident. Frequency: regular updates even when saying 'still investigating.' Avoid: blaming individuals (creates fear culture), excessive detail (causes panic), minimizing (later revelations damage trust more."},
{q:"Which metric demonstrates the security program is proactively reducing risk rather than just reacting?",o:["Response time to incidents", "Decreasing number of incidents over time combined with increasing MTTD — fewer incidents AND faster detection signals proactive risk reduction", "Incident volume", "Alert volume"],a:1,d:4,e:"Proactive vs. reactive security metrics: Reactive: MTTR (how fast we respond). Proactive: threat hunting findings (threats found before damage), attack surface reduction trend, vulnerability backlog decreasing, security architecture improvements (fewer exploitable paths). Decreasing incident frequency combined with faster detection = prevention is working AND detection capability improving. Purely reactive programs have flat or increasing incident volumes. Proactive programs show decreasing incident volume from prevention investments."},
{q:"Which element is REQUIRED in a HIPAA breach notification letter to affected individuals?",o:["Technical exploitation details", "Description of the breach, types of PHI involved, what individuals should do to protect themselves, and what the covered entity is doing — prescribed content under 45 CFR 164.404", "Vendor patch information", "IR team resumes"],a:1,d:4,e:"HIPAA breach notification to individuals (45 CFR 164.404) must include: 1) Brief description of what happened. 2) Types of PHI involved. 3) What individuals should do to protect themselves. 4) What the covered entity is doing. 5) Contact information. 6) If required by state law, additional content. Written by first-class mail. Substitute notice (website/media) if contact information is insufficient. Notification no later than 60 days after discovery. Missing required elements or late notification creates additional HIPAA violation beyond the breach itself."},
{q:"Which report section provides the MOST value for executive decision-making following a vulnerability assessment?",o:["Appendix with raw scan data", "Risk summary: top risks by business impact, remediation investment required, and risk if unaddressed — financial framing enabling resource allocation decisions", "List of all CVEs", "Technical methodology"],a:1,d:4,e:"Executive decision-enabling sections: 1) Risk summary (top 5-10 risks in business terms). 2) Financial impact estimate (breach cost if exploited). 3) Remediation investment required (cost, effort). 4) Risk if unaddressed (what happens if we don't act). 5) Recommended action with timeline. This framing enables decisions: 'Risk A costs $100K to fix and could result in $5M breach — approve.' Technical appendices exist for practitioners. Executive summary drives investment decisions. Reports without financial framing leave executives unable to make informed resource allocation decisions."},
{q:"Which communication deliverable helps the board fulfill its cybersecurity governance responsibilities under SEC rules?",o:["IT operations dashboard", "Regular cybersecurity risk briefings covering: material risks, program effectiveness metrics, material incident disclosures, regulatory changes, and strategic investments — enabling informed governance decisions", "Firewall logs", "Vulnerability counts"],a:1,d:4,e:"Board cybersecurity governance (SEC 2023 rules, NACD guidance): boards must have processes to oversee cybersecurity risk. Required board deliverables: 1) Regular briefings (not just during incidents). 2) Material incident notification. 3) Annual cybersecurity risk disclosure (10-K). 4) Board member cybersecurity competency (at least some). Security leadership role: translate technical risk into governance information. Topics: threat landscape, program maturity, material risks, investment effectiveness, regulatory environment. Board oversight requires information flow — security leadership must proactively provide it."},
{q:"Which factor differentiates a 'finding' from a 'risk' in security reporting?",o:["Severity level", "A finding is a discovered issue; risk incorporates business context: the finding × asset criticality × exploitability × business impact = actual risk the organization faces", "CVSS score", "Vulnerability age"],a:1,d:4,e:"Finding vs. risk distinction: 1) Finding: 'SQL injection exists in application X' — technical observation. 2) Risk: 'SQL injection in customer database application could allow theft of 500,000 customer records, resulting in $4M breach cost and regulatory fines' — business impact analysis. Risk reporting is more actionable for leadership. Finding reports tell you what's wrong; risk reports tell you why it matters. Risk quantification frameworks (FAIR, ISO 31000) translate findings to business risk. Executive reporting should focus on risk, not just findings."},
{q:"Which type of third-party security report demonstrates that an organization has independently verified security controls?",o:["Self-attestation letter", "Third-party audit report (SOC 2, ISO 27001 certificate, PCI RoC) — independent verification provides higher assurance than self-attestation", "Internal security review", "Vendor questionnaire responses"],a:1,d:4,e:"Third-party verification hierarchy: 1) Self-attestation (lowest assurance — organization claims own compliance). 2) Customer questionnaires (slightly better — detailed response). 3) Third-party audit (SOC 2, ISO 27001, PCI RoC) — independent qualified auditor verifies. 4) Penetration test by reputable firm. Enterprise customers and partners increasingly require SOC 2 reports. SOC 2 Type 2 (6-12 month period) demonstrates sustained control effectiveness. ISO 27001 certification shows ISMS implementation. These reports are standard enterprise sales requirements for cloud vendors and service providers."},
{q:"Which metric BEST captures whether the security team's time is spent on highest-priority activities?",o:["Hours worked", "% of response effort directed at top-risk findings (highest risk/criticality) vs. long tail of low-risk findings — measures whether limited resources focus where impact is greatest", "Ticket count", "Alert volume"],a:1,d:4,e:"Resource allocation efficiency: if 80% of analyst time addresses low-risk alerts while high-risk incidents wait, the program is misaligned. Metrics: 1) % critical findings addressed within SLA. 2) % analyst time on high-vs-low priority activities. 3) Alert false positive rate (time wasted on noise). 4) MTTD/MTTR by severity. Efficiency improvements: SOAR automation for low-risk tasks, risk-based prioritization queues, alert triage rules suppressing known-good patterns. Demonstrating efficient resource use justifies headcount and tool investment to leadership."},
{q:"Which document is MOST appropriate for sharing post-incident security improvements with the broader organization?",o:["Full forensic report", "Sanitized lessons-learned summary: what happened (business terms), what was improved, and what employees should know — shared appropriately across organizational levels", "Raw IR data", "Vendor report"],a:1,d:4,e:"Post-incident broader communication: 1) Executive summary: strategic implications, program investments. 2) Management summary: operational changes affecting teams. 3) Employee awareness: what happened in general terms, what changed, what employees should do differently. 4) Security team: detailed technical lessons. Each version sanitized for audience. Broader sharing builds security culture — employees learn from incidents and adjust behavior. Technical details stay in restricted reports. Communication demonstrates organizational learning and builds confidence in security program responsiveness."},
{q:"Which attack uses email that appears to come from a legitimate internal user to gain trust from the recipient?",o:["External phishing", "Business Email Compromise (BEC) or spear phishing — attacker spoofs or compromises internal accounts to make malicious requests appear trustworthy", "General spam", "Network attack"],a:1,d:1,e:"BEC attacks: 1) Email spoofing (attacker sends from fake domain looking like real domain). 2) Account compromise (attacker logs into real account and sends from it). 3) Common scenarios: CFO requests wire transfer, CEO instructs payroll change, vendor changes bank account. Detection: DMARC/SPF/DKIM checks, behavioral analysis (unusual requests from exec accounts), wire transfer verification procedures. BEC caused $43B in losses 2016-2021 per FBI IC3 — highest-impact category. Technical controls (DMARC) and process controls (verbal verification for wire transfers) are required together."},
{q:"Which hunting hypothesis is MOST appropriate based on threat intelligence indicating an APT actor uses WMI for persistence?",o:["Hunt for any network anomaly", "Hunt for WMI event subscriptions that call back to external URLs or launch unexpected processes — targeting this specific TTP based on the threat intelligence", "Hunt for new user accounts", "Hunt for failed logins"],a:1,d:1,e:"Hypothesis-driven hunting workflow: 1) Threat intel says APT X uses WMI event subscriptions (T1546.003). 2) Hypothesis: APT X may have installed WMI subscriptions in our environment. 3) Data source: WMI activity logs, WMI repository. 4) Hunt: enumerate all WMI event subscriptions, identify suspicious consumers (external URLs, unusual PowerShell). 5) Verdict: found or not found (both are valuable). Specificity is key — hunting for 'anomalies' is too broad. TTPs from threat intel provide specific hypotheses that are testable with specific data sources."},
{q:"A host is detected communicating with a known Cobalt Strike C2 server. The analyst's first two steps should be:",o:["Delete the Cobalt Strike beacon", "Capture memory and active network connections THEN isolate the host — preserves evidence of beacon configuration and lateral movement while stopping the connection", "Install antivirus", "Scan the host"],a:1,d:1,e:"Cobalt Strike response sequence: 1) Evidence capture (memory dump, active connections, process list) — Cobalt Strike beacon is in memory; captures config, injected processes, lateral movement staging. 2) Isolate network (EDR containment or VLAN change) — stops active C2 communication. 3) Hunt for lateral movement (Cobalt Strike is typically deep in the kill chain — look for pivots). 4) Identify operator TTPs (Cobalt Strike JARM fingerprint, malleable C2 profile). 5) Full scope investigation. Memory evidence is unique — beacon configuration reveals attacker's C2 infrastructure and techniques."},
{q:"Which process creates a 'beacon' communication even when the C2 domain is sinkholedhave?",o:["Email traffic", "DGA fallback — malware generating domain names falls through to backup domains or IPs when primary C2 is sinkholed or blocked", "HTTP traffic", "FTP connection"],a:1,d:1,e:"C2 resilience mechanisms: 1) Domain Generation Algorithm (DGA): if primary C2 blocked/sinkholed, malware tries algorithmically-generated domains. 2) Hard-coded fallback IPs. 3) Peer-to-peer C2 (no central domain). 4) Covert channels (DNS, ICMP, HTTP steganography). Sinkholing one domain doesn't eliminate all C2 — DGA malware generates many potential domains. Response: sinkhole analysis (which hosts hit the sinkhole = infected), but also hunt for DGA activity (NXDOMAIN floods) indicating malware trying other domains."},
{q:"Which security architecture component inspects content of encrypted HTTPS traffic to detect threats?",o:["Firewall only", "TLS inspection / SSL decryption — terminates TLS at security appliance, inspects plaintext, re-encrypts for destination, enabling content inspection", "DNS filtering", "Email filtering"],a:1,d:1,e:"TLS inspection architecture: 1) Security appliance (next-gen firewall, proxy) presents its own certificate to client. 2) Establishes separate TLS session to destination. 3) Decrypts and inspects plaintext content. 4) Re-encrypts to destination. 5) Effective against: malware in HTTPS downloads, C2 over HTTPS, data exfiltration in TLS. Limitations: certificate pinning bypass issues, privacy concerns, performance impact, cannot decrypt true TLS 1.3 in some implementations. Best practice: inspect categories with risk (general web) while excluding privacy-sensitive categories (banking, healthcare) based on URL category."},
{q:"Which data source provides COMPLETE visibility into all files created and deleted on a Windows endpoint?",o:["Antivirus quarantine log", "Sysmon Event ID 11 (FileCreate) and 23 (FileDelete) — comprehensive file system activity monitoring with timestamps, file paths, and hashing", "Windows Defender log", "Application event log"],a:1,d:1,e:"Sysmon file monitoring: Event 11 (FileCreate): captures creation time, file path, MD5/SHA256 hash (with Sysmon config). Event 23 (FileDelete): captures deletions. Event 2 (FileCreationTimeChanged): timestomping detection. Configurations: monitor all files (high volume) or targeted paths (sensitive directories, temp, downloads). Critical for: detecting malware dropped to disk, staging directories created for exfiltration, cleanup activity (attacker deleting tools). Filter: exclude high-volume benign paths (browser cache) to manage log volume while maintaining coverage of attack-relevant paths."},
{q:"Which technique do attackers use to exfiltrate data slowly to avoid triggering volume-based anomaly detection?",o:["Large burst transfers", "Low-and-slow exfiltration: small amounts of data transferred periodically over extended time, staying below anomaly thresholds — steganography, DNS tunneling, or small HTTPS transfers", "Using internal file shares", "Email attachments"],a:1,d:1,e:"Low-and-slow exfiltration techniques: 1) Small regular transfers blending with normal traffic. 2) DNS tunneling (data in DNS query labels — slow but covert). 3) HTTPS steganography (data hidden in headers or TLS timing). 4) Cloud storage (uploading to personal Box/Dropbox — looks like sync traffic). 5) Compressed/encrypted data (maximizes data per connection). Detection challenges: volume thresholds don't trigger, individual transfers look normal. Detection requires: long-term baseline, destination analysis (is there a corporate Box account?), DNS anomaly analysis, data classification (is sensitive data involved?)."},
{q:"A security team detects connections from an internal host to a Tor exit node. This MOST likely indicates:",o:["Normal VPN usage", "Malware C2 communication over Tor to evade detection and attribution — Tor connections from corporate networks are unusual and commonly associated with malware", "Legitimate privacy browsing", "Test activity"],a:1,d:1,e:"Tor from corporate network: 1) Malware using Tor for C2 (anonymizes operator, evades IP-based blocklists). 2) Employee bypassing controls (less security concern than malware). 3) Red team activity. Corporate networks should block Tor exit nodes and Tor relays at the perimeter. Detection: Tor relay IP lists (Tor Project publishes them), characteristic Tor traffic (port 9001/9050, specific TLS patterns). Immediate response: isolate host, investigate connecting process, check for malware indicators, hunt for similar activity on other hosts."}
];

// ── CySA+ FLASHCARDS ─────────────────────────────────────────────────────────
var FLASH_CARDS=[
{front:"SIEM",back:"Security Information and Event Management — aggregates logs from multiple sources, normalizes them, and applies correlation rules to detect threats. Provides centralized visibility. Examples: Splunk, Microsoft Sentinel, IBM QRadar."},
{front:"SOAR",back:"Security Orchestration, Automation, and Response — automates repetitive SOC tasks (alert triage, threat intel enrichment, ticket creation) and coordinates response actions across tools. Reduces analyst workload and response time."},
{front:"EDR",back:"Endpoint Detection and Response — provides continuous monitoring, recording, and analysis of endpoint activity. Detects behavioral threats (process injection, credential dumping) that traditional AV misses. Enables threat hunting and remote remediation."},
{front:"NDR",back:"Network Detection and Response — monitors network traffic for malicious activity using behavioral analysis and ML. Detects lateral movement, C2 traffic, and data exfiltration that endpoint tools miss."},
{front:"UEBA",back:"User and Entity Behavior Analytics — establishes behavioral baselines per user and entity, flags statistical anomalies. Detects insider threats and compromised accounts using legitimate credentials. Often integrated into SIEM."},
{front:"MITRE ATT&CK",back:"Adversarial Tactics, Techniques, and Common Knowledge — knowledge base of real-world adversary behaviors organized by tactic (why) and technique (how). Used for threat hunting, detection engineering, red/blue team exercises, and gap analysis."},
{front:"Pyramid of Pain",back:"Framework showing relative difficulty for attackers if defenders detect and block each indicator type. Bottom (easy to change): Hash values, IP addresses. Middle: Domain names, Network artifacts, Host artifacts. Top (hardest): Tools, TTPs."},
{front:"Diamond Model",back:"Intrusion analysis framework with 4 features: Adversary, Capability, Infrastructure, Victim. Analysts pivot between features to understand campaigns and attribute attacks. Meta-features: timestamp, phase, result, direction."},
{front:"Kill Chain",back:"Lockheed Martin: 7 phases of an attack — Reconnaissance, Weaponization, Delivery, Exploitation, Installation, Command & Control, Actions on Objectives. Each phase = interdiction opportunity. Earlier disruption = more effective defense."},
{front:"IOC",back:"Indicator of Compromise — artifact showing a system may be compromised: file hashes, malicious IPs/domains, registry keys, mutex names. Tactical, specific, and may become stale quickly. Compare to IOA (Indicator of Attack) which describes behavior."},
{front:"IOA",back:"Indicator of Attack — behavioral pattern indicating an attack in progress regardless of specific tools: unusual child process relationships, encoded PowerShell, LSASS access patterns. More durable than IOCs; works against novel malware."},
{front:"STIX/TAXII",back:"STIX: format for describing cyber threat intelligence (actors, TTPs, indicators). TAXII: transport protocol for sharing STIX data between organizations and tools. Together they enable automated, standardized threat intelligence sharing."},
{front:"TTP",back:"Tactics, Techniques, and Procedures — describes HOW an adversary operates. Tactics = goals (persistence, lateral movement). Techniques = methods (WMI event subscription). Procedures = specific implementation. TTPs are at the top of the Pyramid of Pain."},
{front:"CVSS",back:"Common Vulnerability Scoring System — standard for rating severity of vulnerabilities. Base score (0-10) from Attack Vector, Attack Complexity, Privileges Required, User Interaction, Scope, CIA Impact. Also Temporal and Environmental scores for context."},
{front:"EPSS",back:"Exploit Prediction Scoring System — ML-based probability (0-1) that a CVE will be exploited in the next 30 days. Complements CVSS (technical severity) with exploitation likelihood. Maintained by FIRST. High EPSS + high CVSS = top priority."},
{front:"CISA KEV",back:"Known Exploited Vulnerabilities catalog — CISA-maintained list of CVEs with confirmed active exploitation in the wild. Federal agencies must patch KEV entries within 2-3 weeks. Highest-priority remediation regardless of CVSS score."},
{front:"DAST",back:"Dynamic Application Security Testing — tests running web applications by sending malicious inputs. Finds: SQLi, XSS, SSRF, broken authentication. Tools: OWASP ZAP, Burp Suite. Contrast with SAST (source code analysis) and IAST (runtime instrumentation)."},
{front:"SAST",back:"Static Application Security Testing — analyzes source code without executing it to find security flaws. Finds: hardcoded credentials, insecure functions, input validation issues. Integrated into CI/CD for shift-left security. False positive rate can be high."},
{front:"SCA",back:"Software Composition Analysis — identifies open source libraries and checks them against vulnerability databases (NVD). Finds transitive/dependency vulnerabilities like Log4Shell. Tools: Snyk, Black Duck, OWASP Dependency Check."},
{front:"CSPM",back:"Cloud Security Posture Management — continuously scans cloud infrastructure for misconfigurations. Finds: public S3 buckets, overpermissive IAM, unencrypted storage, missing logging. Provides compliance benchmarking against CIS and cloud-native frameworks."},
{front:"MTTD",back:"Mean Time to Detect — average time from initial compromise to security team awareness. Global average: 200+ days for APTs. Reducing MTTD limits attacker dwell time and breach scope. Improved by threat hunting, UEBA, and better detection coverage."},
{front:"MTTR",back:"Mean Time to Respond/Remediate — average time from detection to full resolution. In vulnerability management: time from disclosure to patch. In incident response: time from detection to containment/recovery. Lower MTTR = less business impact."},
{front:"Threat Hunting",back:"Proactive searching for threats that automated detection missed. Assumes compromise and hunts for evidence. Hypothesis-driven: uses threat intelligence to form specific theories then tests them. Complements reactive IR."},
{front:"OSINT",back:"Open Source Intelligence — information gathered from publicly available sources: social media, job postings, DNS records, WHOIS, Shodan, GitHub. Used by attackers for reconnaissance and defenders for threat intelligence and attack surface assessment."},
{front:"DGA",back:"Domain Generation Algorithm — malware technique generating pseudo-random domain names to find C2 servers. Attackers pre-register one generated domain; malware tries hundreds until one resolves. Detected by: high NXDOMAIN rate, random-looking domains, statistical analysis."},
{front:"Beaconing",back:"Regular, periodic callback from malware to C2 server to receive commands. Creates detectable timing patterns in network traffic. Sophisticated malware uses jitter (random delay variation) to blend with normal traffic. Detected by statistical analysis of connection intervals."},
{front:"LOLBIN/LOTL",back:"Living Off the Land Binaries/Techniques — attackers use legitimate OS tools (PowerShell, certutil, WMI, PsExec) to avoid malware detection. No suspicious files dropped; blends with normal admin activity. Detected by: process behavior analysis, command-line monitoring."},
{front:"Pass-the-Hash",back:"Attack using captured NTLM hash to authenticate without knowing plaintext password. Works against systems using NTLM authentication. Countermeasures: disable NTLM, use Kerberos, implement PAM, enable Protected Users group, deploy Windows Defender Credential Guard."},
{front:"Golden Ticket",back:"Kerberos attack using forged Ticket Granting Tickets (TGTs) created with the KRBTGT account hash. Valid for 10 years, works even after password changes. Requires domain admin to dump KRBTGT hash. Response: rotate KRBTGT password TWICE."},
{front:"Process Injection",back:"Injecting malicious code into a legitimate running process to hide and inherit its privileges. Types: DLL injection, process hollowing, reflective DLL injection. Target: lsass.exe (credential theft), svchost.exe (blending in). Detected by: EDR memory scanning, API hooking."},
{front:"Lateral Movement",back:"Techniques for moving through a network after initial compromise: Pass-the-Hash, Pass-the-Ticket, WMI remote execution, PsExec, RDP, SSH. Goal: reach high-value targets (domain controllers, data stores). Detected by: internal network monitoring, authentication anomalies."},
{front:"NIST 800-61",back:"Computer Security Incident Handling Guide. Defines 4 IR phases: Preparation, Detection & Analysis, Containment/Eradication/Recovery, Post-Incident Activity. The foundational IR framework. Supplements available for specific incident types."},
{front:"Chain of Custody",back:"Documentation proving evidence integrity from collection through legal proceedings. Records: who collected, when, how, transfers between custodians, storage conditions. Enables legal admissibility. Cryptographic hashing proves no modification occurred."},
{front:"Order of Volatility",back:"Evidence collection priority: CPU registers → RAM → Network state → Running processes → Disk → Removable media. Most volatile (RAM) captured first — lost on reboot. Governs IR evidence collection sequence."},
{front:"Legal Hold",back:"Suspension of normal data retention/deletion policies when litigation is reasonably anticipated. Preserves ESI (electronically stored information) for potential legal proceedings. Failure to implement = spoliation (evidence destruction) sanctions."},
{front:"CVSS Attack Vector",back:"Network (N): exploitable over internet — highest severity. Adjacent (A): requires same local network. Local (L): requires local access/login. Physical (P): requires physical interaction. Network-vectored vulnerabilities are highest priority."},
{front:"CVSS Scope",back:"Scope: Changed (C) = vulnerability can affect components beyond the vulnerable one (e.g., VM escape affects host). Scope: Unchanged (U) = impact limited to the vulnerable component. Scope:Changed vulnerabilities receive higher scores."},
{front:"Responsible Disclosure",back:"Notifying vendor of vulnerability privately before public disclosure. Standard: 90-day deadline (Google Project Zero model). Allows vendor to develop and test patch. Coordinated public disclosure when fix is available. Protects all users of the vulnerable software."},
{front:"OSCP/Scoping Document",back:"Rules of Engagement for penetration tests. Defines: in-scope systems, permitted techniques, timing restrictions, emergency stop conditions, and contact procedures. Protects both tester and organization legally. Testing outside scope creates liability."},
{front:"JA3/JA3S",back:"TLS fingerprinting method hashing client hello parameters (JA3) or server hello (JA3S). Identifies TLS implementations regardless of certificate. Many malware families have distinctive JA3 fingerprints. Detects C2 traffic mimicking legitimate HTTPS by identifying unusual TLS implementations."},
{front:"Shimcache",back:"Windows Application Compatibility Cache recording metadata about executed files (path, size, last modified time). Persists after file deletion — forensic evidence of execution history. Located: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache."},
{front:"Prefetch",back:"Windows performance optimization caching execution data for recently-run programs (.pf files in C:\\Windows\\Prefetch). Records: executable name, run count, up to 8 last run timestamps, files referenced. Forensic evidence of execution even after file deletion."},
